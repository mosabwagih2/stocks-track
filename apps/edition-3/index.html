<title>Fémini Stock</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Readex+Pro:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: right-hand rail (bottom bar on phones) + one working column. Each screen is built around the daily question it answers.
   Palette: Fémini lavender brand (ink, accent, page, line, lav) + semantic status colors kept separate from the accent. */
:root{
  --page:#fcf9fe;--surface:#ffffff;--lav:#f5f1fd;--ink:#302568;--accent:#5e4394;--on-accent:#ffffff;--muted:#5a5178;
  --line:#e3dcf3;--line2:#cfc2ec;--grid:#ece6f7;--rail:#302568;--on-rail:#f1ecfb;--rail-mute:#b9aedd;--shadow:0 1px 2px rgba(48,37,104,.06),0 8px 24px -12px rgba(48,37,104,.18);
  --crit:#a8231a;--crit-bg:#fbe7e5;--crit-line:#efc3be;--warn:#8a4a07;--warn-bg:#fcf0dc;--warn-line:#efd3a6;
  --good:#0c6b43;--good-bg:#e4f3ea;--good-line:#b9dfc9;--info:#1f528f;--info-bg:#e0ebfa;--info-line:#b9d0ee;--lost:#74278a;--lost-bg:#f2e1f7;
  --c-ready:#2f9e75;--c-dirty:#d89a2b;--c-scrap:#cf4a52;--c-factory:#4a86d6;--c-lost:#a05bb8;--swb:#cfc8de;
  --f-ar:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;--f-disp:'Readex Pro','IBM Plex Sans Arabic',sans-serif;--f-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#14111f;--surface:#1c1830;--lav:#252040;--ink:#ece8fa;--accent:#b9a4f0;--on-accent:#14111f;--muted:#aaa2c6;
  --line:#2f2950;--line2:#463e6c;--grid:#2c2649;--rail:#0f0c1a;--on-rail:#ece8fa;--rail-mute:#9d94c2;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
  --crit:#ff8d94;--crit-bg:#3a1a1e;--crit-line:#6b2c33;--warn:#f0b960;--warn-bg:#35280f;--warn-line:#6b4f1c;
  --good:#5fd0a0;--good-bg:#12302a;--good-line:#246650;--info:#8db8f5;--info-bg:#14283f;--info-line:#274d7a;--lost:#d9a0ea;--lost-bg:#2f1a39;
  --c-ready:#3fb589;--c-dirty:#e3a93f;--c-scrap:#e0606a;--c-factory:#5f98e6;--c-lost:#b873cf;--swb:#5a5280;color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#14111f;--surface:#1c1830;--lav:#252040;--ink:#ece8fa;--accent:#b9a4f0;--on-accent:#14111f;--muted:#aaa2c6;
  --line:#2f2950;--line2:#463e6c;--grid:#2c2649;--rail:#0f0c1a;--on-rail:#ece8fa;--rail-mute:#9d94c2;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
  --crit:#ff8d94;--crit-bg:#3a1a1e;--crit-line:#6b2c33;--warn:#f0b960;--warn-bg:#35280f;--warn-line:#6b4f1c;
  --good:#5fd0a0;--good-bg:#12302a;--good-line:#246650;--info:#8db8f5;--info-bg:#14283f;--info-line:#274d7a;--lost:#d9a0ea;--lost-bg:#2f1a39;
  --c-ready:#3fb589;--c-dirty:#e3a93f;--c-scrap:#e0606a;--c-factory:#5f98e6;--c-lost:#b873cf;--swb:#5a5280;color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font:14px/1.6 var(--f-ar);direction:rtl;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{font-family:var(--f-disp);font-weight:500;text-wrap:balance;letter-spacing:0}
.mono,.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.n{direction:ltr;unicode-bidi:isolate;display:inline-block}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* shell */
.shell{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}
.rail{background:var(--rail);color:var(--on-rail);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:20px 12px;gap:4px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.brand b{font-family:var(--f-disp);font-weight:600;font-size:20px;letter-spacing:.01em}
.brand i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#9a7fe0,#5e4394);display:grid;place-items:center;font-style:normal;font-family:var(--f-disp);font-weight:600;color:#fff}
.brand small{display:block;color:var(--rail-mute);font-size:11px;line-height:1.2}
.nav{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--rail-mute);font-weight:500;position:relative}
.nav:hover{background:rgba(255,255,255,.07);color:var(--on-rail)}
.nav[aria-current=page]{background:rgba(255,255,255,.12);color:#fff}
.nav svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav .bd{margin-inline-start:auto;background:#e0606a;color:#fff;border-radius:99px;font:600 11px/1 var(--f-mono);padding:4px 7px}
.rail .sp{flex:1}
.rail .foot{padding:10px;color:var(--rail-mute);font-size:12px;display:grid;gap:8px}
.tbtn{all:unset;cursor:pointer;display:inline-flex;gap:8px;align-items:center;color:var(--rail-mute);font-size:12px;padding:6px 8px;border-radius:8px}
.tbtn:hover{background:rgba(255,255,255,.07);color:#fff}

.main{padding-block:22px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0;max-width:1240px;width:100%}
.top{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-size:26px;line-height:1.25}
.top .sub{color:var(--muted);margin-top:2px}
.top .tools{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* controls */
.btn{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);cursor:pointer;font-weight:500;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.danger{color:var(--crit);border-color:var(--crit-line)}
.btn[disabled],.btn[aria-disabled=true]{opacity:.45;cursor:not-allowed;pointer-events:none}
input,select,textarea{background:var(--surface);border:1px solid var(--line2);border-radius:9px;padding:8px 10px;min-width:0;max-width:100%}
input[type=number]{font-family:var(--f-mono);text-align:center;width:76px;direction:ltr}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);padding:0}
textarea{width:100%;min-height:70px;font-family:var(--f-mono);direction:ltr}
label.f{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
label.f>input,label.f>select{font-size:14px;color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{all:unset;box-sizing:border-box;cursor:pointer;padding:5px 12px;border-radius:99px;border:1px solid var(--line2);background:var(--surface);font-size:13px;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed=true]{background:var(--ink);color:var(--page);border-color:var(--ink)}
:root[data-theme="dark"] .chip[aria-pressed=true]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed=true]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}}
.chip .n{font-size:12px;opacity:.75}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{all:unset;cursor:pointer;padding:7px 14px;font-weight:500;font-size:13px;border-inline-start:1px solid var(--line2)}
.seg button:first-child{border-inline-start:0}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.card.flat{box-shadow:none}
.card.lift{box-shadow:var(--shadow)}
.card h2{font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h2 .hint{font:400 12px var(--f-ar);color:var(--muted);margin-inline-start:auto}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.split2{grid-template-columns:minmax(0,1fr) 340px}
.stack{display:grid;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--line2);background:var(--lav);white-space:nowrap}
.pill.crit{background:var(--crit-bg);color:var(--crit);border-color:var(--crit-line)}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-line)}
.pill.good{background:var(--good-bg);color:var(--good);border-color:var(--good-line)}
.pill.info{background:var(--info-bg);color:var(--info);border-color:var(--info-line)}
.pill.lost{background:var(--lost-bg);color:var(--lost);border-color:var(--lost-bg)}
.dot{width:9px;height:9px;border-radius:99px;display:inline-block;flex:none}
.sw{width:12px;height:12px;border-radius:99px;border:1px solid var(--swb);display:inline-block;vertical-align:-1px}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 12px;text-align:start;border-bottom:1px solid var(--grid);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--lav);white-space:nowrap;position:sticky;top:0}
tr:last-child td{border-bottom:0}
tbody tr[data-a]{cursor:pointer}
tbody tr[data-a]:hover td{background:var(--lav)}
td.num,th.num{text-align:center}
.t-sm td,.t-sm th{padding:6px 10px}

/* big numbers */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:2px}
button.kpi{text-align:start;cursor:pointer;width:100%}
button.kpi:hover{border-color:var(--accent)}
.kpi small{color:var(--muted);font-weight:500}
.kpi b{font:600 28px/1.2 var(--f-mono);letter-spacing:-.02em}
.kpi em{font-style:normal;color:var(--muted);font-size:12px}
.kpi.crit b{color:var(--crit)}.kpi.warn b{color:var(--warn)}.kpi.good b{color:var(--good)}

/* flow bar */
.flow{display:flex;height:16px;border-radius:99px;overflow:hidden;background:var(--grid);gap:2px}
.flow i{display:block;min-width:0}
.flow .a{background:var(--c-ready)}.flow .b{background:var(--line2)}.flow .c{background:var(--c-scrap)}
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:12px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.srow{all:unset;box-sizing:border-box;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 8px;margin-inline:-8px;border-radius:9px;width:calc(100% + 16px)}
.srow:hover{background:var(--lav)}
.srow:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ratechip{all:unset;cursor:pointer;display:inline-block;margin-top:4px;font-size:13px;color:var(--muted);border-radius:8px}
.ratechip:hover{color:var(--accent)}
.ratechip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hb .tr.m{position:relative;overflow:visible}
.hb .tr.m b{position:absolute;inset-inline-start:var(--x);top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:2px;opacity:.7}
.wk{display:flex;align-items:flex-end;gap:10px;padding-top:6px}
.wk .g{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.wk .p{display:flex;align-items:flex-end;gap:3px;height:150px}
.wk .p i{display:block;width:16px;border-radius:6px 6px 2px 2px;min-height:2px}
.wk .l{font:500 11px var(--f-mono);color:var(--muted);white-space:nowrap}
.wk .v{font:500 11px var(--f-mono)}
.wk .g.now .l{color:var(--ink);font-weight:700}
.hb{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) auto;gap:10px;align-items:center;padding:3px 0}
.hb .tr{height:10px;background:var(--grid);border-radius:99px;overflow:hidden}
.hb .tr i{display:block;height:100%;background:var(--accent);border-radius:99px}
.hb .tr i.w{background:var(--c-dirty)}.hb .tr i.c{background:var(--c-scrap)}.hb .tr i.g{background:var(--c-ready)}
.hb .v{font:500 13px var(--f-mono);min-width:40px;text-align:end}
.hb .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* action queue */
.queue{display:grid;gap:8px}
.q{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.q .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:700}
.q.crit{border-color:var(--crit-line);background:var(--crit-bg)}.q.crit .ic{background:var(--crit);color:#fff}
.q.warn{border-color:var(--warn-line);background:var(--warn-bg)}.q.warn .ic{background:var(--warn);color:#fff}
.q.info .ic{background:var(--info);color:#fff}
:root[data-theme="dark"] .q .ic{color:#14111f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .q .ic{color:#14111f}}
.q b{display:block}.q span{color:var(--muted);font-size:13px}
.q.crit span,.q.warn span{color:inherit;opacity:.85}
.q.crit b{color:var(--crit)}.q.warn b{color:var(--warn)}

/* stock */
.wh{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
.mlist{display:grid;gap:2px;max-height:calc(100vh - 220px);overflow-y:auto;padding:6px}
.mgrp{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.06em;padding:10px 10px 4px;text-transform:uppercase}
.mi{all:unset;box-sizing:border-box;display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 10px;border-radius:10px;cursor:pointer}
.mi:hover{background:var(--lav)}
.mi[aria-current=true]{background:var(--ink);color:var(--page)}
:root[data-theme="dark"] .mi[aria-current=true]{background:var(--accent);color:var(--on-accent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mi[aria-current=true]{background:var(--accent);color:var(--on-accent)}}
.mi b{font-family:var(--f-mono);font-size:13px}
.mi small{opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mx{border-collapse:separate;border-spacing:4px;width:auto}
.mx th{background:none;position:static;text-align:center;border:0;padding:4px 6px}
.mx td{padding:0;border:0}
.mx .cl{padding:0 8px 0 4px;white-space:nowrap;font-weight:500;text-align:start}
.cell{all:unset;box-sizing:border-box;cursor:pointer;display:grid;place-items:center;min-width:58px;height:46px;border-radius:10px;background:var(--lav);font:500 15px var(--f-mono);position:relative;border:1px solid transparent}
.cell:hover{border-color:var(--accent)}
.cell.tg{font-size:16px;cursor:pointer}
.cell.tg small{position:absolute;bottom:2px;inset-inline:0;text-align:center;font:400 9px var(--f-ar);line-height:1}
.cell.tg.on{background:var(--good-bg);color:var(--good);border-color:var(--good-line)}
.cell.tg.new{background:var(--info-bg);color:var(--info);border-color:var(--info-line)}
.cell.tg.del{background:var(--crit-bg);color:var(--crit);border-color:var(--crit-line)}
.cell.tg.off{background:var(--grid);color:var(--muted);opacity:.75}
.cell.tg.lock{background:var(--lav);color:var(--muted);cursor:not-allowed;font-size:14px}
.cell.z{color:var(--muted);background:var(--grid)}
.cell.w{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-line)}
.cell.c{background:var(--crit-bg);color:var(--crit);border-color:var(--crit-line)}
.cell small{position:absolute;bottom:2px;inset-inline:0;text-align:center;font:400 9.5px var(--f-ar);opacity:.8;line-height:1}
.cell .dy{position:absolute;top:3px;inset-inline-end:4px;width:7px;height:7px;border-radius:9px;background:var(--c-dirty)}
.stk{display:flex;height:14px;border-radius:99px;overflow:hidden;gap:2px;background:var(--grid)}
.stk i{display:block;min-width:2px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,17,31,.45);z-index:40}
.sheet{position:fixed;z-index:41;top:0;bottom:0;left:0;width:min(560px,100%);background:var(--page);border-inline-end:1px solid var(--line2);box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.sheet>header{display:flex;gap:10px;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.sheet>header h2{font-size:18px}
.sheet>header .x{margin-inline-start:auto}
.sheet>div.body{padding:18px;overflow-y:auto;flex:1;display:grid;gap:16px;align-content:start;padding-bottom:max(18px,env(safe-area-inset-bottom,0px))}
.drop{border:1.5px dashed var(--line2);border-radius:14px;padding:22px;text-align:center;display:grid;gap:6px;cursor:pointer;background:var(--surface)}
.drop:hover,.drop.on{border-color:var(--accent);background:var(--lav)}
.msg{padding:10px 14px;border-radius:10px;border:1px solid var(--line2);background:var(--lav)}
.msg.crit{background:var(--crit-bg);border-color:var(--crit-line);color:var(--crit)}
.msg.warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
.msg.good{background:var(--good-bg);border-color:var(--good-line);color:var(--good)}
.msg ul{margin:6px 0 0;padding-inline-start:18px}

/* operations */
.opgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.op{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:4px;align-content:start}
.op:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.op .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--lav);color:var(--accent);margin-bottom:6px}
.op .ic svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.op b{font-weight:600}.op small{color:var(--muted);line-height:1.45}.op em{font:500 11px var(--f-mono);color:var(--accent);font-style:normal;direction:ltr;text-align:start}
.gh{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin:6px 0 8px}
.picker{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--lav)}
.picker label{min-width:120px;flex:1 1 120px}
.stp{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:9px;background:var(--surface);overflow:hidden}
.stp button{all:unset;cursor:pointer;width:30px;height:34px;text-align:center;font-weight:700;color:var(--accent)}
.stp button:hover{background:var(--lav)}
.stp input{border:0;border-radius:0;width:62px;padding:6px 0}
.sum{position:sticky;top:16px;display:grid;gap:12px}
.eff{display:grid;gap:6px;max-height:340px;overflow-y:auto}
.eff .e{display:grid;gap:2px;padding:8px 10px;border-radius:10px;background:var(--lav);font-size:13px}
.eff .e .t{display:flex;gap:8px;justify-content:space-between;font-weight:600}

  const end=S.date,MAXD=28,pkD={},cnt={};S.pickups.forEach(p=>pkD[p.id]=p.date);let first=null;
  S.orders.forEach(o=>{if(o.st==='cx')return;const d=pkD[o.pk];if(!d)return;const age=dayDiff(d,end);if(age<0)return;if(first===null||d<first)first=d;
    if(age<MAXD)o.lines.forEach(sk=>{(cnt[sk]||(cnt[sk]=Array(MAXD).fill(0)))[age]++})});
  const span=first===null?0:Math.min(MAXD,Math.max(1,dayDiff(first,end)+1));let ws=0;for(let i=0;i<span;i++)ws+=Math.pow(.5,i/7);
  const lead=+rv('leadW'),tgt=+rv('tgtW'),safe=+rv('safeW'),z=zOf(rv('svc')),L=lead*7,out={};
  D.skus.forEach(k=>{const dl=(cnt[k.id]||[]).slice(0,span);let w=0;dl.forEach((v,i)=>w+=v*Math.pow(.5,i/7));
    const rd=span&&dl.length?w/ws:0,mean=span&&dl.length?dl.reduce((a,v)=>a+v,0)/span:0,sd=span>=7&&dl.length?Math.sqrt(dl.reduce((a,v)=>a+(v-mean)*(v-mean),0)/(span-1)):null;
    const ss=rd>0?(sd!=null?z*sd*Math.sqrt(L):safe*7*rd):0;out[k.id]={rd,sd,ss,rop:rd*L+ss,tgt:rd*7*(lead+tgt)+ss}});

}

  rows.slice(1).forEach(r=>{

    const o={ref,wb:r[ix.wb],type:String(r[ix.ty]).indexOf('استبدال')>=0?'استبدال':'جديد',gov:r[ix.gov],total:r[ix.total],lines:[],pk:pkId,st:'open',sc:null,bad:[]};

const srcLoc=(d)=>d.type==='CLN'?d.hdr.from:d.type==='FSD'?(d.hdr.kind==='wash'?'DIRTY':'SCRAP'):d.type==='FRC'?'FACTORY':d.type==='LOS'?'LOST':d.type==='SHP'?'READY':null;
function newDoc(type,pre){
  pre=pre||{};
  const d={id:'d'+(S.did++),type,status:'draft',no:null,date:S.date,by:S.actor,hdr:{},lines:[],log:[logE('اتفتحت مسودة')]};
  if(type==='RCV')d.hdr={ref:'',declared:''};
  if(type==='RTN')d.hdr={channel:'VENDOOR',codes:'',counted:false,unk:[],refs:[],sheet:null};
  if(type==='SHP')d.hdr={note:''};
  if(type==='CLN')d.hdr={from:'READY',to:'DIRTY',reason:''};
  if(type==='FSD')d.hdr={kind:'wash'};
  if(type==='CNT')d.hdr={state:'READY',models:[],snap:{},cnt:{},reveal:false,ack:false,started:false};
  if(pre.sku)addLine(d,pre.sku,pre.q||1);
  if(pre.hdr)Object.assign(d.hdr,pre.hdr);
  S.docs.push(d);UI.doc=d.id;UI.msg=null;dirty();return d;
}
function addLine(d,sku,q){
  q=Math.max(1,+q||1);const l=d.lines.find(x=>x.sku===sku);
  if(l){if(d.type==='RTN')l.exp+=q;else l.q+=q;return}
  d.lines.push(d.type==='RTN'?{sku,exp:q,r:'',d:'',x:''}:d.type==='FRC'?{sku,q,rej:0}:d.type==='LOS'?{sku,q,res:'FOUND'}:{sku,q});
}
const num=v=>Math.max(0,Math.floor(+v||0));
function scnLines(d){const a={};d.hdr.refs.forEach(r=>{const o=orderByRef(r);if(o)o.lines.forEach(s=>a[s]=(a[s]||0)+1)});return Object.keys(a).sort(skuSort).map(s=>({sku:s,q:a[s]}))}
function build(d){
  const mv=[],checks=[],warn=[];
  const add=(sku,q,from,to,note)=>{if(q>0)mv.push({sku,q,from,to,note})};
  const chk=(ok,t)=>checks.push({ok:!!ok,t});
  const H=d.hdr,L=d.lines;
  if(d.type==='RCV'){
    L.forEach(l=>add(l.sku,num(l.q),'EXT_FACTORY','READY','استلام من المصنع'+(H.ref?' · إذن '+H.ref:'')));
    const tot=L.reduce((a,l)=>a+num(l.q),0);
    chk(tot>0,'فيه أصناف مضافة');chk(PH[d.id]||d.photo,'صورة الورقة الموقّعة مرفوعة');
    chk(H.declared!==''&&H.declared!=null,'إجمالي القطع المكتوب في الورقة متسجّل');
    if(H.declared!==''&&H.declared!=null)chk(+H.declared===tot,'المكتوب في الورقة ('+fmt(+H.declared)+') = المضاف ('+fmt(tot)+')');
  }else if(d.type==='SHP'){
    L.forEach(l=>add(l.sku,num(l.q),'READY','EXT_SHOP','توريد للمحل'+(H.note?' · '+H.note:'')));
    chk(L.length>0,'فيه أصناف مضافة');chk(PH[d.id]||d.photo,'صورة الورقة الموقّعة مرفوعة');
  }else if(d.type==='CLN'){
    L.forEach(l=>add(l.sku,num(l.q),H.from,H.to,'من '+LOC[H.from]+' إلى '+LOC[H.to]+(H.reason?' · '+H.reason:'')));
    chk(L.length>0,'فيه أصناف مضافة');
  }else if(d.type==='FSD'){
    L.forEach(l=>H.kind==='wash'?add(l.sku,num(l.q),'DIRTY','FACTORY','غسيل مجاني'):add(l.sku,num(l.q),'SCRAP','EXT_FACTORY','هالك اتسلّم للمصنع'));
    chk(L.length>0,'فيه أصناف مضافة');
  }else if(d.type==='FRC'){
    L.forEach(l=>{add(l.sku,num(l.q),'FACTORY','READY','رجع مغسول');add(l.sku,num(l.rej),'FACTORY','SCRAP','مرفوض بعد الغسيل')});
    chk(L.length>0,'فيه أصناف مضافة');
  }else if(d.type==='LOS'){
    L.forEach(l=>l.res==='FOUND'?add(l.sku,num(l.q),'LOST','READY','لقيناه'):add(l.sku,num(l.q),'LOST','EXT_OFF','تسوية: شطب المفقود'));
    chk(L.length>0,'فيه أصناف مضافة');
  }else if(d.type==='RTN'){
    let lostN=0,over=0;
    L.forEach(l=>{const r=num(l.r),dd=num(l.d),x=num(l.x),got=r+dd+x,exp=num(l.exp);
      add(l.sku,r,'EXT_CH','READY','مرتجع سليم');add(l.sku,dd,'EXT_CH','DIRTY','مرتجع محتاج نظافة');add(l.sku,x,'EXT_CH','SCRAP','مرتجع هالك نهائي');
      if(got<exp){add(l.sku,exp-got,'EXT_CH','LOST','ناقص من المرتجع');lostN+=exp-got}
      if(got>exp){over+=got-exp;warn.push(skuName(l.sku)+': استلمت أكتر من المتوقع بـ '+(got-exp)+' (هتتسجل زيادة)')}});
    chk(L.length>0,'فيه أصناف متوقعة');chk(H.counted,'خلّصت عدّ كل الأصناف');
    if(lostN)warn.push('الناقص '+fmt(lostN)+' قطعة هيتسجل مفقود ومربوط بالقناة');
  }else if(d.type==='SCN'){
    scnLines(d).forEach(l=>add(l.sku,l.q,'READY','EXT_CH','سكان: '+H.emp));
    chk(H.refs.length>0,'فيه أوردرات متشحنة');chk((H.emp||'').trim(),'اسم الموظف متسجّل');
    scnLines(d).forEach(l=>{if(g(l.sku,'READY')<l.q)warn.push(skuName(l.sku)+': الرصيد '+g(l.sku,'READY')+' والمشحون '+l.q+'. هيبقى بالسالب، راجع الجرد')});
  }else if(d.type==='CNT'){
    const keys=Object.keys(H.cnt).filter(s=>H.cnt[s]!==''&&H.cnt[s]!=null);
    let conflict=0;
    keys.forEach(s=>{const now=g(s,H.state),c=num(H.cnt[s]),diff=c-now;if(now!==(H.snap[s]!=null?H.snap[s]:now))conflict++;
      if(diff>0)add(s,diff,'EXT_ADJ',H.state,'زيادة جرد');else if(diff<0)add(s,-diff,H.state,'EXT_ADJ','عجز جرد')});
    chk(keys.length>0,'فيه أصناف اتعدّت');chk(H.reveal,'كشفت الفروق وراجعتها');
    if(conflict){chk(H.ack,conflict+' صنف الرصيد اتغيّر من وقت بداية الجرد. وافقت إن الفرق يتحسب على الرصيد الحالي');}
  }
  if(d.type!=='SCN')chk(d.date<=S.date&&d.date>=addDays(S.date,-3),'التاريخ ضمن آخر 3 أيام ومش في المستقبل');
  const err=[];
  if(d.type!=='SCN'){
    const sim={};
    mv.forEach(m=>{if(INTERNAL.indexOf(m.from)<0)return;const k=m.sku+'|'+m.from,cur=(k in sim)?sim[k]:g(m.sku,m.from);
      if(cur<m.q)err.push(skuName(m.sku)+': المتاح في '+LOC[m.from]+' هو '+cur+' والمطلوب '+m.q);sim[k]=cur-m.q;
      if(INTERNAL.indexOf(m.to)>=0){const k2=m.sku+'|'+m.to;sim[k2]=((k2 in sim)?sim[k2]:g(m.sku,m.to))+m.q}});
  }
  return {mv,checks,warn,err,ok:checks.every(c=>c.ok)&&!err.length&&mv.length>0};
}
function effects(mv){
  const by={};
  mv.forEach(m=>{const o=by[m.sku]||(by[m.sku]={});if(INTERNAL.indexOf(m.from)>=0)o[m.from]=(o[m.from]||0)-m.q;if(INTERNAL.indexOf(m.to)>=0)o[m.to]=(o[m.to]||0)+m.q});
  return Object.keys(by).sort(skuSort).map(s=>({sku:s,ch:Object.keys(by[s]).filter(l=>by[s][l]!==0).map(l=>({l,now:g(s,l),after:g(s,l)+by[s][l]}))}));
}
function confirmDoc(d){
  const r=build(d);if(!r.ok)return false;
  d.no=OT[d.type].pre+'-'+String(S.seq[d.type]=(S.seq[d.type]||0)+1).padStart(4,'0');
  d.status='done';d.confirmedAt=Date.now();d.nMoves=r.mv.length;
  post(r.mv,d);
  if(d.type==='SCN'){
    const agg={},nOrd=d.hdr.refs.length;
    d.hdr.refs.forEach(ref=>{const o=orderByRef(ref);if(!o)return;o.st='done';o.sc={by:d.hdr.emp.trim(),at:Date.now(),date:d.date,doc:d.no,t:(d.hdr.times||{})[ref]||''};
      consumption(o).forEach(c=>{agg[c[0]]=(agg[c[0]]||0)+c[1]})});
    Object.keys(agg).forEach(k=>supPush(k,agg[k],'auto','سكان '+d.hdr.emp.trim()+': '+nOrd+' أوردر',d.no,d.date));
    const e=d.hdr.emp.trim();if(e&&S.emps.indexOf(e)<0)S.emps.push(e);
  }
  if(d.type==='RTN')(d.hdr.refs||[]).forEach(ref=>{const o=orderByRef(ref);if(o&&!o.rt)o.rt={doc:d.no,date:d.date}});
  d.log.push(logE('اتأكدت وسجّلت '+r.mv.length+' حركة'));dirty();return true;
}
function reverseDoc(d){
  if(d.status!=='done')return {ok:false,err:['العملية مش مؤكدة']};
  const orig=S.moves.filter(m=>m.doc===d.no&&m.type===d.type);
  const skipO=d.type==='SCN'?S.orders.filter(o=>o.sc&&o.sc.doc===d.no&&(o.rt||(o.cx&&o.cx.returned))):[],sk={};skipO.forEach(o=>o.lines.forEach(x=>sk[x]=(sk[x]||0)+1));
  const rev=orig.map(m=>{const t=Math.min(m.q,sk[m.sku]||0);sk[m.sku]=(sk[m.sku]||0)-t;return {sku:m.sku,q:m.q-t,from:m.to,to:m.from,note:'عكس '+d.no}}).filter(m=>m.q>0);
  if(d.type!=='SCN'){
    const sim={},err=[];rev.forEach(m=>{if(INTERNAL.indexOf(m.from)<0)return;const k=m.sku+'|'+m.from,cur=(k in sim)?sim[k]:g(m.sku,m.from);if(cur<m.q)err.push(skuName(m.sku)+': مش موجود في '+LOC[m.from]+' ('+cur+')');sim[k]=cur-m.q});
    if(err.length)return {ok:false,err};
  }
  post(rev,{type:d.type,date:S.date,no:d.no+' (عكس)',id:d.id});
  d.status='reversed';d.log.push(logE('اتعكست'));
  if(d.type==='RTN')S.orders.forEach(o=>{if(o.rt&&o.rt.doc===d.no)delete o.rt});
  if(d.type==='SCN'){
    S.orders.forEach(o=>{if(o.sc&&o.sc.doc===d.no&&o.st==='done'&&!o.rt){o.st='open';o.sc=null}});
    const skc={};skipO.forEach(o=>consumption(o).forEach(c=>skc[c[0]]=(skc[c[0]]||0)+(-c[1])));
    S.sup.log.filter(e=>e.doc===d.no&&e.kind==='auto'&&!e.rev).forEach(e=>{const back=Math.max(0,-e.q-(skc[e.item]||0));if(back>0)supPush(e.item,back,'rev','عكس '+d.no,d.no+' (عكس)',S.date,{of:e.id,ofKind:'auto'});e.rev=true});
  }
  dirty();return {ok:true};
}
function makeScn(matched,emp,src,times){
  const d=newDoc('SCN');d.hdr={emp:emp,src:src,refs:matched.map(m=>m.ref),times:Object.fromEntries(matched.map(m=>[m.ref,m.t||'']))};
  return d;
}


/* ---------- SUPPLIES: catalog, movements, auto-consumption ---------- */
const SUP_UNITS=['قطعة','كاسة','لفة','كيس','علبة'];
function defaultSupItems(st){
  return [
    {id:'FLY',name:'فلاير الشحن',unit:'قطعة',pack:1,packName:'',min:300,note:'عليه البوليصة',arch:false,auto:{kind:'order',qty:st.flyPer||1}},
    {id:'PKS',name:'تغليف فيميني S',unit:'قطعة',pack:1,packName:'',min:100,note:'',arch:false,auto:{kind:'range',qty:1,from:1,to:st.packS||2}},
    {id:'PKM',name:'تغليف فيميني M',unit:'قطعة',pack:1,packName:'',min:100,note:'',arch:false,auto:{kind:'range',qty:1,from:(st.packS||2)+1,to:st.packM||5}},
    {id:'PKL',name:'تغليف فيميني L',unit:'قطعة',pack:1,packName:'',min:100,note:'',arch:false,auto:{kind:'range',qty:1,from:(st.packM||5)+1,to:0}},
    {id:'CUP',name:'كاسات البرا',unit:'كاسة',pack:24,packName:'كيس',min:200,note:'',arch:false,auto:{kind:'pieces',qty:st.cupBR1||2,model:'BR1'}}
  ];
}
function ensureSup(s){
  const sp=s.sup||(s.sup={log:[]});
  if(!sp.items)sp.items=defaultSupItems(s.st||{});
  sp.eid=sp.eid||0;
  sp.log.forEach(e=>{
    if(!e.id)e.id=++sp.eid;
    if(!e.kind)e.kind=e.doc?(/عكس/.test(e.doc)?'rev':'auto'):(/افتتاحي/.test(e.why||'')?'open':(e.q>0?'rcv':'count'));
  });
  sp.eid=Math.max(sp.eid,...sp.log.map(e=>e.id),0);
}
const supItem=id=>S.sup.items.find(i=>i.id===id);
const supName=id=>{const i=supItem(id);return i?i.name:id};
const supBal=id=>S.sup.log.reduce((a,e)=>a+(e.item===id?e.q:0),0);
function supPush(item,q,kind,why,doc,date,extra){
  const e=Object.assign({id:++S.sup.eid,t:Date.now(),date:date||S.date,item,q,kind,why,doc:doc||null,by:S.actor},extra||{});
  S.sup.log.push(e);dirty();return e;
}
function supUse(id,days){
  days=days||7;const to=S.date,from=addDays(to,-(days-1));let u=0;
  S.sup.log.forEach(e=>{if(e.item!==id||e.date<from||e.date>to)return;
    if(e.kind==='auto'||e.kind==='issue'||(e.kind==='rev'&&(e.ofKind==='auto'||e.ofKind==='issue')))u-=e.q});
  return Math.max(0,u)/days;
}
const supCover=id=>{const u=supUse(id);return u>0?supBal(id)/u:null};
function supStatus(it){const b=supBal(it.id),c=supCover(it.id);return b<=0?'crit':((it.min&&b<it.min)||(c!=null&&c<7))?'warn':'good'}
function consumption(o){
  const out=[],n=o.lines.length;
  S.sup.items.forEach(it=>{
    if(it.arch||!it.auto||it.auto.kind==='none')return;const a=it.auto;let q=0;
    if(a.kind==='order')q=a.qty;
    else if(a.kind==='pieces')q=a.qty*o.lines.filter(s=>!a.model||SKU.get(s).m===a.model).length;
    else if(a.kind==='range'){if(n>=a.from&&(!a.to||n<=a.to))q=a.qty}
    if(q>0)out.push([it.id,-q]);
  });
  return out;
}
function ruleText(it){
  const a=it.auto||{kind:'none'};
  if(a.kind==='order')return a.qty+' لكل أوردر';
  if(a.kind==='pieces')return a.qty+' لكل قطعة '+(a.model?a.model:'(أي موديل)');
  if(a.kind==='range')return 'أوردر '+(a.to?(a.from===a.to?'من '+a.from+' قطعة':'من '+a.from+' لـ '+a.to+' قطع'):a.from+' قطع أو أكتر')+': '+a.qty+' لكل أوردر';
  return 'يدوي (مفيش خصم تلقائي)';
}
function packText(it,b){
  if(!(it.pack>1))return '';
  const p=Math.floor(Math.abs(b)/it.pack),r=Math.abs(b)%it.pack;
  return (b<0?'-':'')+p+' '+(it.packName||'عبوة')+(r?' و '+r+' '+it.unit:'');
}
function supUndo(id){
  const e=S.sup.log.find(x=>x.id===id);if(!e||e.rev||['rcv','issue','count','open'].indexOf(e.kind)<0)return false;
  supPush(e.item,-e.q,'rev','تراجع عن: '+e.why,null,S.date,{of:e.id,ofKind:e.kind});e.rev=true;dirty();return true;
}
const KIND_L={open:'رصيد افتتاحي',rcv:'استلام',issue:'صرف / شطب',count:'جرد',auto:'تلقائي من سكان',rev:'تراجع'};

  return h;

   ff('pack','عدد الوحدات في العبوة (اختياري)',f.pack,{num:true,ph:'مثلًا 24'})+ff('packName','اسم العبوة',f.packName,{ph:'كيس'})+ff('note','ملاحظة',f.note,{span:true})+'</div>';
  h+='<datalist id="supunits">'+SUP_UNITS.map(u=>'<option value="'+u+'">').join('')+'</datalist>';

  if(f.kind!=='none'){
    h+='<div class="grid g2" style="margin-top:10px">'+ff('qty',f.kind==='pieces'?'الكمية لكل قطعة':'الكمية لكل أوردر',f.qty,{num:true});

    h+='</div>';
  }
  return h+'</div>';

function formErr(f){
  if(!String(f.name).trim())return 'اكتب اسم المستلزم';
  if(!String(f.unit).trim())return 'اكتب الوحدة';
  if(f.kind!=='none'&&!(+f.qty>0))return 'الكمية في قاعدة الخصم لازم تكون أكبر من صفر';
  if(f.kind==='range'){if(!(+f.from>=1))return '"من عدد قطع" لازم يكون 1 أو أكتر';if(+f.to&&+f.to<+f.from)return '"لحد" لازم يكون أكبر من أو يساوي "من"'}
  return '';
}
function formToItem(f,base){
  const auto=f.kind==='none'?{kind:'none'}:f.kind==='order'?{kind:'order',qty:+f.qty}:f.kind==='pieces'?{kind:'pieces',qty:+f.qty,model:f.model||''}:{kind:'range',qty:+f.qty,from:Math.floor(+f.from),to:Math.floor(+f.to)||0};
  return Object.assign(base||{},{name:String(f.name).trim(),unit:String(f.unit).trim(),pack:Math.floor(+f.pack)>1?Math.floor(+f.pack):1,packName:String(f.packName||'').trim(),min:Math.floor(+f.min)||0,note:String(f.note||'').trim(),auto});
}
function supMove(s){
  const it=supItem(s.id),b=supBal(s.id),k=(s.mode==='pack'&&it.pack>1)?it.pack:1,raw=s.qty===''?NaN:Math.floor(+s.qty),q=isNaN(raw)?0:raw*k;
  let delta=0,ok=false,err='';
  if(s.act==='rcv'){delta=q;ok=q>0}
  else if(s.act==='issue'){delta=-q;ok=q>0&&q<=b;if(q>b)err='مينفعش تصرف '+fmt(q)+' والرصيد '+fmt(b)}
  else{delta=isNaN(raw)?0:q-b;ok=!isNaN(raw)&&q>=0&&delta!==0}
  return {it,b,q,delta,ok,err,after:b+delta,counted:q};
}
function supPreviewHTML(s){

}

/* ---------- photos: IndexedDB so document photos survive reload ---------- */
let IDBH=null;
function idbOpen(){return new Promise(res=>{try{const r=indexedDB.open('femini-v3',1);r.onupgradeneeded=()=>r.result.createObjectStore('ph');r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);r.onblocked=()=>res(null)}catch(e){res(null)}})}
function phPut(id,data){if(!IDBH)return;try{IDBH.transaction('ph','readwrite').objectStore('ph').put(data,id)}catch(e){}}
function phClear(){Object.keys(PH).forEach(k=>delete PH[k]);if(!IDBH)return;try{IDBH.transaction('ph','readwrite').objectStore('ph').clear()}catch(e){}}
function phLoad(){return new Promise(res=>{if(!IDBH)return res();try{const rq=IDBH.transaction('ph').objectStore('ph').openCursor();rq.onsuccess=()=>{const c=rq.result;if(c){PH[c.key]=c.value;c.continue()}else res()};rq.onerror=()=>res()}catch(e){res()}})}
function phFromFile(f,cb){
  const fr=new FileReader();
  fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.75))};im.onerror=()=>toast('الملف ده مش صورة');im.src=fr.result};
  fr.readAsDataURL(f);
}

function ordsOfDay(){const ids=S.pickups.filter(p=>p.date===viewDate()).map(p=>p.id);return S.orders.filter(o=>ids.indexOf(o.pk)>=0&&o.st!=='cx')}
/* ---- shipping-company return sheet (Revenue Report) ---- */
const rtnWhy=n=>/استبدال|التبديل/.test(n)?'استبدال':/رفض/.test(n)?'رفض الاستلام':/لاغى|الغاء|إلغاء/.test(n)?'ملغي':/لايرد|لا يرد/.test(n)?'لا يرد':/استرجاع|مرتجع/.test(n)?'استرجاع':/تاجيل|تأجيل/.test(n)?'تأجيل':'أخرى';
function rtnSheetParse(rows){
  const get=(r,k)=>{for(const key in r)if(String(key).trim().toLowerCase()===k)return r[key];return undefined};
  const out=[];let coll=0,hasType=false;
  rows.forEach(r=>{const t=get(r,'type');if(t===undefined)return;hasType=true;const type=String(t).trim().toLowerCase();
    if(type!=='return'){if(type)coll++;return}
    const m=String(get(r,'full name')||'').match(/-\s*([A-Za-z]{2}\d{3,5})\s*$/),note=String(get(r,'statusnote')||'').replace(/\s+/g,' ').trim();
    out.push({code:m?m[1].toLowerCase():'',serial:String(get(r,'serial')||'').trim(),st:String(get(r,'order delivery status')||'').trim(),note,why:rtnWhy(note),date:String(get(r,'return date')||'').slice(0,10)})});
  return {ok:hasType,rows:out,coll};
}
function rtnMatch(d,r){
  const H=d.hdr,o=S.orders.find(x=>(r.code&&x.ref.toLowerCase()===r.code)||(r.serial&&String(x.wb)===r.serial));
  const prev=new Set();S.docs.forEach(x=>{if(x.type==='RTN'&&x.status==='done'&&x.id!==d.id)(x.hdr.refs||[]).forEach(f=>prev.add(f))});
  if(r.st.toLowerCase()==='delivered')return {k:'manual',o};
  if(!o)return {k:'unk'};
  if((H.refs||[]).indexOf(o.ref)>=0)return {k:'added',o};
  if(o.rt)return {k:'dup',o};
  if(prev.has(o.ref))return {k:'dup',o};
  if(o.st!=='done')return {k:'notdone',o};
  return {k:'ok',o};
}

  if(!sh)return h+(draft?'<p class="muted" style="font-size:12px;margin-top:8px">بياخد صفوف النوع return بس، ويطابقها بالأوردرات بكود الأوردر اللي في آخر الاسم أو بالـ Serial.</p>':'<div class="empty">مفيش شيت اتربط بالعملية دي.</div>')+'</section>';
  const M=sh.rows.map(r=>({r,m:rtnMatch(d,r)})),c={};M.forEach(x=>c[x.m.k]=(c[x.m.k]||0)+1);

  h+='<div class="kpis">'+kpi('مرتجع في الشيت',N(sh.rows.length),'')+kpi('جاهز للإضافة',N(c.ok||0),fmt(pcs)+' قطعة',c.ok?'good':'')+kpi('اتضاف',N(c.added||0),'')+kpi('محتاج مراجعة',N((c.manual||0)+(c.unk||0)+(c.notdone||0)+(c.dup||0)),'',((c.manual||0)+(c.unk||0)+(c.notdone||0)+(c.dup||0))?'warn':'')+'</div>';
  const why={};M.forEach(x=>why[x.r.why]=(why[x.r.why]||0)+1);
  h+='<div class="chips" style="margin:10px 0">'+Object.keys(why).sort((a,b)=>why[b]-why[a]).map(w=>'<span class="pill">'+esc(w)+' <span class="n">'+why[w]+'</span></span>').join('')+'</div>';
  const LB={ok:['good','هيتضاف'],added:['info','اتضاف'],manual:['warn','مراجعة يدوية'],unk:['crit','مش موجود في السيستم'],notdone:['warn','الأوردر ما اتشحنش'],dup:['warn','اتسجّل قبل كده']};
  h+='<div class="tw"><table class="t-sm"><thead><tr><th>الكود</th><th>السبب</th><th class="num">قطع</th><th>الحالة</th></tr></thead><tbody>'+M.map(x=>{const L=LB[x.m.k];return '<tr'+(x.m.o?' data-a="order" data-ref="'+esc(x.m.o.ref)+'"':'')+'><td class="mono">'+esc(x.r.code||x.r.serial)+'</td><td><span data-tip="'+esc(x.r.note)+'">'+esc(x.r.why)+'</span>'+(x.r.st.toLowerCase()==='delivered'?' <span class="muted" style="font-size:12px">· اتسلّم</span>':'')+'</td><td class="num">'+(x.m.o?N(x.m.o.lines.length):'<span class="muted">—</span>')+'</td><td>'+pill(L[0],L[1])+'</td></tr>'}).join('')+'</tbody></table></div>';
  if(c.manual)h+='<div class="msg warn" style="margin-top:8px">'+c.manual+' أوردر اتسلّم للعميل وفيه استبدال أو استرجاع. الشيت مش بيقول أنهي قطع رجعت، فضيفها يدويًا من الأصناف تحت.</div>';
  if(c.unk)h+='<div class="msg warn" style="margin-top:8px">'+c.unk+' كود مش لاقيه في الأوردرات. غالبًا البيك أب بتاعه لسه ما اترفعش.</div>';
  if(draft)h+='<div class="row" style="margin-top:10px"><button class="btn pri" data-a="rtnsheetadd" '+(c.ok?'':'disabled')+'>أضف '+(c.ok||0)+' أوردر ('+fmt(pcs)+' قطعة) للمتوقع</button></div>';
  return h+'</section>';
}
function stateSheet(l){
  const rows=D.skus.map(k=>[k.id,g(k.id,l)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]||skuSort(a[0],b[0])),tot=rows.reduce((a,x)=>a+x[1],0);
  const title=LOC[l]+' ('+fmt(tot)+' قطعة · '+rows.length+' صنف)';
  const INTRO={DIRTY:'قطع رجعت أو اتعلّمت إنها محتاجة غسيل ولسه ما اتبعتتش للمصنع. لما تبعتها بتتنقل لـ"عند المصنع".',FACTORY:'قطع اتبعتت للمصنع للغسيل المجاني ولسه ما رجعتش. لما ترجع بتتسجل في "استلام من المصنع": المغسول لـ"جاهز للبيع" والمرفوض لـ"هالك نهائي".',SCRAP:'قطع خلصت ومفيش علاج ليها.',LOST:'قطع ضايعة مستنية تسوية: لقيناها ولا نشطبها.',READY:'الرصيد اللي تقدر تبيعه دلوقتي (أكبر 40 صنف).'}[l];
  if(!rows.length)return {title,body:'<div class="msg good">مفيش قطع في الحالة دي دلوقتي.</div><p class="muted">'+INTRO+'</p>'};
  let sends=null;
  if(l==='FACTORY'){
    sends={};const ds=S.docs.filter(d=>d.type==='FSD'&&d.status==='done'&&d.hdr.kind==='wash').slice().reverse();
    rows.forEach(x=>{let rem=x[1],last=null;for(const d of ds){const q=d.lines.filter(y=>y.sku===x[0]).reduce((a,y)=>a+num(y.q),0);if(!q)continue;const t=Math.min(rem,q);rem-=t;last=d.date;if(rem<=0)break}sends[x[0]]=rem>0?(last?{d:last,part:1}:null):{d:last}});
  }
  const age=d=>d?dayDiff(d,S.date):null;
  let body='<div class="msg">'+INTRO+'</div>';

/* ---------- product catalog: add / archive SKUs at runtime ---------- */
function ensureCat(s){
  const c=s.cat||(s.cat={});
  ['skus','models','colors','sizes'].forEach(k=>{if(!c[k])c[k]=[]});
  if(!c.ext)c.ext={};if(!c.arch)c.arch={};if(!c.names)c.names={};
}
function rebuildCatalog(){
  const C=S.cat;
  SIZES.length=0;D0.sizes.forEach(z=>SIZES.push(z));C.sizes.forEach(z=>{if(SIZES.indexOf(z)<0)SIZES.push(z)});
  D.colors=D0.colors.concat(C.colors);
  const cl=m=>({code:m.code,name:m.name,colors:m.colors.slice(),sizes:m.sizes.slice()});
  const models=D0.models.map(cl).concat(C.models.map(cl));
  models.forEach(m=>{if(C.names[m.code])m.name=C.names[m.code]});
  models.forEach(m=>{const e=C.ext[m.code];if(e){(e.colors||[]).forEach(c=>{if(m.colors.indexOf(c)<0)m.colors.push(c)});(e.sizes||[]).forEach(z=>{if(m.sizes.indexOf(z)<0)m.sizes.push(z)})}});
  const all=D0.skus.concat(C.skus);
  SKU.clear();all.forEach(k=>SKU.set(k.id,k));
  D.skus=all.filter(k=>!C.arch[k.id]);
  Object.keys(IDX).forEach(k=>delete IDX[k]);D.skus.forEach(k=>IDX[k.m+'|'+k.c+'|'+k.s]=k.id);
  models.forEach(m=>{
    m.sizes.sort((a,b)=>szi(a)-szi(b));
    m.colors=m.colors.filter(c=>m.sizes.some(z=>IDX[m.code+'|'+c+'|'+z]));
    m.sizes=m.sizes.filter(z=>m.colors.some(c=>IDX[m.code+'|'+c+'|'+z]));
  });
  D.models=models;MODEL.clear();models.forEach(m=>MODEL.set(m.code,m));
  const active=new Set(D.skus.map(k=>k.m));
  const codes=models.map(m=>m.code).filter(c=>active.has(c)).sort((a,b)=>mkey(a)<mkey(b)?-1:1);
  MORDER.length=0;codes.forEach(c=>MORDER.push(c));
  Object.keys(mIdx).forEach(k=>delete mIdx[k]);MORDER.forEach((c,i)=>mIdx[c]=i);
  if(MORDER.indexOf(UI.s.m)<0)UI.s.m=MORDER[0];
  _bal=null;_ctx=null;
}

function colorCode(ar){
  const f=D0.colors.concat(S.cat.colors).find(c=>c.ar===ar);if(f)return f.code;
  let n=S.cat.colors.length+1,code='X'+n;const used=new Set(D0.colors.concat(S.cat.colors).map(c=>c.code));while(used.has(code))code='X'+(++n);
  S.cat.colors.push({code,ar});return code;
}

function skuCombos(s){

  s.colors.forEach(c=>s.sizes.forEach(z=>{

  return {all:out,fresh,exist,rest};
}

function cxApply(s){
  const o=cxFind(s.code);if(!o||o.st==='cx'||!s.photo)return false;

  if(was==='done'&&s.ret&&o.rt){cx.returned=true;cx.viaRet=true;cx.doc=o.rt.doc}
  else if(was==='done'&&s.ret){
    const n=(S.seq.CXL=(S.seq.CXL||0)+1),no='CXL-'+String(n).padStart(4,'0'),a={};
    o.lines.forEach(k=>a[k]=(a[k]||0)+1);

    consumption(o).forEach(c=>supPush(c[0],-c[1],'rev','إلغاء أوردر '+o.ref,no,S.date,{ofKind:'auto'}));
    cx.returned=true;cx.doc=no;

  o.st='cx';o.cx=cx;PH[cxKey(o.ref)]=s.photo;phPut(cxKey(o.ref),s.photo);dirty();return true;

function cxRestore(o){

function ordPill(o){
  const C=ctx();
  if(o.st==='cx')return pill('lost','ملغي',o.cx?('اتلغى '+o.cx.date+' بواسطة '+o.cx.by+(o.cx.reason?'\n'+o.cx.reason:'')):'');
  if(o.st==='done'&&o.rt)return pill('warn','اتشحن · رجع','رجع في '+o.rt.doc+' ('+o.rt.date+')');
  if(o.st==='done')return pill('good','اتشحن · '+esc(o.sc.by),'سجّله '+o.sc.by+' الساعة '+timeOf(o.sc.at)+(o.sc.doc?' · '+o.sc.doc:''));
  if(o.bad&&o.bad.length)return pill('warn','كود غير مربوط');
  const b=C.blocked[o.ref];
  if(b)return pill('crit','هيقف · ناقص '+esc(skuName(b[0][0],false))+(b.length>1?' +'+(b.length-1):''),b.map(x=>skuName(x[0])+' ناقص '+x[1]).join('\n'));
  return pill('info','مستني الشحن');
}
function ordFilter(){
  const C=ctx(),f=UI.o.f,q=UI.o.q.trim().toLowerCase();
  return S.orders.filter(o=>{
    if(UI.o.pk&&o.pk!==UI.o.pk)return false;
    if(f==='cx'){if(o.st!=='cx')return false}else if(o.st==='cx')return false;
    if(f==='wait'&&!(o.st==='open'&&!C.blocked[o.ref]))return false;
    if(f==='blocked'&&!(o.st==='open'&&C.blocked[o.ref]))return false;
    if(f==='done'&&o.st!=='done')return false;
    if(f==='bad'&&!(o.bad&&o.bad.length))return false;
    if(q&&String(o.ref).toLowerCase().indexOf(q)<0&&String(o.wb).indexOf(q)<0&&String(o.gov||'').indexOf(q)<0)return false;
    return true;
  });
}

function scanNeg(matched){
  const a={};matched.forEach(m=>{const o=orderByRef(m.ref);if(o)o.lines.forEach(s=>a[s]=(a[s]||0)+1)});
  return Object.keys(a).filter(s=>g(s,'READY')<a[s]).map(s=>[s,g(s,'READY'),a[s]]);
}

function stockTable(){

    const ids=Object.keys(S.cat.arch).filter(k=>S.cat.arch[k]&&SKU.has(k)),by={};ids.forEach(id=>{(by[SKU.get(id).m]||(by[SKU.get(id).m]=[])).push(id)});

    if(!ms.length)return '<div class="card"><div class="empty">مفيش موديلات أو أصناف مؤرشفة.</div></div>';
    return '<div class="stack">'+ms.map(m=>{const inactive=MORDER.indexOf(m)<0;return '<section class="card"><div class="row sp"><h2 style="margin:0">'+esc(mName(m))+' <span class="muted" style="font-size:12px;font-weight:400">'+by[m].length+' صنف مؤرشف'+(inactive?' · الموديل كله متشال':'')+'</span></h2><button class="btn sm pri" data-a="modelrestore" data-m="'+m+'">'+(inactive?'استرجاع الموديل كله':'استرجاع الكل')+'</button></div><div class="tw" style="margin-top:10px"><table class="t-sm"><tbody>'+by[m].sort(skuSort).map(id=>'<tr><td>'+sw(SKU.get(id).c)+' '+esc(skuName(id,false))+'</td><td class="num"><button class="btn sm" data-a="skurestore" data-sku="'+id+'">استرجاع</button></td></tr>').join('')+'</tbody></table></div></section>'}).join('')+'</div>';
  }
  const s=UI.s,q=s.q.trim().toLowerCase().split(/\s+/).filter(Boolean),f=s.flt||'all',C=ctx();
  let rows=D.skus.filter(k=>{
    const i=info(k.id);if(f==='low'&&!i.cls)return false;if(f==='neg'&&g(k.id,'READY')>=0)return false;if(f==='dem'&&!i.dm)return false;
    if(q.length){const hay=(k.id+' '+k.c+' '+k.s+' '+MODEL.get(k.m).name).toLowerCase();if(!q.every(w=>hay.indexOf(w)>=0))return false}
    return true;
  }).map(k=>k.id);
  rows.sort((a,b)=>{const x=info(a),y=info(b),rx=x.cls==='c'?0:x.cls==='w'?1:2,ry=y.cls==='c'?0:y.cls==='w'?1:2;return rx-ry||skuSort(a,b)});

/* ---------- INSIGHTS ---------- */
function planRows(){
  const C=ctx(),rows=[];
  lowList().forEach(x=>{const id=x[0],i=x[1],k=SKU.get(id),pend=g(id,'FACTORY'),have=i.R-i.dm+pend,target=C.velOK?Math.ceil((skuStats().m[id]||{tgt:0}).tgt):Math.max((k.min||0)*2,i.dm),q=Math.max(0,target-have);if(q>0)rows.push({id,q,i,pend})});
  return rows;
}

/* ---------- WEEKLY WITHDRAWAL RATE ---------- */
const RATE_DEF={leadW:2,safeW:1,tgtW:4,svc:95};
function zOf(p){p=Math.min(99.9,Math.max(50,+p||95))/100;const q=1-p,t=Math.sqrt(-2*Math.log(q));return t-(2.515517+0.802853*t+0.010328*t*t)/(1+1.432788*t+0.189269*t*t+0.001308*t*t*t)}
function rv(k){return S.st[k]!=null?S.st[k]:RATE_DEF[k]}
function rateData(){
  const end=S.date,NW=8,MAXD=28,pkD={};S.pickups.forEach(p=>pkD[p.id]=p.date);
  const wi=d=>{const k=Math.floor(dayDiff(d,end)/7);return(k>=0&&k<NW)?NW-1-k:-1};
  const dem=Array(NW).fill(0),shp=Array(NW).fill(0),M={};let first=null;
  const mm=m=>M[m]||(M[m]={daily:Array(MAXD).fill(0),out:0,inflow:0,net:0});
  S.orders.forEach(o=>{if(o.st==='cx')return;const d=pkD[o.pk];if(!d)return;const age=dayDiff(d,end);if(age<0)return;if(first===null||d<first)first=d;
    const w=wi(d);if(w>=0)dem[w]+=o.lines.length;
    if(age<MAXD)o.lines.forEach(sk=>{const k=SKU.get(sk);if(k)mm(k.m).daily[age]++})});
  S.moves.forEach(m=>{const w=wi(m.date);if(w<0)return;const k=SKU.get(m.sku);
    let q=0;if(m.from==='READY'&&m.to==='EXT_CH'&&(m.type==='SCN'||m.type==='CXL'||m.type==='RTN'))q=m.q;else if(m.from==='EXT_CH'&&m.to==='READY'&&(m.type==='SCN'||m.type==='CXL'||m.type==='RTN'))q=-m.q;
    shp[w]+=q;if(w===NW-1&&k){const x=mm(k.m);x.out+=q;if(m.to==='READY'){x.net+=m.q;if(m.from!=='EXT_CH')x.inflow+=m.q}if(m.from==='READY')x.net-=m.q}});
  const span=first===null?0:Math.min(MAXD,Math.max(1,dayDiff(first,end)+1)),avail=Math.min(7,span);
  const lead=+rv('leadW'),safe=+rv('safeW'),tgt=+rv('tgtW'),z=zOf(rv('svc')),C=ctx(),E=skuStats();
  let ws=0;for(let i=0;i<span;i++)ws+=Math.pow(.5,i/7);
  const needBy={},dmBy={},ropBy={},ssBy={};planRows().forEach(r=>{const mc=SKU.get(r.id).m;needBy[mc]=(needBy[mc]||0)+r.q});
  D.skus.forEach(k=>{const e=E.m[k.id]||{rop:0,ss:0};dmBy[k.m]=(dmBy[k.m]||0)+(C.demand[k.id]||0);ropBy[k.m]=(ropBy[k.m]||0)+e.rop;ssBy[k.m]=(ssBy[k.m]||0)+e.ss});
  const rows=MORDER.map(m=>{const x=M[m]||{daily:Array(MAXD).fill(0),out:0,inflow:0,net:0},dl=x.daily.slice(0,span),ready=mSum(m,'READY'),fac=mSum(m,'FACTORY'),dm=dmBy[m]||0,pos=ready-dm+fac;
    let wsum=0;dl.forEach((v,i)=>wsum+=v*Math.pow(.5,i/7));const rate=span?7*wsum/ws:0;
    const cur=dl.slice(0,7).reduce((a,v)=>a+v,0),prev=dl.slice(7,14).reduce((a,v)=>a+v,0);
    const mean=span?dl.reduce((a,v)=>a+v,0)/span:0,sd=span>=7?Math.sqrt(dl.reduce((a,v)=>a+(v-mean)*(v-mean),0)/(span-1)):null;
    const ss=rate>0?(ssBy[m]||0):0,rop=rate>0?(ropBy[m]||0):0,cv=(span>=14&&mean>0)?sd/mean:null,xyz=cv==null?null:cv<=.5?'X':cv<=1?'Y':'Z';
    const begin=ready-x.net,den=begin+x.inflow,st=den>0?Math.max(0,x.out)/den:null;
    const cover=rate>0?Math.max(0,ready-dm)/rate:null,coverAll=rate>0?Math.max(0,pos)/rate:null,need=needBy[m]||0;
    const trend=(span>=14&&prev>0)?(cur-prev)/prev:null,ssw=rate>0?ss/rate:0;
    let k='good',label='تمام';
    if(rate>0&&pos<=rop){k='crit';label='اطلب تصنيع دلوقتي'}
    else if(rate>0&&cover<lead+ssw){k='warn';label='هيخلص قبل ما الجديد يوصل'}
    else if(rate>0&&coverAll*7>S.st.excess){k='info';label='أكتر من اللازم'}
    else if(rate===0&&ready>0){k='';label='مفيش سحب'}
    else if(rate===0){k='';label='—'}
    return {m,rate,prev,trend,ready,fac,dm,cover,coverAll,rop,ss,need,st,den,cv,xyz,abc:(C.abc||{})[m]||'',out:Math.max(0,x.out),k,label}});
  return {NW,dem,shp,rows,avail,span,end,lead,safe,tgt,z,svc:+rv('svc'),tot:rows.reduce((a,r)=>a+r.rate,0),totReady:rows.reduce((a,r)=>a+r.ready,0)};
}
function rateChip(m){
  const C=ctx(),R=C._rate||(C._rate=rateData()),r=R.rows.find(x=>x.m===m);if(!r)return '';
  const est=R.span<7,tip='سحب أسبوعي محسوب من الطلب (بيك أب) بمتوسط مرجّح. '+(est?'تقدير من '+R.span+' يوم بيانات. ':'')+'اضغط للتفاصيل في التحليلات.';

function handleFile(file){
  const s=UI.sheet;if(!s||s.kind!=='upload'){UI.sheet=s={kind:'upload',t:'pickup',channel:'VENDOOR',date:S.date,emp:S.emps[S.emps.length-1]||'',res:null,err:''}}
  const isCsv=/\.csv$/i.test(file.name);
  if(!window.XLSX&&!(s.t==='scan'&&isCsv)){s.err='مكتبة قراءة Excel ما اتحملتش. اتأكد من الاتصال وجرّب تاني، أو ارفع ملف CSV للسكان.';render();return}
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      s.fname=file.name;s.err='';
      if(s.t==='scan'){
        let rows;if(isCsv)rows=parseCSVText(new TextDecoder('utf-8').decode(fr.result));else{const wb=XLSX.read(fr.result,{type:'array'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''})}
        const sc=parseScan(rows),nm=sc.filter(x=>x.name)[0];if(!s.emp&&nm)s.emp=nm.name;s.res=matchScans(sc);
      }else{
        const wb=XLSX.read(fr.result,{type:'array'});s.rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});s.res=importRows(s.rows,s.channel,'__new__');
      }
    }catch(e){s.res=null;s.err=String(e.message||e)}
    render();
  };
  fr.onerror=()=>{s.err='مقدرتش أقرأ الملف';render()};
  fr.readAsArrayBuffer(file);
}
