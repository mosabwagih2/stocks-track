var LOSS_RES={stock:['Found: return to WH/Stock','وُجدت وترجع جاهزة'],clean:['Found: send to WH/Cleaning','وُجدت وتحتاج تنظيف'],writeoff:['Write-off / compensated','شطب أو اتعوّضت']};
var SCRAP_REASONS=['Damaged','Cut / torn','Stained beyond cleaning','Defective (factory)','Other'];

/* ---------- State ---------- */
var KEY='femini-wms-std-1',S,QC=null,AG=null;
var UI={r:'overview',menu:null,sel:null,prod:null,msg:null,dialog:null,drawer:null,today:D.today,
  tl:{type:'',f:{},q:'',group:''},sr:{q:'',group:'',hide0:true,n:120},mv:{q:'',f:'',group:'',n:150},an:{by:'ty'},rp:{},cfg:'locations',pm:'oh',pk:{},adj:{blind:false}};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var DMC=null;
function dirty(){QC=null;AG=null;DMC=null;save()}
function seed(){
  S={v:2,moves:[],docs:[],mid:1,did:1,seq:{},partners:{vendors:['Factory'],customers:['Vendoor']},alias:{},actor:'Mosab',bn:{},settings:{lookback:14,mult:2,allowNeg:false,gloss:true}};
  // opening stock: an Inventory Adjustment (Physical Inventory) dated at the count date
  var t=newT('ADJ',{state:'done',date:D.asOf,origin:'Opening stock (physical count)',logm:'Opening stock imported'});
  D.skus.forEach(function(k){if(k.open>0){t.lines.push({sku:k.id,loc:'WH/Stock',onhand:0,counted:k.open});S.moves.push({i:S.mid++,ref:t.ref,ty:'ADJ',s:k.id,q:k.open,src:'Virtual/Inventory adjustment',dst:'WH/Stock',d:D.asOf,by:'system',n:'Opening stock'})}});
  D.pickups.forEach(function(p){
    var dem={};p.orders.forEach(function(o){o.lines.forEach(function(s){dem[s]=(dem[s]||0)+1})});
    var tt=newT('OUT',{partner:'Vendoor',state:'open',origin:'Vendoor pickup sheet 2-11-2026 ('+p.label+')',meta:{orders:JSON.parse(JSON.stringify(p.orders)),cx:{}},logm:'Imported from sheet'});
    tt.lines=Object.keys(dem).sort(skuSort).map(function(s){return {sku:s,demand:dem[s],done:Math.min(dem[s],qtyAt(s,tt.src,t))}});
  });
  QC=null;AG=null;
}
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&o.v===2){S=o;S.settings=Object.assign({lookback:14,mult:2,allowNeg:false,gloss:true},S.settings||{});return}}}catch(e){}seed();save()}

/* ---------- Quants (stock per variant per location) ---------- */
function quants(){
  if(QC)return QC;var Q={};
  S.moves.forEach(function(m){var o=Q[m.s]||(Q[m.s]={});o[m.dst]=(o[m.dst]||0)+m.q;o[m.src]=(o[m.src]||0)-m.q});
  return (QC=Q);
}
function qty(s,l){var o=quants()[s];return (o&&o[l])||0}
function qtyAt(s,l){return qty(s,l)}
/* On Hand / Free to Use / Incoming / Outgoing / Forecasted (Odoo Stock report definitions) */
function agg(){
  if(AG)return AG;var A={},a=function(s){return A[s]||(A[s]={res:0,out:0,inc:0})};
  S.docs.forEach(function(t){
    if(t.state!=='open')return;
    t.lines.forEach(function(l){
      var x=a(l.sku);
      if(OUTGOING_FROM_STOCK.indexOf(t.type)>=0&&srcOf(t,l)==='WH/Stock')x.res+=(+l.done||0);
      if(t.type==='OUT'||t.type==='RTV')x.out+=(+l.demand||0);
      if(t.type==='IN'||t.type==='RMA')x.inc+=(+l.demand||0);
    });
  });
  D.skus.forEach(function(k){var x=a(k.id);x.stock=qty(k.id,'WH/Stock');x.clean=qty(k.id,'WH/Cleaning');x.oh=x.stock+x.clean;x.free=x.stock-x.res;x.inc+=qty(k.id,'Transit/Factory');x.fc=x.oh+x.inc-x.out});
  return (AG=A);
}
function totalsOf(){var A=agg(),t={oh:0,stock:0,clean:0,free:0,inc:0,out:0,fc:0};D.skus.forEach(function(k){var x=A[k.id];t.oh+=x.oh;t.stock+=x.stock;t.clean+=x.clean;t.free+=x.free;t.inc+=x.inc;t.out+=x.out;t.fc+=x.fc});return t}
function locTotal(l){var n=0;D.skus.forEach(function(k){n+=qty(k.id,l)});return n}

/* ---------- Transfers ---------- */
function pad(n){return String(n).padStart(5,'0')}
function newT(type,o){
  o=o||{};var ot=OT[type],n=(S.seq[type]=(S.seq[type]||0)+1);
  var t={id:'t'+(S.did++),type:type,ref:ot.prefix+pad(n),partner:o.partner||'',src:o.src||ot.src,dst:o.dst||ot.dst,date:o.date||D.today,origin:o.origin||'',state:o.state||'draft',lines:o.lines||[],backorderOf:o.backorderOf||null,returnOf:o.returnOf||null,attach:'',meta:o.meta||null,reason:o.reason||'',log:[{t:Date.now(),by:S.actor,m:o.logm||'Transfer created'}]};
  if(type==='OUT')t.dst='Partners/Customers/'+t.partner;
  S.docs.push(t);return t;
}
function srcOf(t,l){if(t.type==='SCRAP')return (l&&l.loc)||'WH/Stock';if(t.type==='RTV')return (l&&l.loc)||'Virtual/Scrap';if(t.type==='ADJ')return (l&&l.loc)||'WH/Stock';return t.src}
function addLog(t,m){(t.log=t.log||[]).push({t:Date.now(),by:S.actor,m:m})}
function stateOf(t){
  if(t.state==='draft')return 'Draft';if(t.state==='done')return 'Done';if(t.state==='cancel')return 'Cancelled';
  if(['IN','RMA','CLN_IN','ADJ','LOSS'].indexOf(t.type)>=0)return 'Ready';
  if(!t.lines.length)return 'Waiting';
  var ok=t.lines.every(function(l){return qty(l.sku,srcOf(t,l))>=(+l.demand||0)});
  return ok?'Ready':'Waiting';
}
function isLate(t){return t.state==='open'&&t.date<UI.today}
function totalQty(t,k){return t.lines.reduce(function(a,l){return a+(+l[k||'demand']||0)},0)}
function autoDone(t,s,demand){return (t.type==='IN'||t.type==='CLN_IN'||t.type==='RMA')?demand:Math.max(0,Math.min(demand,qty(s,srcOf(t,{loc:UI.pk.loc}))))}

/* Validate: turn a transfer into stock moves between locations */
function buildT(t){
  var mv=[],err=[],add=function(s,q,src,dst,n){if(q>0)mv.push({s:s,q:q,src:src,dst:dst,n:n||''})};
  t.lines.forEach(function(l){
    var d=+l.done||0;
    if(t.type==='IN')add(l.sku,d,'Partners/Vendors',t.dst||'WH/Stock');
    else if(t.type==='OUT')add(l.sku,d,'WH/Stock',t.dst);
    else if(t.type==='CLN_OUT')add(l.sku,d,'WH/Cleaning','Transit/Factory','Cleaning');
    else if(t.type==='CLN_IN')add(l.sku,d,'Transit/Factory','WH/Stock','Cleaned');
    else if(t.type==='INT')add(l.sku,d,t.src,t.dst);
    else if(t.type==='SCRAP'){add(l.sku,d,l.loc||'WH/Stock','Virtual/Scrap',l.reason||'');if(d>0&&!l.reason)err.push(variantPlain(l.sku)+': Scrap Reason is required.')}
    else if(t.type==='RTV')add(l.sku,d,l.loc||'Virtual/Scrap','Partners/Vendors');
    else if(t.type==='RMA'){
      var a=+l.toStock||0,b=+l.toClean||0,c=+l.toScrap||0,rec=a+b+c,miss=Math.max(0,(+l.demand||0)-rec);
      add(l.sku,a,t.src,'WH/Stock','Return to stock');add(l.sku,b,t.src,'WH/Cleaning','Rework (cleaning)');add(l.sku,c,t.src,'Virtual/Scrap','Scrap at inspection');
      add(l.sku,miss,t.src,'Virtual/Inventory loss','Missing in return '+t.ref);
    }
    else if(t.type==='ADJ'){
      if(l.counted===''||l.counted==null)return;
      var cur=qty(l.sku,l.loc),diff=(+l.counted)-cur;
      if(diff<0)add(l.sku,-diff,l.loc,'Virtual/Inventory loss',(t.reason||'Count')+' (shortage)');
      else if(diff>0)add(l.sku,diff,'Virtual/Inventory adjustment',l.loc,(t.reason||'Count')+' (surplus)');
    }
    else if(t.type==='LOSS'){
      var q=+l.done||0;
      if(l.res==='stock')add(l.sku,q,'Virtual/Inventory loss','WH/Stock','Found');
      else if(l.res==='clean')add(l.sku,q,'Virtual/Inventory loss','WH/Cleaning','Found (needs cleaning)');
      else add(l.sku,q,'Virtual/Inventory loss','Virtual/Write-off',l.amt?'Compensated '+fmt(l.amt)+' EGP':'Written off');
    }
  });
  if(!mv.length)err.push(t.type==='ADJ'?'Enter at least one Counted quantity.':'There is nothing to process: set a quantity on at least one line.');
  if((t.type==='IN'||(t.type==='INT'&&(t.dst==='SHOP/Stock'||t.src==='SHOP/Stock')))&&!t.attach)err.push('Attach the signed delivery note (required for this operation type).');
  if(t.type==='INT'&&!ROUTES[t.src+'>'+t.dst])err.push('Route '+t.src+' to '+t.dst+' is not allowed. Items needing cleaning must go through Send for Cleaning.');
  if(t.type==='ADJ'){var cf=conflicts(t);if(cf.length&&!t.ack)err.push('Stock changed after you opened this count ('+cf.length+' lines). Tick the confirmation box to apply anyway.')}
  return {mv:mv,err:err};
}
function conflicts(t){return t.lines.filter(function(l){return l.counted!==''&&l.counted!=null&&l.onhand!==qty(l.sku,l.loc)})}
function shortages(mv){
  var d={},out=[];mv.forEach(function(m){var o=d[m.s]||(d[m.s]={});o[m.dst]=(o[m.dst]||0)+m.q;o[m.src]=(o[m.src]||0)-m.q});
  Object.keys(d).forEach(function(s){Object.keys(d[s]).forEach(function(l){if(l.indexOf('Partners/')===0||l==='Virtual/Inventory adjustment')return;var v=d[s][l];if(v<0&&qty(s,l)+v<0)out.push(variantPlain(s)+' at '+l+': on hand '+fmt(qty(s,l))+', requested '+fmt(-v))})});
  return out;
}
function msg(kind,title,lines){UI.msg={kind:kind,title:title,lines:lines||[]}}
function validateT(t,bo){
  var r=buildT(t);
  if(r.err.length){msg('bad','Cannot validate '+t.ref,r.err);return false}
  var off=shortages(r.mv);
  if(off.length&&!S.settings.allowNeg){msg('bad','Not enough stock',off.slice(0,8).concat(off.length>8?['and '+(off.length-8)+' more']:[]).concat(['Negative stock is disabled (Configuration, Settings).']));return false}
  var partial=BO_TYPES.indexOf(t.type)>=0&&t.lines.some(function(l){return (+l.done||0)<(+l.demand||0)});
  if(partial&&!bo){UI.dialog={kind:'backorder',id:t.id};return false}
  r.mv.forEach(function(m){S.moves.push({i:S.mid++,ref:t.ref,ty:t.type,s:m.s,q:m.q,src:m.src,dst:m.dst,d:t.date,by:S.actor,n:m.n})});
  if(partial&&bo==='create'){
    var rem=t.lines.filter(function(l){return (+l.done||0)<(+l.demand||0)}).map(function(l){return {sku:l.sku,demand:l.demand-(+l.done||0),done:0}});
    var b=newT(t.type,{partner:t.partner,src:t.src,dst:t.dst,date:t.date,origin:'Backorder of '+t.ref,state:'open',backorderOf:t.ref,lines:rem,meta:t.meta,logm:'Backorder of '+t.ref});
    b.lines.forEach(function(l){l.done=Math.min(l.demand,Math.max(0,qty(l.sku,b.src)))});
    addLog(t,'Backorder '+b.ref+' created');
  }
  if(partial){t.lines=t.lines.filter(function(l){return (+l.done||0)>0});t.lines.forEach(function(l){l.demand=l.done})}
  t.state='done';addLog(t,'Validated');dirty();
  msg('ok',t.ref+' is Done',[fmt(r.mv.reduce(function(a,m){return a+m.q},0))+' units moved in '+r.mv.length+' stock moves']);
  return true;
}
function createReturn(t){
  var rt=RETURN_OF[t.type];if(!rt)return null;
  var lines=t.lines.filter(function(l){return (+l.done||0)>0}).map(function(l){
    if(rt==='RMA')return {sku:l.sku,demand:+l.done,toStock:+l.done,toClean:0,toScrap:0,done:0};
    return {sku:l.sku,demand:+l.done,done:+l.done};
  });
  var o={partner:t.partner,state:'draft',origin:'Return of '+t.ref,returnOf:t.ref,lines:lines,logm:'Return of '+t.ref};
  if(rt==='INT'){o.src=t.dst;o.dst=t.src}
  if(rt==='RMA'){o.src=t.dst}
  var r=newT(rt,o);if(rt==='RMA')r.src=t.dst;
  addLog(t,'Return '+r.ref+' created');dirty();return r;
}
function cancelT(t){t.state='cancel';addLog(t,'Cancelled');dirty()}

function locHTML(l){return '<span class="loc" title="'+esc(locAr(l))+'">'+esc(l)+'</span>'}
function tbl(head,rows,cls){return '<div class="scroll"><table class="list '+(cls||'')+'"><thead><tr>'+head.map(function(h){return '<th class="'+(h[1]||'')+'"'+(h[2]?' title="'+esc(h[2])+'"':'')+'>'+h[0]+'</th>'}).join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>'}
function crumbs(list){return '<nav class="crumbs">'+list.map(function(c,i){return i<list.length-1?'<a data-a="go" data-r="'+c[1]+'"'+(c[2]?' data-t="'+c[2]+'"':'')+'>'+esc(c[0])+'</a><span class="sep">/</span>':'<b>'+esc(c[0])+'</b>'}).join('')+'</nav>'}
function cpanel(cr,actions,extra){return '<div class="cp"><div class="cp-l">'+crumbs(cr)+'<div class="cp-b">'+(actions||'')+'</div></div>'+(extra?'<div class="cp-r">'+extra+'</div>':'')+'</div>'}

function pickedSku(){var m=$('#pk-m'),c=$('#pk-c'),z=$('#pk-z');return m&&c&&z&&m.value?(IDX[m.value+'|'+c.value+'|'+z.value]||''):''}

    '<label class="field">Size<select id="pk-z" data-c="pkz"'+(M?'':' disabled')+'>'+(M?o.z.map(function(x){return '<option'+(p.z===x?' selected':'')+'>'+x+'</option>'}).join(''):'<option value="">—</option>')+'</select></label>'+(extra||'')+'<p class="hint" id="pk-hint"></p></div>';

function stepper(id,val,min,attrs){return '<span class="stepper"><button type="button" data-a="qstep" data-for="'+id+'" data-d="-1" aria-label="Decrease">−</button><input id="'+id+'" type="number" min="'+(min==null?1:min)+'" value="'+val+'" '+(attrs||'')+'><button type="button" data-a="qstep" data-for="'+id+'" data-d="1" aria-label="Increase">+</button></span>'}
function statusbar(t){
  var cur=stateOf(t),steps=['Draft','Waiting','Ready','Done'];
  if(cur==='Cancelled')steps=['Draft','Cancelled'];
  else if(t.state!=='draft'&&['IN','RMA','CLN_IN','ADJ','LOSS'].indexOf(t.type)>=0)steps=['Draft','Ready','Done'];
  var ix=steps.indexOf(cur);
  return '<ol class="sbar">'+steps.map(function(s,i){return '<li class="'+(i===ix?'on':i<ix?'past':'')+(s==='Cancelled'?' cx':'')+'" title="'+esc(ST_AR[s])+'">'+s+'</li>'}).join('')+'</ol>';
}

/* ================= Overview (operation type cards) ================= */
function otCounts(type){
  var o={ready:0,waiting:0,late:0,bo:0,draft:0};
  S.docs.forEach(function(t){if(t.type!==type)return;var st=stateOf(t);if(t.state==='draft')o.draft++;if(t.state==='open'){if(st==='Ready')o.ready++;if(st==='Waiting')o.waiting++;if(isLate(t))o.late++;if(t.backorderOf)o.bo++}});
  return o;
}
function kcard(type){
  var ot=OT[type],c=otCounts(type),main=c.ready?c.ready+' To Process':c.draft?c.draft+' Draft':'No open transfers';
  var links=[];
  if(c.waiting)links.push('<a data-a="go" data-r="transfers" data-t="'+type+'" data-f="Waiting">'+c.waiting+' Waiting</a>');
  if(c.late)links.push('<a data-a="go" data-r="transfers" data-t="'+type+'" data-f="Late">'+c.late+' Late</a>');
  if(c.bo)links.push('<a data-a="go" data-r="transfers" data-t="'+type+'" data-f="Back Orders">'+c.bo+' Back Orders</a>');
  if(c.draft&&c.ready)links.push('<a data-a="go" data-r="transfers" data-t="'+type+'" data-f="Draft">'+c.draft+' Draft</a>');
  return '<div class="kcard"><div class="kh"><div><b>'+esc(ot.name)+'</b><div class="g2" dir="rtl">'+esc(ot.ar)+'</div></div><span class="mono small">'+esc(ot.prefix.replace(/\/$/,''))+'</span></div>'+
    '<button class="btn '+(c.ready?'primary':'')+'" data-a="go" data-r="transfers" data-t="'+type+'" data-f="'+(c.ready?'Ready':c.draft?'Draft':'')+'">'+main+'</button>'+
    '<div class="klinks">'+links.join('')+'</div><div class="kf"><button class="btn sm ghost" data-a="newt" data-t="'+type+'">+ New</button>'+(type==='OUT'?'<button class="btn sm ghost" data-a="drawer" data-k="import">Import</button>':'')+'</div></div>';
}
function vOverview(){
  var t=totalsOf(),cells=[['On Hand','العدد الفعلي',t.oh],['Free to Use','المتاح',t.free],['Incoming','داخل',t.inc],['Outgoing','خارج',t.out],['Forecasted','المتوقع',t.fc],['In Cleaning','في التنظيف',t.clean],['Inventory loss','مفقود',locTotal('Virtual/Inventory loss')],['Scrap','هالك نهائي',locTotal('Virtual/Scrap')]];
  var strip='<div class="infolets">'+cells.map(function(c){return '<div class="infolet" title="'+esc(c[1])+'"><div class="il">'+c[0]+'</div><div class="iv">'+fmt(c[2])+'</div></div>'}).join('')+'</div>';
  var groups=AREAS.map(function(a){return '<section class="grp"><h3>'+bi(a[0],a[1])+'</h3><div class="kgrid">'+OT_ORDER.filter(function(k){return OT[k].area===a[0]}).map(kcard).join('')+'</div></section>'}).join('');
  return cpanel([['Overview','overview']],'')+'<div class="page">'+strip+groups+'</div>';
}

/* ================= Transfers list ================= */
var TL_FILTERS=['Draft','Waiting','Ready','Done','Late','Back Orders','Cancelled'];
function vTransfers(){
  var f=UI.tl,q=f.q.trim().toLowerCase(),act=Object.keys(f.f).filter(function(k){return f.f[k]});
  var rows=S.docs.filter(function(t){
    if(f.type&&t.type!==f.type)return false;
    if(q&&(t.ref+' '+t.partner+' '+t.origin+' '+t.lines.map(function(l){return l.sku}).join(' ')).toLowerCase().indexOf(q)<0)return false;
    if(act.length){var st=stateOf(t),ok=act.some(function(k){return k==='Late'?isLate(t):k==='Back Orders'?!!t.backorderOf:st===k});if(!ok)return false}
    return true}).sort(function(a,b){return (b.date.localeCompare(a.date))||(b.id.localeCompare(a.id))});
  var title=f.type?OT[f.type].name:'All Transfers';
  var chips='<div class="facets">'+TL_FILTERS.map(function(k){return '<button class="chipf'+(f.f[k]?' on':'')+'" data-a="tfilter" data-v="'+k+'">'+k+'</button>'}).join('')+'</div>';

function DM(){
  if(DMC)return DMC;
  var hist=[],hm={},hs={},hc={},hg={},days={},pcs=0,vel={},types={};
  S.docs.forEach(function(t){
    if(t.type!=='OUT'||t.state==='cancel'||!t.meta||!t.meta.orders)return;
    t.meta.orders.forEach(function(o){
      if(t.meta.cx&&t.meta.cx[o.ref])return;
      hist.push({date:t.date,o:o,t:t});days[t.date]=1;
      o.lines.forEach(function(s){var k=SKU.get(s);hm[k.m]=(hm[k.m]||0)+1;hs[k.s]=(hs[k.s]||0)+1;hc[k.c]=(hc[k.c]||0)+1;pcs++});
      if(o.gov)hg[o.gov]=(hg[o.gov]||0)+1;types[o.type]=(types[o.type]||0)+1;
    });
  });
  var dl=Object.keys(days).sort(),from=addDays(UI.today,-(S.settings.lookback-1)),span=dl.length?Math.max(1,Math.min(S.settings.lookback,dayDiff(dl[0],UI.today)+1)):1;
  hist.forEach(function(x){if(x.date>=from&&x.date<=UI.today)x.o.lines.forEach(function(s){vel[s]=(vel[s]||0)+1/span})});
  var abc={},tot=0,cum=0;Object.keys(hm).forEach(function(m){tot+=hm[m]});
  Object.keys(hm).sort(function(a,b){return hm[b]-hm[a]}).forEach(function(m){abc[m]=cum/(tot||1)<.8?'A':cum/(tot||1)<.95?'B':'C';cum+=hm[m]});
  return (DMC={hist:hist,hm:hm,hs:hs,hc:hc,hg:hg,pcs:pcs,abc:abc,dl:dl,span:span,vel:vel,types:types,tot:tot});
}

function detectKits(){

  dm.hist.forEach(function(x){var comp={};x.o.lines.forEach(function(s){var k=SKU.get(s),key=k.m+'|'+k.c;comp[key]=(comp[key]||0)+1});var ks=Object.keys(comp).sort();if(ks.length<3)return;
    var sg=ks.map(function(k){return k+':'+comp[k]}).join(','),o=sig[sg]||(sig[sg]={s:sg,comp:comp,n:0,pcs:ks.reduce(function(a,k){return a+comp[k]},0),today:{},mixed:0});
    o.n++;if(x.date===UI.today){var zs={};x.o.lines.forEach(function(s){zs[SKU.get(s).s]=1});var zk=Object.keys(zs);if(zk.length===1)o.today[zk[0]]=(o.today[zk[0]]||0)+1;else o.mixed++}});
  var ks=Object.keys(sig).map(function(k){return sig[k]}).filter(function(b){return b.n>=3}).sort(function(a,b){return b.n-a.n});
  ks.forEach(function(b){b.cap={};SZ.forEach(function(z){var min=Infinity,lim=[];Object.keys(b.comp).forEach(function(k){var p=k.split('|'),id=IDX[p[0]+'|'+p[1]+'|'+z],have=id?Math.floor(qty(id,'WH/Stock')/b.comp[k]):0;if(have<min){min=have;lim=[k]}else if(have===min)lim.push(k)});b.cap[z]={n:min===Infinity?0:min,lim:lim}})});
  return ks;
}

var LINE_RE=/^(.*?) \( (.*?) \)-(.*)-(.*)-(\d+)$/,COLS={ref:'كود الاوردر العشوائي',wb:'بوليصة الشحن',ty:'حالة الاوردر الجزئية',gov:'المحافظة',total:'المبلغ توتال بالشحن للاوردر',items:'المنتجات المطلوبة في الاوردر'};
function aliasOf(code){return S.alias[code]||D.alias[code]||(/^FC-/.test(code)&&MODEL.has(code.slice(3))?code.slice(3):null)}
function importRows(rows,fname,partner){
  var H=rows[0].map(function(x){return String(x).trim()}),ix={};for(var k in COLS)ix[k]=H.indexOf(COLS[k]);
  if(ix.ref<0||ix.items<0)throw new Error('Required columns not found. The sheet must have the same layout as the Vendoor export.');
  var have={};S.docs.forEach(function(t){if(t.type==='OUT'&&t.meta&&t.meta.orders)t.meta.orders.forEach(function(o){have[t.partner+'|'+o.ref]=t.ref})});
  var orders=[],dups=[],unk={};
  rows.slice(1).forEach(function(r){
    var ref=String(r[ix.ref]||'').trim();if(!ref)return;
    if(have[partner+'|'+ref]){dups.push(ref);return}
    var o={ref:ref,wb:r[ix.wb],type:String(r[ix.ty]).indexOf('استبدال')>=0?'Exchange':'New',gov:r[ix.gov],total:r[ix.total],lines:[],bad:[]};
    String(r[ix.items]).split(', ').forEach(function(it){
      var m=LINE_RE.exec(it.trim());if(!m){o.bad.push([it,'','',1]);return}
      var code=m[1],size=m[3].trim(),color=m[4].trim(),q=+m[5],mc=aliasOf(code),id=mc&&IDX[mc+'|'+color+'|'+size];
      if(id){for(var i=0;i<q;i++)o.lines.push(id)}else{o.bad.push([code,size,color,q]);if(!mc)unk[code]=1}
    });
    orders.push(o);
  });
  return {orders:orders,dups:dups,unk:Object.keys(unk)};
}
function resolveBad(res){res.orders.forEach(function(o){var keep=[];o.bad.forEach(function(b){var mc=aliasOf(b[0]),id=mc&&IDX[mc+'|'+b[2]+'|'+b[1]];if(id){for(var i=0;i<b[3];i++)o.lines.push(id)}else keep.push(b)});o.bad=keep});res.unk=res.unk.filter(function(c){return !aliasOf(c)})}
function importDrawer(d){
  var h='<div class="row sb"><h2>Import Delivery Orders</h2><button class="btn sm" data-a="closedrawer">Close</button></div><p class="muted">Upload the pickup sheet from a customer. One Delivery Order is created with a line per product variant. Customer personal data (name, phone, address) is not imported.</p>'+
    '<div class="row"><label class="field">Customer<select data-c="impcust">'+S.partners.customers.map(function(c){return '<option'+(d.partner===c?' selected':'')+'>'+esc(c)+'</option>'}).join('')+'</select></label><label class="field">Scheduled Date<input type="date" data-i="impdate" value="'+esc(d.date)+'"></label></div>'+
    '<div class="drop" id="dropz" data-a="pickfile" role="button" tabindex="0"><b>Drop the file here</b> or click to choose<br><span class="muted small">xlsx · xls · csv</span></div>';
  if(d.err)h+='<div class="msg bad"><div>'+esc(d.err)+'</div></div>';
  var r=d.res;
  if(r){
    var pcs=r.orders.reduce(function(a,o){return a+o.lines.length+o.bad.reduce(function(x,b){return x+b[3]},0)},0),sk={},ex=0;
    r.orders.forEach(function(o){o.lines.forEach(function(s){sk[s]=1});if(o.type==='Exchange')ex++});
    h+='<div class="preview"><div class="kv"><span>File</span><b class="mono">'+esc(d.fname)+'</b></div><div class="kv"><span>New orders</span><b>'+r.orders.length+'</b></div><div class="kv"><span>Units</span><b>'+fmt(pcs)+'</b></div><div class="kv"><span>Distinct variants</span><b>'+Object.keys(sk).length+'</b></div><div class="kv"><span>Exchange orders</span><b>'+ex+'</b></div><div class="kv"><span>Duplicates skipped</span><b>'+r.dups.length+'</b></div></div>';
    if(r.unk.length)h+='<div class="msg warn"><div><b>Unknown product codes</b><div class="grid" style="margin-top:8px">'+r.unk.map(function(c){return '<div class="row"><span class="mono">'+esc(c)+'</span><select data-c="impmap" data-code="'+esc(c)+'"><option value="">Map to product…</option>'+MORDER.map(function(m){return '<option value="'+m+'">'+esc(m+' '+MODEL.get(m).name)+'</option>'}).join('')+'</select></div>'}).join('')+'</div></div></div>';
    h+='<div class="dfoot"><button class="btn primary" data-a="impsave"'+(r.orders.length&&!r.unk.length?'':' disabled')+'>Create Delivery Order</button><button class="btn" data-a="closedrawer">Cancel</button></div>';
  }
  return h;
}
function handleFile(file){
  var d=UI.drawer;if(!d||d.kind!=='import'){UI.drawer=d={kind:'import',partner:S.partners.customers[0],date:UI.today}}
  if(!window.XLSX){d.err='The Excel reader could not be loaded. Check the connection and try again.';render();return}
  var fr=new FileReader();
  fr.onload=function(){try{var wb=XLSX.read(fr.result,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]];d.rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});d.fname=file.name;d.err='';d.res=importRows(d.rows,file.name,d.partner)}catch(e){d.res=null;d.err=String(e.message||e)}render()};
  fr.onerror=function(){d.err='Could not read the file';render()};
  fr.readAsArrayBuffer(file);
}
function handleFileInput(el){var f=el.files&&el.files[0];el.value='';if(f)handleFile(f)}

function curT(){return S.docs.find(function(x){return x.id===UI.sel})}
function newLine(t,s,q,loc){
  if(t.type==='RMA')return {sku:s,demand:q,toStock:0,toClean:0,toScrap:0};
  if(t.type==='SCRAP')return {sku:s,loc:loc||'WH/Stock',demand:q,done:q,reason:''};
  if(t.type==='RTV')return {sku:s,loc:loc||'Virtual/Scrap',demand:q,done:q};
  if(t.type==='IN'||t.type==='CLN_IN')return {sku:s,demand:q,done:q};
  return {sku:s,demand:q,done:Math.min(q,Math.max(0,qty(s,t.src)))};
}
function openT(t){UI.r='transfer';UI.sel=t.id;UI.msg=null;UI.menu=null}
function adjAdd(t,m,loc,onlyStock){
  D.skus.forEach(function(k){if(k.m!==m)return;if(onlyStock&&qty(k.id,loc)<=0)return;if(t.lines.some(function(l){return l.sku===k.id&&l.loc===loc}))return;t.lines.push({sku:k.id,loc:loc,onhand:qty(k.id,loc),counted:''})});
  t.lines.sort(function(a,b){return skuSort(a.sku,b.sku)});
}

    t.partner=src.partner;t.src='Partners/Customers/'+src.partner;t.origin='Return of '+src.ref;UI.msg=null;save();render();
  },
  lossload:function(){var t=curT();D.skus.forEach(function(k){var q=qty(k.id,'Virtual/Inventory loss');if(q>0&&!t.lines.some(function(l){return l.sku===k.id}))t.lines.push({sku:k.id,demand:q,done:q,res:'writeoff',amt:0})});t.lines.sort(function(a,b){return skuSort(a.sku,b.sku)});save();render()},
  adjload:function(){var t=curT(),m=$('#adj-m').value;if(!m){msg('bad','Select a product to load.',[]);render();return}UI.msg=null;adjAdd(t,m,t.loc||'WH/Stock',false);save();render()},
  adjdue:function(){var t=curT();document.querySelectorAll('.addbox .chip .mono').forEach(function(e){adjAdd(t,e.textContent,t.loc||'WH/Stock',true)});UI.msg=null;save();render()},
  drawer:function(el){UI.drawer={kind:el.dataset.k,partner:S.partners.customers[0],date:UI.today,res:null,err:''};render()},
  closedrawer:function(){UI.drawer=null;render()},
  pickfile:function(){$('#upfile').click()},
  impsave:function(){
    var d=UI.drawer,r=d.res,dem={};if(!r)return;
    r.orders.forEach(function(o){o.lines.forEach(function(s){dem[s]=(dem[s]||0)+1})});
    var t=newT('OUT',{partner:d.partner,date:d.date,state:'open',origin:d.fname,meta:{orders:r.orders,cx:{}},logm:'Imported from '+d.fname});
    t.lines=Object.keys(dem).sort(skuSort).map(function(s){return {sku:s,demand:dem[s],done:Math.min(dem[s],Math.max(0,qty(s,t.src)))}});
    dirty();UI.drawer=null;openT(t);
    msg(r.dups.length?'warn':'ok','Imported '+r.orders.length+' orders into '+t.ref,[].concat(r.dups.length?[r.dups.length+' duplicate orders were skipped']:[],['Customer personal data was not imported.']));render();
  },
  csv:function(el){
    var v=el.dataset.v,rows=[],title='';
    if(v==='products'){title='Products (variants)';rows=[['internal_reference','product','product_name','color','size','legacy_min','opening_qty']].concat(D.skus.map(function(k){return [k.id,k.m,MODEL.get(k.m).name,k.c,k.s,k.min,k.open]}))}
    if(v==='stock'){var A=agg();title='Stock';rows=[['internal_reference','on_hand','free_to_use','incoming','outgoing','forecasted']].concat(D.skus.map(function(k){var x=A[k.id];return [k.id,x.oh,x.free,x.inc,x.out,x.fc]}))}
    if(v==='moves'){title='Stock moves';rows=[['date','reference','operation_type','product','quantity','from','to','note','done_by']].concat(S.moves.map(function(m){return [m.d,m.ref,m.ty,m.s,m.q,m.src,m.dst,m.n||'',m.by||'']}))}
    if(v==='replenish'){var A2=agg();title='Replenishment';rows=[['product','min','max','on_hand','forecast','to_order']].concat(D.skus.filter(function(k){return k.min>0&&A2[k.id].fc<k.min}).map(function(k){var mx=k.min*S.settings.mult;return [k.id,k.min,mx,A2[k.id].oh,A2[k.id].fc,Math.max(0,mx-A2[k.id].fc)]}))}
    UI.modal={title:title,text:csv(rows)};render();
  },
  copy:function(){var t=$('#mtxt'),st=$('#cpst');t.select();var ok=function(){st.textContent='Copied'},fail=function(){st.textContent='Press Ctrl+C to copy'};try{navigator.clipboard.writeText(t.value).then(ok,fail)}catch(e){fail()}},
  closemsg:function(){UI.msg=null;render()},closemodal:function(){UI.modal=null;render()},
  addcust:function(){var n=($('#newcust').value||'').trim();if(!n)return;if(S.partners.customers.indexOf(n)>=0){msg('bad',n+' already exists.',[]);render();return}S.partners.customers.push(n);save();render()},
  savesettings:function(){var v=function(id,d){var x=Math.round(+($('#'+id).value));return x>=1?x:d},s=S.settings;s.lookback=v('st-lookback',s.lookback);s.mult=v('st-mult',s.mult);s.allowNeg=$('#st-neg').checked;s.gloss=$('#st-gloss').checked;DMC=null;save();msg('ok','Settings saved',[]);render()},
  reset:function(){if(UI.confirmReset){try{localStorage.removeItem(KEY)}catch(e){}seed();save();UI.confirmReset=false;UI.r='overview';UI.sel=null;DMC=null;msg('ok','Demo data restored',[]);render()}else{UI.confirmReset=true;msg('warn','Reset everything?',['All transfers and moves you created will be lost. Click “Reset demo data” again to confirm.']);render()}}
};
function rerenderKeep(el){var id=el.id,pos=el.selectionStart;render();var n=id?document.getElementById(id):null;if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}}
var INP={
  tlq:function(el){UI.tl.q=el.value;rerenderKeep(el)},pq:function(el){UI.pq=el.value;rerenderKeep(el)},
  srq:function(el){UI.sr.q=el.value;UI.sr.n=120;rerenderKeep(el)},mvq:function(el){UI.mv.q=el.value;UI.mv.n=150;rerenderKeep(el)},
  hf:function(el){var t=curT();t[el.dataset.k]=el.value;save()},
  lf:function(el){var t=curT(),l=t.lines[+el.dataset.idx],k=el.dataset.k,v=el.value===''?'':Math.max(0,Math.floor(+el.value));l[k]=v;if(k==='demand'&&(t.type==='IN'||t.type==='CLN_IN')&&(+l.done||0)>v)l.done=v;AG=null;save();live()},
  adjc:function(el){var t=curT(),l=t.lines[+el.dataset.idx];l.counted=el.value===''?'':Math.max(0,Math.floor(+el.value));save();live()},
  bname:function(el){S.bn[el.dataset.sig]=el.value;save()},
  impdate:function(el){if(UI.drawer&&el.value)UI.drawer.date=el.value}
};
var CHG={
  pkm:function(){fillPicker()},pkc:function(){pkHint()},pkz:function(){pkHint()},
  tltype:function(el){UI.tl.type=el.value;render()},tlgroup:function(el){UI.tl.group=el.value;render()},
  hpartner:function(el){var t=curT();t.partner=el.value;if(t.type==='OUT')t.dst='Partners/Customers/'+el.value;if(t.type==='RMA')t.src='Partners/Customers/'+el.value;save();render()},
  hsrc:function(el){curT().src=el.value;save();render()},hdst:function(el){curT().dst=el.value;save();render()},
  lloc:function(el){curT().lines[+el.dataset.idx].loc=el.value;save();render()},lreason:function(el){curT().lines[+el.dataset.idx].reason=el.value;save()},lres:function(el){curT().lines[+el.dataset.idx].res=el.value;save()},
  attach:function(el){var f=el.files&&el.files[0];curT().attach=f?f.name:'';save();render()},
  adjloc:function(el){var t=curT();t.loc=el.value;t.lines=[];save();render()},blind:function(el){UI.adj.blind=el.checked;render()},ack:function(el){curT().ack=el.checked;save();render()},
  pm:function(el){UI.pm=el.value;render()},srgroup:function(el){UI.sr.group=el.value;render()},srhide:function(el){UI.sr.hide0=el.checked;render()},
  mvgroup:function(el){UI.mv.group=el.value;render()},anby:function(el){UI.an.by=el.value;render()},
  impcust:function(el){var d=UI.drawer;d.partner=el.value;if(d.rows){try{d.res=importRows(d.rows,d.fname,d.partner);d.err=''}catch(e){d.err=String(e.message||e)}}render()},
  impmap:function(el){var c=el.dataset.code,m=el.value;if(!m)return;S.alias[c]=m;if(UI.drawer&&UI.drawer.res)resolveBad(UI.drawer.res);save();render()}
};
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');
  if(el&&ACT[el.dataset.a]){if(el.dataset.a==='pickfile'&&e.target.closest('input'))return;ACT[el.dataset.a](el,e);return}
  if(UI.menu&&!e.target.closest('.nmw')){UI.menu=null;render()}
});
document.addEventListener('input',function(e){var el=e.target;if(el.dataset&&el.dataset.i&&INP[el.dataset.i])INP[el.dataset.i](el);if(el.id==='actor'){S.actor=el.value;save()}});
document.addEventListener('change',function(e){var el=e.target;if(el.id==='upfile'){handleFileInput(el);return}if(el.dataset&&el.dataset.c&&CHG[el.dataset.c])CHG[el.dataset.c](el)});
var tip=document.createElement('div');tip.id='tip';tip.hidden=true;document.body.appendChild(tip);
document.addEventListener('mouseover',function(e){
  var t=e.target.closest&&e.target.closest('[data-tiph]');
  if(!t){tip.hidden=true;return}
  tip.innerHTML=t.getAttribute('data-tiph');tip.hidden=false;
  var r=t.getBoundingClientRect(),w=tip.offsetWidth,h=tip.offsetHeight,x=Math.min(Math.max(8,r.left+r.width/2-w/2),window.innerWidth-w-8),y=r.top-h-8;if(y<8)y=r.bottom+8;tip.style.left=x+'px';tip.style.top=y+'px';
});
window.addEventListener('scroll',function(){tip.hidden=true},{passive:true});
document.addEventListener('dragover',function(e){var z=e.target.closest&&e.target.closest('#dropz');if(z){e.preventDefault();z.classList.add('on')}});
document.addEventListener('dragleave',function(e){var z=e.target.closest&&e.target.closest('#dropz');if(z)z.classList.remove('on')});
document.addEventListener('drop',function(e){var z=e.target.closest&&e.target.closest('#dropz');if(!z)return;e.preventDefault();var f=e.dataTransfer&&e.dataTransfer.files[0];if(f)handleFile(f)});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){if(UI.drawer){UI.drawer=null;render()}else if(UI.dialog){UI.dialog=null;render()}else if(UI.menu){UI.menu=null;render()}return}
  if(e.target.id==='dropz'&&(e.key==='Enter'||e.key===' ')){e.preventDefault();$('#upfile').click()}
});

/* ================= boot ================= */
load();
var ip=document.createElement('input');ip.type='file';ip.id='upfile';ip.accept='.xlsx,.xls,.csv';ip.hidden=true;document.body.appendChild(ip);
render();

})();
</script>
