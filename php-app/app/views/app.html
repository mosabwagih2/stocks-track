<title>Fémini Stock Brand 2</title>

<style>
/* Layout: right-hand rail (bottom bar on phones) + one working column. Each screen is built around the daily question it answers.
   Palette: Fémini lavender brand (ink, accent, page, line, lav) + semantic status colors kept separate from the accent. */
:root{
  --page:#fcf9fe;--surface:#ffffff;--lav:#f5f1fd;--ink:#302568;--accent:#5e4394;--on-accent:#ffffff;--muted:#5a5178;
  --line:#e3dcf3;--line2:#cfc2ec;--grid:#ece6f7;--rail:#302568;--on-rail:#f1ecfb;--rail-mute:#b9aedd;--shadow:0 1px 2px rgba(48,37,104,.06),0 8px 24px -12px rgba(48,37,104,.18);
  --crit:#a8231a;--crit-bg:#fbe7e5;--crit-line:#efc3be;--warn:#8a4a07;--warn-bg:#fcf0dc;--warn-line:#efd3a6;
  --good:#0c6b43;--good-bg:#e4f3ea;--good-line:#b9dfc9;--info:#1f528f;--info-bg:#e0ebfa;--info-line:#b9d0ee;--lost:#74278a;--lost-bg:#f2e1f7;
  --c-ready:#2f9e75;--c-dirty:#d89a2b;--c-scrap:#cf4a52;--c-factory:#4a86d6;--c-lost:#a05bb8;--swb:#cfc8de;
  --f-ar:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;--f-disp:'Readex Pro','IBM Plex Sans Arabic',sans-serif;--f-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#14111f;--surface:#1c1830;--lav:#252040;--ink:#ece8fa;--accent:#b9a4f0;--on-accent:#14111f;--muted:#aaa2c6;
  --line:#2f2950;--line2:#463e6c;--grid:#2c2649;--rail:#0f0c1a;--on-rail:#ece8fa;--rail-mute:#9d94c2;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
  --crit:#ff8d94;--crit-bg:#3a1a1e;--crit-line:#6b2c33;--warn:#f0b960;--warn-bg:#35280f;--warn-line:#6b4f1c;
  --good:#5fd0a0;--good-bg:#12302a;--good-line:#246650;--info:#8db8f5;--info-bg:#14283f;--info-line:#274d7a;--lost:#d9a0ea;--lost-bg:#2f1a39;
  --c-ready:#3fb589;--c-dirty:#e3a93f;--c-scrap:#e0606a;--c-factory:#5f98e6;--c-lost:#b873cf;--swb:#5a5280;color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#14111f;--surface:#1c1830;--lav:#252040;--ink:#ece8fa;--accent:#b9a4f0;--on-accent:#14111f;--muted:#aaa2c6;
  --line:#2f2950;--line2:#463e6c;--grid:#2c2649;--rail:#0f0c1a;--on-rail:#ece8fa;--rail-mute:#9d94c2;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
  --crit:#ff8d94;--crit-bg:#3a1a1e;--crit-line:#6b2c33;--warn:#f0b960;--warn-bg:#35280f;--warn-line:#6b4f1c;
  --good:#5fd0a0;--good-bg:#12302a;--good-line:#246650;--info:#8db8f5;--info-bg:#14283f;--info-line:#274d7a;--lost:#d9a0ea;--lost-bg:#2f1a39;
  --c-ready:#3fb589;--c-dirty:#e3a93f;--c-scrap:#e0606a;--c-factory:#5f98e6;--c-lost:#b873cf;--swb:#5a5280;color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font:14px/1.6 var(--f-ar);direction:rtl;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{font-family:var(--f-disp);font-weight:500;text-wrap:balance;letter-spacing:0}
.mono,.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.n{direction:ltr;unicode-bidi:isolate;display:inline-block}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* shell */
.shell{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}
.rail{background:var(--rail);color:var(--on-rail);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:20px 12px;gap:4px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.brand b{font-family:var(--f-disp);font-weight:600;font-size:20px;letter-spacing:.01em}
.brand i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#9a7fe0,#5e4394);display:grid;place-items:center;font-style:normal;font-family:var(--f-disp);font-weight:600;color:#fff}
.brand small{display:block;color:var(--rail-mute);font-size:11px;line-height:1.2}
.nav{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--rail-mute);font-weight:500;position:relative}
.nav:hover{background:rgba(255,255,255,.07);color:var(--on-rail)}
.nav[aria-current=page]{background:rgba(255,255,255,.12);color:#fff}
.nav svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav .bd{margin-inline-start:auto;background:#e0606a;color:#fff;border-radius:99px;font:600 11px/1 var(--f-mono);padding:4px 7px}
.rail .sp{flex:1}
.rail .foot{padding:10px;color:var(--rail-mute);font-size:12px;display:grid;gap:8px}
.tbtn{all:unset;cursor:pointer;display:inline-flex;gap:8px;align-items:center;color:var(--rail-mute);font-size:12px;padding:6px 8px;border-radius:8px}
.tbtn:hover{background:rgba(255,255,255,.07);color:#fff}

.main{padding-block:22px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0;max-width:1240px;width:100%}
.top{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-size:26px;line-height:1.25}
.top .sub{color:var(--muted);margin-top:2px}
.top .tools{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* controls */
.btn{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);cursor:pointer;font-weight:500;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.danger{color:var(--crit);border-color:var(--crit-line)}
.btn[disabled],.btn[aria-disabled=true]{opacity:.45;cursor:not-allowed;pointer-events:none}
input,select,textarea{background:var(--surface);border:1px solid var(--line2);border-radius:9px;padding:8px 10px;min-width:0;max-width:100%}
input[type=number]{font-family:var(--f-mono);text-align:center;width:76px;direction:ltr}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);padding:0}
textarea{width:100%;min-height:70px;font-family:var(--f-mono);direction:ltr}
label.f{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
label.f>input,label.f>select{font-size:14px;color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{all:unset;box-sizing:border-box;cursor:pointer;padding:5px 12px;border-radius:99px;border:1px solid var(--line2);background:var(--surface);font-size:13px;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed=true]{background:var(--ink);color:var(--page);border-color:var(--ink)}
:root[data-theme="dark"] .chip[aria-pressed=true]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed=true]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}}
.chip .n{font-size:12px;opacity:.75}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{all:unset;cursor:pointer;padding:7px 14px;font-weight:500;font-size:13px;border-inline-start:1px solid var(--line2)}
.seg button:first-child{border-inline-start:0}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.card.flat{box-shadow:none}
.card.lift{box-shadow:var(--shadow)}
.card h2{font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h2 .hint{font:400 12px var(--f-ar);color:var(--muted);margin-inline-start:auto}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.split2{grid-template-columns:minmax(0,1fr) 340px}
.stack{display:grid;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--line2);background:var(--lav);white-space:nowrap}
.pill.crit{background:var(--crit-bg);color:var(--crit);border-color:var(--crit-line)}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-line)}
.pill.good{background:var(--good-bg);color:var(--good);border-color:var(--good-line)}
.pill.info{background:var(--info-bg);color:var(--info);border-color:var(--info-line)}
.pill.lost{background:var(--lost-bg);color:var(--lost);border-color:var(--lost-bg)}
.dot{width:9px;height:9px;border-radius:99px;display:inline-block;flex:none}
.sw{width:12px;height:12px;border-radius:99px;border:1px solid var(--swb);display:inline-block;vertical-align:-1px}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 12px;text-align:start;border-bottom:1px solid var(--grid);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--lav);white-space:nowrap;position:sticky;top:0}
tr:last-child td{border-bottom:0}
tbody tr[data-a]{cursor:pointer}
tbody tr[data-a]:hover td{background:var(--lav)}
td.num,th.num{text-align:center}
.t-sm td,.t-sm th{padding:6px 10px}

/* big numbers */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:2px}
button.kpi{text-align:start;cursor:pointer;width:100%}
button.kpi:hover{border-color:var(--accent)}
.kpi small{color:var(--muted);font-weight:500}
.kpi b{font:600 28px/1.2 var(--f-mono);letter-spacing:-.02em}
.kpi em{font-style:normal;color:var(--muted);font-size:12px}
.kpi.crit b{color:var(--crit)}.kpi.warn b{color:var(--warn)}.kpi.good b{color:var(--good)}

/* flow bar */
.flow{display:flex;height:16px;border-radius:99px;overflow:hidden;background:var(--grid);gap:2px}
.flow i{display:block;min-width:0}
.flow .a{background:var(--c-ready)}.flow .b{background:var(--line2)}.flow .c{background:var(--c-scrap)}
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:12px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.srow{all:unset;box-sizing:border-box;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 8px;margin-inline:-8px;border-radius:9px;width:calc(100% + 16px)}
.srow:hover{background:var(--lav)}
.srow:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ratechip{all:unset;cursor:pointer;display:inline-block;margin-top:4px;font-size:13px;color:var(--muted);border-radius:8px}
.ratechip:hover{color:var(--accent)}
.ratechip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hb .tr.m{position:relative;overflow:visible}
.hb .tr.m b{position:absolute;inset-inline-start:var(--x);top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:2px;opacity:.7}
.wk{display:flex;align-items:flex-end;gap:10px;padding-top:6px}
.wk .g{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.wk .p{display:flex;align-items:flex-end;gap:3px;height:150px}
.wk .p i{display:block;width:16px;border-radius:6px 6px 2px 2px;min-height:2px}
.wk .l{font:500 11px var(--f-mono);color:var(--muted);white-space:nowrap}
.wk .v{font:500 11px var(--f-mono)}
.wk .g.now .l{color:var(--ink);font-weight:700}
.hb{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) auto;gap:10px;align-items:center;padding:3px 0}
.hb .tr{height:10px;background:var(--grid);border-radius:99px;overflow:hidden}
.hb .tr i{display:block;height:100%;background:var(--accent);border-radius:99px}
.hb .tr i.w{background:var(--c-dirty)}.hb .tr i.c{background:var(--c-scrap)}.hb .tr i.g{background:var(--c-ready)}
.hb .v{font:500 13px var(--f-mono);min-width:40px;text-align:end}
.hb .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* action queue */
.queue{display:grid;gap:8px}
.q{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.q .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:700}
.q.crit{border-color:var(--crit-line);background:var(--crit-bg)}.q.crit .ic{background:var(--crit);color:#fff}
.q.warn{border-color:var(--warn-line);background:var(--warn-bg)}.q.warn .ic{background:var(--warn);color:#fff}
.q.info .ic{background:var(--info);color:#fff}
:root[data-theme="dark"] .q .ic{color:#14111f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .q .ic{color:#14111f}}
.q b{display:block}.q span{color:var(--muted);font-size:13px}
.q.crit span,.q.warn span{color:inherit;opacity:.85}
.q.crit b{color:var(--crit)}.q.warn b{color:var(--warn)}

/* stock */
.wh{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
.mlist{display:grid;gap:2px;max-height:calc(100vh - 220px);overflow-y:auto;padding:6px}
.mgrp{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.06em;padding:10px 10px 4px;text-transform:uppercase}
.mi{all:unset;box-sizing:border-box;display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 10px;border-radius:10px;cursor:pointer}
.mi:hover{background:var(--lav)}
.mi[aria-current=true]{background:var(--ink);color:var(--page)}
:root[data-theme="dark"] .mi[aria-current=true]{background:var(--accent);color:var(--on-accent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mi[aria-current=true]{background:var(--accent);color:var(--on-accent)}}
.mi b{font-family:var(--f-mono);font-size:13px}
.mi small{opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mx{border-collapse:separate;border-spacing:4px;width:auto}
.mx th{background:none;position:static;text-align:center;border:0;padding:4px 6px}
.mx td{padding:0;border:0}
.mx .cl{padding:0 8px 0 4px;white-space:nowrap;font-weight:500;text-align:start}
.cell{all:unset;box-sizing:border-box;cursor:pointer;display:grid;place-items:center;min-width:58px;height:46px;border-radius:10px;background:var(--lav);font:500 15px var(--f-mono);position:relative;border:1px solid transparent}
.cell:hover{border-color:var(--accent)}
.cell.tg{font-size:16px;cursor:pointer}
.cell.tg small{position:absolute;bottom:2px;inset-inline:0;text-align:center;font:400 9px var(--f-ar);line-height:1}
.cell.tg.on{background:var(--good-bg);color:var(--good);border-color:var(--good-line)}
.cell.tg.new{background:var(--info-bg);color:var(--info);border-color:var(--info-line)}
.cell.tg.del{background:var(--crit-bg);color:var(--crit);border-color:var(--crit-line)}
.cell.tg.off{background:var(--grid);color:var(--muted);opacity:.75}
.cell.tg.lock{background:var(--lav);color:var(--muted);cursor:not-allowed;font-size:14px}
.cell.z{color:var(--muted);background:var(--grid)}
.cell.w{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-line)}
.cell.c{background:var(--crit-bg);color:var(--crit);border-color:var(--crit-line)}
.cell small{position:absolute;bottom:2px;inset-inline:0;text-align:center;font:400 9.5px var(--f-ar);opacity:.8;line-height:1}
.cell .dy{position:absolute;top:3px;inset-inline-end:4px;width:7px;height:7px;border-radius:9px;background:var(--c-dirty)}
.stk{display:flex;height:14px;border-radius:99px;overflow:hidden;gap:2px;background:var(--grid)}
.stk i{display:block;min-width:2px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,17,31,.45);z-index:40}
.sheet{position:fixed;z-index:41;top:0;bottom:0;left:0;width:min(560px,100%);background:var(--page);border-inline-end:1px solid var(--line2);box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.sheet>header{display:flex;gap:10px;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.sheet>header h2{font-size:18px}
.sheet>header .x{margin-inline-start:auto}
.hsc{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;margin-top:12px}.hsh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;background:var(--lav)}.hsn{text-align:center;line-height:1.1}.hsn b{font-size:20px;display:block}.hsn small{font-size:11px}.hsr{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px 10px;padding:11px 14px;border-top:1px solid var(--grid);cursor:pointer}.hsr:hover{background:var(--lav)}.hsr.dim{opacity:.6}.hsr>.pill{order:2}.hsc1{display:flex;align-items:center;gap:6px;font-weight:600;font-size:15px}.hsf{order:3;grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(60px,1fr));gap:6px}.hsf span{display:grid;line-height:1.25;background:var(--lav);border-radius:8px;padding:5px 7px}.hsf small{font-size:10.5px}.hsf small{font-size:11px;color:var(--muted)}.hsf b{font-size:14px}.hst-tot{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--lav);font-size:14px}.lgb{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden;margin-top:10px}.lgb-h{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--lav)}.lgb-r{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--grid);flex-wrap:wrap}.lgb-c{min-width:92px;display:flex;align-items:center;gap:6px;font-weight:600}.lgb-s{display:flex;gap:6px;flex-wrap:wrap;flex:1}.lgb-s span{display:inline-flex;gap:7px;align-items:baseline;background:var(--lav);border-radius:8px;padding:3px 10px;font:600 13px var(--f-mono)}.lgb-s span small{color:var(--muted);font:500 11.5px var(--f-ar);margin-inline-end:5px}.lgb-t{font:700 14px var(--f-mono);margin-inline-start:auto}input[type=color].cpick{-webkit-appearance:none;appearance:none;width:46px;height:46px;padding:0;border:0;border-radius:50%;background:none;cursor:pointer;box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--line2);flex:none}input[type=color].cp /* Sidebar toggle (desktop): a slim top bar with a panel button. Ctrl+B also toggles. The rail slides out and the page widens. */
#topbar{position:fixed;top:0;left:0;right:224px;height:48px;z-index:20;display:flex;align-items:center;gap:10px;padding-inline:16px;background:color-mix(in srgb,var(--page) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);color:var(--muted);font-weight:500}
#topbar button{all:unset;cursor:pointer;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--ink)}
#topbar button:hover{background:var(--lav)}
#topbar button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#topbar svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
@media (min-width:821px){
  body{overflow-x:clip}
  .main{padding-top:64px}
  .rail{width:224px;will-change:transform}
  html.rail-off .shell{grid-template-columns:0px minmax(0,1fr)}
  html.rail-off .rail{transform:translateX(100%);visibility:hidden}
  html.rail-off #topbar{right:0}
}
@media (min-width:821px) and (prefers-reduced-motion:no-preference){
  html.rail-anim .shell{transition:grid-template-columns .18s cubic-bezier(.4,0,.2,1)}
  html.rail-anim .rail{transition:transform .18s cubic-bezier(.4,0,.2,1),visibility 0s linear 0s}
  html.rail-anim.rail-off .rail{transition:transform .18s cubic-bezier(.4,0,.2,1),visibility 0s linear .18s}
  html.rail-anim #topbar{transition:right .18s cubic-bezier(.4,0,.2,1)}
}
@media (max-width:820px){#topbar{display:none}}
</style>

function reverseDoc(d){if(!can('reverse')&&!(d.type==='SHP'&&can('ship'))){deny('reverse');return {ok:false,err:['مش مسموح لدورك']}}if(dayLocked(S.date))return {ok:false,err:['اليوم مقفول. افتحه من شاشة النهارده الأول.']}

function phFromFile(f,cb){

const rtnWhy=n=>/استبدال|التبديل/.test(n)?'استبدال':/رفض/.test(n)?'رفض الاستلام':/لاغى|الغاء|إلغاء/.test(n)?'ملغي':/لايرد|لا يرد/.test(n)?'لا يرد':/استرجاع|مرتجع/.test(n)?'استرجاع':/تاجيل|تأجيل/.test(n)?'تأجيل':'أخرى';
function rtnSheetParse(rows){
  const get=(r,k)=>{for(const key in r)if(String(key).trim().toLowerCase()===k)return r[key];return undefined};
  const out=[];let coll=0,hasType=false;
  rows.forEach(r=>{const t=get(r,'type');if(t===undefined)return;hasType=true;const type=String(t).trim().toLowerCase();
    if(type!=='return'){if(type)coll++;return}
    const m=String(get(r,'full name')||'').match(/-\s*([A-Za-z]{2}\d{3,5})\s*$/),note=String(get(r,'statusnote')||'').replace(/\s+/g,' ').trim();
    out.push({code:m?m[1].toLowerCase():'',serial:String(get(r,'serial')||'').trim(),st:String(get(r,'order delivery status')||'').trim(),note,why:rtnWhy(note),date:String(get(r,'return date')||'').slice(0,10)})});
  return {ok:hasType,rows:out,coll};
}
function rtnMatch(d,r){
  const H=d.hdr,o=S.orders.find(x=>(r.code&&x.ref.toLowerCase()===r.code)||(r.serial&&String(x.wb)===r.serial));
  const prev=new Set();S.docs.forEach(x=>{if(x.type==='RTN'&&x.status==='done'&&x.id!==d.id)(x.hdr.refs||[]).forEach(f=>prev.add(f))});
  if(!o){const od=oldFind(r.code)||oldFind(r.serial);if(!od)return {k:'unk'};
    if((H.parcels||[]).some(p=>p.ref===od.ref))return {k:'added',o:od,old:true};
    if(od.rt)return {k:'dup',o:od,old:true};
    const cut=rtnCut();return {k:'old',o:od,old:true,arch:!!(cut&&r.date&&r.date<cut)}}
  if((H.refs||[]).indexOf(o.ref)>=0)return {k:'added',o};
  if(o.rt)return {k:'dup',o};
  if(prev.has(o.ref))return {k:'dup',o};
  if(o.st!=='done')return {k:'notdone',o};
  return {k:'ok',o};
}

function flowSheet(w){

  if(w==='blocked'){

  }else if(w==='wait'){
    const byS={};wait.forEach(o=>{const c={};o.lines.forEach(s=>c[s]=(c[s]||0)+1);Object.keys(c).forEach(s=>{const e=byS[s]||(byS[s]={n:0,q:0});e.n++;e.q+=c[s]})});
    body+='<div class="msg">دي أوردرات اتطلبت ومعاها رصيد، بس لسه ما اتشحنتش. الرصيد ما اتخصمش لسه.</div><h3 style="font-size:15px">القطع اللي لازم تتجهّز</h3>'+varT(byS,['مطلوب','في أوردرات'])+'<h3 style="font-size:15px">الأوردرات</h3>'+rowsT(wait.slice(0,80),false);

  }else{
    body+='<h3 style="font-size:15px">حسب البيك أب</h3><div class="tw"><table class="t-sm"><thead><tr><th>البيك أب</th><th class="num">أوردرات</th><th class="num">اتشحن</th><th class="num">مستني</th><th class="num">معطل</th></tr></thead><tbody>'+S.pickups.filter(p=>p.date===viewDate()).map(p=>{const po=os.filter(o=>o.pk===p.id);return '<tr><td><b>'+esc(p.label)+'</b><div class="muted" style="font-size:12px">'+esc(p.src||'')+'</div></td><td class="num">'+N(po.length)+'</td><td class="num">'+N(po.filter(o=>o.st==='done').length)+'</td><td class="num">'+N(po.filter(o=>o.st==='open'&&!C.blocked[o.ref]).length)+'</td><td class="num">'+N(po.filter(o=>o.st==='open'&&C.blocked[o.ref]).length)+'</td></tr>'}).join('')+'</tbody></table></div><h3 style="font-size:15px">الأوردرات</h3>'+rowsT(os.slice(0,80),false);

  body+='<button class="btn" data-a="of2" data-v="'+(w==='all'?'all':w)+'">افتحهم في صفحة الأوردرات</button>';

function ensureCat(s){

  ['skus','models','colors','sizes'].forEach(k=>{if(!c[k])c[k]=[]});

function rebuildCatalog(){
  const C=S.cat;

  D.colors=D0.colors.concat(C.colors);
  const cl=m=>({code:m.code,name:m.name,colors:m.colors.slice(),sizes:m.sizes.slice()});
  const models=D0.models.map(cl).concat(C.models.map(cl));
  models.forEach(m=>{if(C.names[m.code])m.name=C.names[m.code]});
  models.forEach(m=>{const e=C.ext[m.code];if(e){(e.colors||[]).forEach(c=>{if(m.colors.indexOf(c)<0)m.colors.push(c)});(e.sizes||[]).forEach(z=>{if(m.sizes.indexOf(z)<0)m.sizes.push(z)})}});
  const all=D0.skus.concat(C.skus);
  SKU.clear();all.forEach(k=>SKU.set(k.id,k));
  D.skus=all.filter(k=>!C.arch[k.id]);
  Object.keys(IDX).forEach(k=>delete IDX[k]);D.skus.forEach(k=>IDX[k.m+'|'+k.c+'|'+k.s]=k.id);
  models.forEach(m=>{
    m.sizes.sort((a,b)=>szi(a)-szi(b));
    m.colors=m.colors.filter(c=>m.sizes.some(z=>IDX[m.code+'|'+c+'|'+z]));
    m.sizes=m.sizes.filter(z=>m.colors.some(c=>IDX[m.code+'|'+c+'|'+z]));
  });
  D.models=models;MODEL.clear();models.forEach(m=>MODEL.set(m.code,m));
  const active=new Set(D.skus.map(k=>k.m));
  const codes=models.map(m=>m.code).filter(c=>active.has(c)).sort((a,b)=>mkey(a)<mkey(b)?-1:1);
  MORDER.length=0;codes.forEach(c=>MORDER.push(c));
  Object.keys(mIdx).forEach(k=>delete mIdx[k]);MORDER.forEach((c,i)=>mIdx[c]=i);
  if(MORDER.indexOf(UI.s.m)<0)UI.s.m=MORDER[0];

}

function scanNeg(matched){
  const a={};matched.forEach(m=>{const o=orderByRef(m.ref);if(o)o.lines.forEach(s=>a[s]=(a[s]||0)+1)});

}

const arN=x=>String(x==null?'':x).toLowerCase().replace(/[ً-ٟـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه');
const SZ_SET={s:1,m:1,l:1,xl:1,'2xl':1,'3xl':1,'4xl':1};
function stockQ(){const q=arN(UI.s.q||'').trim().split(/\s+/).filter(Boolean);return q.length?q:null}
function skuHit(k,q){const hay=arN(k.id+' '+k.m+' '+k.c+' '+k.s+' '+MODEL.get(k.m).name);return q.every(w=>SZ_SET[w]?k.s.toLowerCase()===w:hay.indexOf(w)>=0)}
function modelHit(c,q){return D.skus.some(k=>k.m===c&&skuHit(k,q))}

const RATE_DEF={leadW:2,safeW:1,tgtW:4,svc:95};
function zOf(p){p=Math.min(99.9,Math.max(50,+p||95))/100;const q=1-p,t=Math.sqrt(-2*Math.log(q));return t-(2.515517+0.802853*t+0.010328*t*t)/(1+1.432788*t+0.189269*t*t+0.001308*t*t*t)}
function rv(k){return S.st[k]!=null?S.st[k]:RATE_DEF[k]}
function rateData(){
  const end=S.date,NW=8,MAXD=28,pkD={};S.pickups.forEach(p=>pkD[p.id]=p.date);
  const wi=d=>{const k=Math.floor(dayDiff(d,end)/7);return(k>=0&&k<NW)?NW-1-k:-1};
  const dem=Array(NW).fill(0),shp=Array(NW).fill(0),M={};let first=null;
  const mm=m=>M[m]||(M[m]={daily:Array(MAXD).fill(0),out:0,inflow:0,net:0});
  S.orders.forEach(o=>{if(o.st==='cx')return;const d=pkD[o.pk];if(!d)return;const age=dayDiff(d,end);if(age<0)return;if(first===null||d<first)first=d;
    const w=wi(d);if(w>=0)dem[w]+=o.lines.length;
    if(age<MAXD)o.lines.forEach(sk=>{const k=SKU.get(sk);if(k)mm(k.m).daily[age]++})});
  S.moves.forEach(m=>{const w=wi(m.date);if(w<0)return;const k=SKU.get(m.sku);
    let q=0;if(m.from==='READY'&&m.to==='EXT_CH'&&(m.type==='SCN'||m.type==='CXL'||m.type==='RTN'))q=m.q;else if(m.from==='EXT_CH'&&m.to==='READY'&&(m.type==='SCN'||m.type==='CXL'||m.type==='RTN'))q=-m.q;
    shp[w]+=q;if(w===NW-1&&k){const x=mm(k.m);x.out+=q;if(m.to==='READY'){x.net+=m.q;if(m.from!=='EXT_CH')x.inflow+=m.q}if(m.from==='READY')x.net-=m.q}});
  const span=first===null?0:Math.min(MAXD,Math.max(1,dayDiff(first,end)+1)),avail=Math.min(7,span);
  const lead=+rv('leadW'),safe=+rv('safeW'),tgt=+rv('tgtW'),z=zOf(rv('svc')),C=ctx(),E=skuStats();
  let ws=0;for(let i=0;i<span;i++)ws+=Math.pow(.5,i/7);
  const needBy={},dmBy={},ropBy={},ssBy={};planRows().forEach(r=>{const mc=SKU.get(r.id).m;needBy[mc]=(needBy[mc]||0)+r.q});
  D.skus.forEach(k=>{const e=E.m[k.id]||{rop:0,ss:0};dmBy[k.m]=(dmBy[k.m]||0)+(C.demand[k.id]||0);ropBy[k.m]=(ropBy[k.m]||0)+e.rop;ssBy[k.m]=(ssBy[k.m]||0)+e.ss});
  const rows=MORDER.map(m=>{const x=M[m]||{daily:Array(MAXD).fill(0),out:0,inflow:0,net:0},dl=x.daily.slice(0,span),ready=mSum(m,'READY'),fac=mSum(m,'FACTORY'),dm=dmBy[m]||0,pos=ready-dm+fac;
    let wsum=0;dl.forEach((v,i)=>wsum+=v*Math.pow(.5,i/7));const rate=span?7*wsum/ws:0;
    const cur=dl.slice(0,7).reduce((a,v)=>a+v,0),prev=dl.slice(7,14).reduce((a,v)=>a+v,0);
    const mean=span?dl.reduce((a,v)=>a+v,0)/span:0,sd=span>=7?Math.sqrt(dl.reduce((a,v)=>a+(v-mean)*(v-mean),0)/(span-1)):null;
    const ss=rate>0?(ssBy[m]||0):0,rop=rate>0?(ropBy[m]||0):0,cv=(span>=14&&mean>0)?sd/mean:null,xyz=cv==null?null:cv<=.5?'X':cv<=1?'Y':'Z';
    const begin=ready-x.net,den=begin+x.inflow,st=den>0?Math.max(0,x.out)/den:null;
    const cover=rate>0?Math.max(0,ready-dm)/rate:null,coverAll=rate>0?Math.max(0,pos)/rate:null,need=needBy[m]||0;
    const trend=(span>=14&&prev>0)?(cur-prev)/prev:null,ssw=rate>0?ss/rate:0;
    let k='good',label='تمام';
    if(rate>0&&pos<=rop){k='crit';label='اطلب تصنيع دلوقتي'}
    else if(rate>0&&cover<lead+ssw){k='warn';label='هيخلص قبل ما الجديد يوصل'}
    else if(rate>0&&coverAll*7>S.st.excess){k='info';label='أكتر من اللازم'}
    else if(rate===0&&ready>0){k='';label='مفيش سحب'}
    else if(rate===0){k='';label='—'}
    return {m,rate,prev,trend,ready,fac,dm,cover,coverAll,rop,ss,need,st,den,cv,xyz,abc:(C.abc||{})[m]||'',out:Math.max(0,x.out),k,label}});
  return {NW,dem,shp,rows,avail,span,end,lead,safe,tgt,z,svc:+rv('svc'),tot:rows.reduce((a,r)=>a+r.rate,0),totReady:rows.reduce((a,r)=>a+r.ready,0)};

  const dead=D.skus.filter(k=>g(k.id,'READY')>0&&!C.vel[k.id]),exc=C.velOK?D.skus.filter(k=>{const i=info(k.id);return i.cov!=null&&i.cov>S.st.excess}):[];
  let val=0,has=false;D.skus.forEach(k=>{const c=+((S.costs[k.m]||{}).cost);if(c){has=true;val+=c*total(k.id)}});

  const mxb=Math.max(1,...Object.values(bk));
  let h='<div class="kpis" style="margin-bottom:16px">'+kpi('اتزان الحركات',drift.length?N(drift.length)+' خطأ':'سليم','مجموع كل الحركات = صفر',drift.length?'crit':'good')+kpi('أصناف بالسالب',N(neg.length),'',neg.length?'crit':'good')+kpi('أصناف راكدة',N(dead.length),'رصيد ومن غير سحب',dead.length?'warn':'')+kpi('قيمة المخزون',has?N(val):'—',has?'جنيه (حسب التكلفة)':'سجّل التكلفة في الإعدادات')+'</div>';
  h+='<div class="grid g2">'+card('المخزون حسب الحالة',stateBar())+card('الأصناف حسب أيام التغطية',Object.keys(bk).map((k,i)=>hbar(k,bk[k],mxb,fmt(bk[k])+' صنف',i<2?'c':i===2?'w':'g')).join('')+(C.velOK?'':'<p class="muted" style="margin-top:8px;font-size:12px">تقديري: مبني على أيام بيانات قليلة.</p>'))+'</div>';
  h+='<div class="grid g2" style="margin-top:16px">'+card('أكبر الأصناف الراكدة',dead.length?'<div class="tw"><table class="t-sm"><tbody>'+dead.sort((a,b)=>g(b.id,'READY')-g(a.id,'READY')).slice(0,10).map(k=>'<tr data-a="sku" data-sku="'+k.id+'"><td>'+thumb(k.m,24)+' '+sw(k.c)+' '+esc(skuName(k.id))+'</td><td class="num">'+N(g(k.id,'READY'))+'</td></tr>').join('')+'</tbody></table></div>':'<div class="empty">مفيش.</div>','رصيد من غير طلب')+card('زيادة عن اللازم',C.velOK?(exc.length?'<div class="tw"><table class="t-sm"><tbody>'+exc.sort((a,b)=>info(b.id).cov-info(a.id).cov).slice(0,10).map(k=>'<tr data-a="sku" data-sku="'+k.id+'"><td>'+esc(skuName(k.id))+'</td><td class="num">'+N(Math.floor(info(k.id).cov))+' يوم</td></tr>').join('')+'</tbody></table></div>':'<div class="empty">مفيش.</div>'):'<div class="empty">بتظهر بعد 3 أيام بيانات.</div>','تغطية أكتر من '+S.st.excess+' يوم')+'</div>';
  return h;
}

function handleFile(file){

  const isCsv=/\.csv$/i.test(file.name);
  if(!window.XLSX&&!(s.t==='scan'&&isCsv)){s.err='مكتبة قراءة Excel ما اتحملتش. اتأكد من الاتصال وجرّب تاني، أو ارفع ملف CSV للسكان.';render();return}
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      s.fname=file.name;s.orig=file;s.err='';
      if(s.t==='scan'){
        let rows;if(isCsv)rows=parseCSVText(new TextDecoder('utf-8').decode(fr.result));else{const wb=XLSX.read(fr.result,{type:'array'});rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''})}
        const sc=parseScan(rows),nm=sc.filter(x=>x.name)[0];if(!s.emp&&nm)s.emp=nm.name;s.res=matchScans(sc);
      }else{
        const wb=XLSX.read(fr.result,{type:'array'});s.rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});s.res=importRows(s.rows,s.channel,'__new__');
      }
    }catch(e){s.res=null;s.err=String(e.message||e)}
    render();
  };
  fr.onerror=()=>{s.err='مقدرتش أقرأ الملف';render()};
  fr.readAsArrayBuffer(file);
}
