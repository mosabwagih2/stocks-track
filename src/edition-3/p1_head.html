<title>Fémini Stock</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Readex+Pro:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: right-hand rail (bottom bar on phones) + one working column. Each screen is built around the daily question it answers.
   Palette: Fémini lavender brand (ink, accent, page, line, lav) + semantic status colors kept separate from the accent. */
:root{
  --page:#fcf9fe;--surface:#ffffff;--lav:#f5f1fd;--ink:#302568;--accent:#5e4394;--on-accent:#ffffff;--muted:#5a5178;
  --line:#e3dcf3;--line2:#cfc2ec;--grid:#ece6f7;--rail:#302568;--on-rail:#f1ecfb;--rail-mute:#b9aedd;--shadow:0 1px 2px rgba(48,37,104,.06),0 8px 24px -12px rgba(48,37,104,.18);
  --crit:#a8231a;--crit-bg:#fbe7e5;--crit-line:#efc3be;--warn:#8a4a07;--warn-bg:#fcf0dc;--warn-line:#efd3a6;
  --good:#0c6b43;--good-bg:#e4f3ea;--good-line:#b9dfc9;--info:#1f528f;--info-bg:#e0ebfa;--info-line:#b9d0ee;--lost:#74278a;--lost-bg:#f2e1f7;
  --c-ready:#2f9e75;--c-dirty:#d89a2b;--c-scrap:#cf4a52;--c-factory:#4a86d6;--c-lost:#a05bb8;--swb:#cfc8de;
  --f-ar:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;--f-disp:'Readex Pro','IBM Plex Sans Arabic',sans-serif;--f-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#14111f;--surface:#1c1830;--lav:#252040;--ink:#ece8fa;--accent:#b9a4f0;--on-accent:#14111f;--muted:#aaa2c6;
  --line:#2f2950;--line2:#463e6c;--grid:#2c2649;--rail:#0f0c1a;--on-rail:#ece8fa;--rail-mute:#9d94c2;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
  --crit:#ff8d94;--crit-bg:#3a1a1e;--crit-line:#6b2c33;--warn:#f0b960;--warn-bg:#35280f;--warn-line:#6b4f1c;
  --good:#5fd0a0;--good-bg:#12302a;--good-line:#246650;--info:#8db8f5;--info-bg:#14283f;--info-line:#274d7a;--lost:#d9a0ea;--lost-bg:#2f1a39;
  --c-ready:#3fb589;--c-dirty:#e3a93f;--c-scrap:#e0606a;--c-factory:#5f98e6;--c-lost:#b873cf;--swb:#5a5280;color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#14111f;--surface:#1c1830;--lav:#252040;--ink:#ece8fa;--accent:#b9a4f0;--on-accent:#14111f;--muted:#aaa2c6;
  --line:#2f2950;--line2:#463e6c;--grid:#2c2649;--rail:#0f0c1a;--on-rail:#ece8fa;--rail-mute:#9d94c2;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
  --crit:#ff8d94;--crit-bg:#3a1a1e;--crit-line:#6b2c33;--warn:#f0b960;--warn-bg:#35280f;--warn-line:#6b4f1c;
  --good:#5fd0a0;--good-bg:#12302a;--good-line:#246650;--info:#8db8f5;--info-bg:#14283f;--info-line:#274d7a;--lost:#d9a0ea;--lost-bg:#2f1a39;
  --c-ready:#3fb589;--c-dirty:#e3a93f;--c-scrap:#e0606a;--c-factory:#5f98e6;--c-lost:#b873cf;--swb:#5a5280;color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font:14px/1.6 var(--f-ar);direction:rtl;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{font-family:var(--f-disp);font-weight:500;text-wrap:balance;letter-spacing:0}
.mono,.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.n{direction:ltr;unicode-bidi:isolate;display:inline-block}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* shell */
.shell{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}
.rail{background:var(--rail);color:var(--on-rail);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:20px 12px;gap:4px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.brand b{font-family:var(--f-disp);font-weight:600;font-size:20px;letter-spacing:.01em}
.brand i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#9a7fe0,#5e4394);display:grid;place-items:center;font-style:normal;font-family:var(--f-disp);font-weight:600;color:#fff}
.brand small{display:block;color:var(--rail-mute);font-size:11px;line-height:1.2}
.nav{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--rail-mute);font-weight:500;position:relative}
.nav:hover{background:rgba(255,255,255,.07);color:var(--on-rail)}
.nav[aria-current=page]{background:rgba(255,255,255,.12);color:#fff}
.nav svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav .bd{margin-inline-start:auto;background:#e0606a;color:#fff;border-radius:99px;font:600 11px/1 var(--f-mono);padding:4px 7px}
.rail .sp{flex:1}
.rail .foot{padding:10px;color:var(--rail-mute);font-size:12px;display:grid;gap:8px}
.tbtn{all:unset;cursor:pointer;display:inline-flex;gap:8px;align-items:center;color:var(--rail-mute);font-size:12px;padding:6px 8px;border-radius:8px}
.tbtn:hover{background:rgba(255,255,255,.07);color:#fff}

.main{padding-block:22px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0;max-width:1240px;width:100%}
.top{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-size:26px;line-height:1.25}
.top .sub{color:var(--muted);margin-top:2px}
.top .tools{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* controls */
.btn{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);cursor:pointer;font-weight:500;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.danger{color:var(--crit);border-color:var(--crit-line)}
.btn[disabled],.btn[aria-disabled=true]{opacity:.45;cursor:not-allowed;pointer-events:none}
input,select,textarea{background:var(--surface);border:1px solid var(--line2);border-radius:9px;padding:8px 10px;min-width:0;max-width:100%}
input[type=number]{font-family:var(--f-mono);text-align:center;width:76px;direction:ltr}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);padding:0}
textarea{width:100%;min-height:70px;font-family:var(--f-mono);direction:ltr}
label.f{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
label.f>input,label.f>select{font-size:14px;color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{all:unset;box-sizing:border-box;cursor:pointer;padding:5px 12px;border-radius:99px;border:1px solid var(--line2);background:var(--surface);font-size:13px;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed=true]{background:var(--ink);color:var(--page);border-color:var(--ink)}
:root[data-theme="dark"] .chip[aria-pressed=true]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed=true]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}}
.chip .n{font-size:12px;opacity:.75}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{all:unset;cursor:pointer;padding:7px 14px;font-weight:500;font-size:13px;border-inline-start:1px solid var(--line2)}
.seg button:first-child{border-inline-start:0}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.card.flat{box-shadow:none}
.card.lift{box-shadow:var(--shadow)}
.card h2{font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h2 .hint{font:400 12px var(--f-ar);color:var(--muted);margin-inline-start:auto}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.split2{grid-template-columns:minmax(0,1fr) 340px}
.stack{display:grid;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--line2);background:var(--lav);white-space:nowrap}
.pill.crit{background:var(--crit-bg);color:var(--crit);border-color:var(--crit-line)}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-line)}
.pill.good{background:var(--good-bg);color:var(--good);border-color:var(--good-line)}
.pill.info{background:var(--info-bg);color:var(--info);border-color:var(--info-line)}
.pill.lost{background:var(--lost-bg);color:var(--lost);border-color:var(--lost-bg)}
.dot{width:9px;height:9px;border-radius:99px;display:inline-block;flex:none}
.sw{width:12px;height:12px;border-radius:99px;border:1px solid var(--swb);display:inline-block;vertical-align:-1px}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 12px;text-align:start;border-bottom:1px solid var(--grid);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--lav);white-space:nowrap;position:sticky;top:0}
tr:last-child td{border-bottom:0}
tbody tr[data-a]{cursor:pointer}
tbody tr[data-a]:hover td{background:var(--lav)}
td.num,th.num{text-align:center}
.t-sm td,.t-sm th{padding:6px 10px}

/* big numbers */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:2px}
.kpi small{color:var(--muted);font-weight:500}
.kpi b{font:600 28px/1.2 var(--f-mono);letter-spacing:-.02em}
.kpi em{font-style:normal;color:var(--muted);font-size:12px}
.kpi.crit b{color:var(--crit)}.kpi.warn b{color:var(--warn)}.kpi.good b{color:var(--good)}

/* flow bar */
.flow{display:flex;height:16px;border-radius:99px;overflow:hidden;background:var(--grid);gap:2px}
.flow i{display:block;min-width:0}
.flow .a{background:var(--c-ready)}.flow .b{background:var(--line2)}.flow .c{background:var(--c-scrap)}
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:12px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.hb{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) auto;gap:10px;align-items:center;padding:3px 0}
.hb .tr{height:10px;background:var(--grid);border-radius:99px;overflow:hidden}
.hb .tr i{display:block;height:100%;background:var(--accent);border-radius:99px}
.hb .tr i.w{background:var(--c-dirty)}.hb .tr i.c{background:var(--c-scrap)}.hb .tr i.g{background:var(--c-ready)}
.hb .v{font:500 13px var(--f-mono);min-width:40px;text-align:end}
.hb .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* action queue */
.queue{display:grid;gap:8px}
.q{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.q .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:700}
.q.crit{border-color:var(--crit-line);background:var(--crit-bg)}.q.crit .ic{background:var(--crit);color:#fff}
.q.warn{border-color:var(--warn-line);background:var(--warn-bg)}.q.warn .ic{background:var(--warn);color:#fff}
.q.info .ic{background:var(--info);color:#fff}
:root[data-theme="dark"] .q .ic{color:#14111f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .q .ic{color:#14111f}}
.q b{display:block}.q span{color:var(--muted);font-size:13px}
.q.crit span,.q.warn span{color:inherit;opacity:.85}
.q.crit b{color:var(--crit)}.q.warn b{color:var(--warn)}

/* stock */
.wh{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
.mlist{display:grid;gap:2px;max-height:calc(100vh - 220px);overflow-y:auto;padding:6px}
.mgrp{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.06em;padding:10px 10px 4px;text-transform:uppercase}
.mi{all:unset;box-sizing:border-box;display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 10px;border-radius:10px;cursor:pointer}
.mi:hover{background:var(--lav)}
.mi[aria-current=true]{background:var(--ink);color:var(--page)}
:root[data-theme="dark"] .mi[aria-current=true]{background:var(--accent);color:var(--on-accent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mi[aria-current=true]{background:var(--accent);color:var(--on-accent)}}
.mi b{font-family:var(--f-mono);font-size:13px}
.mi small{opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mx{border-collapse:separate;border-spacing:4px;width:auto}
.mx th{background:none;position:static;text-align:center;border:0;padding:4px 6px}
.mx td{padding:0;border:0}
.mx .cl{padding:0 8px 0 4px;white-space:nowrap;font-weight:500;text-align:start}
.cell{all:unset;box-sizing:border-box;cursor:pointer;display:grid;place-items:center;min-width:58px;height:46px;border-radius:10px;background:var(--lav);font:500 15px var(--f-mono);position:relative;border:1px solid transparent}
.cell:hover{border-color:var(--accent)}
.cell.z{color:var(--muted);background:var(--grid)}
.cell.w{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-line)}
.cell.c{background:var(--crit-bg);color:var(--crit);border-color:var(--crit-line)}
.cell small{position:absolute;bottom:2px;inset-inline:0;text-align:center;font:400 9.5px var(--f-ar);opacity:.8;line-height:1}
.cell .dy{position:absolute;top:3px;inset-inline-end:4px;width:7px;height:7px;border-radius:9px;background:var(--c-dirty)}
.stk{display:flex;height:14px;border-radius:99px;overflow:hidden;gap:2px;background:var(--grid)}
.stk i{display:block;min-width:2px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,17,31,.45);z-index:40}
.sheet{position:fixed;z-index:41;top:0;bottom:0;left:0;width:min(560px,100%);background:var(--page);border-inline-end:1px solid var(--line2);box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.sheet>header{display:flex;gap:10px;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.sheet>header h2{font-size:18px}
.sheet>header .x{margin-inline-start:auto}
.sheet>div.body{padding:18px;overflow-y:auto;flex:1;display:grid;gap:16px;align-content:start;padding-bottom:max(18px,env(safe-area-inset-bottom,0px))}
.drop{border:1.5px dashed var(--line2);border-radius:14px;padding:22px;text-align:center;display:grid;gap:6px;cursor:pointer;background:var(--surface)}
.drop:hover,.drop.on{border-color:var(--accent);background:var(--lav)}
.msg{padding:10px 14px;border-radius:10px;border:1px solid var(--line2);background:var(--lav)}
.msg.crit{background:var(--crit-bg);border-color:var(--crit-line);color:var(--crit)}
.msg.warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
.msg.good{background:var(--good-bg);border-color:var(--good-line);color:var(--good)}
.msg ul{margin:6px 0 0;padding-inline-start:18px}

/* operations */
.opgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.op{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:4px;align-content:start}
.op:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.op .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--lav);color:var(--accent);margin-bottom:6px}
.op .ic svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.op b{font-weight:600}.op small{color:var(--muted);line-height:1.45}.op em{font:500 11px var(--f-mono);color:var(--accent);font-style:normal;direction:ltr;text-align:start}
.gh{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin:6px 0 8px}
.picker{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--lav)}
.picker label{min-width:120px;flex:1 1 120px}
.stp{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:9px;background:var(--surface);overflow:hidden}
.stp button{all:unset;cursor:pointer;width:30px;height:34px;text-align:center;font-weight:700;color:var(--accent)}
.stp button:hover{background:var(--lav)}
.stp input{border:0;border-radius:0;width:62px;padding:6px 0}
.sum{position:sticky;top:16px;display:grid;gap:12px}
.eff{display:grid;gap:6px;max-height:340px;overflow-y:auto}
.eff .e{display:grid;gap:2px;padding:8px 10px;border-radius:10px;background:var(--lav);font-size:13px}
.eff .e .t{display:flex;gap:8px;justify-content:space-between;font-weight:600}
.chg{font:500 12px var(--f-mono);color:var(--muted);direction:rtl}
.chg b{color:var(--ink)}
.chk{display:grid;gap:6px}
.chk div{display:flex;gap:8px;align-items:flex-start}
.chk .ok::before{content:"✓";color:var(--good);font-weight:700}
.chk .no::before{content:"●";color:var(--crit)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:9px 14px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.toast{position:fixed;inset-inline:0;bottom:max(24px,env(safe-area-inset-bottom,0px));margin-inline:auto;width:max-content;max-width:calc(100% - 32px);background:var(--ink);color:var(--page);padding:10px 18px;border-radius:12px;z-index:60;box-shadow:var(--shadow)}
#tip{position:fixed;z-index:70;background:var(--ink);color:var(--page);padding:8px 11px;border-radius:9px;font-size:12px;max-width:260px;pointer-events:none;line-height:1.5}

.th{display:inline-block;border-radius:8px;object-fit:contain;background:#fff;flex:none;vertical-align:middle;border:1px solid var(--line)}
.th.ph{display:inline-grid;place-items:center;font:600 11px var(--f-mono);color:var(--accent)}
.imgbtn{all:unset;cursor:pointer;display:inline-block;border-radius:10px;position:relative;flex:none}
.imgbtn:hover .th{border-color:var(--accent)}
.imgbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.imgbtn::after{content:'✎';position:absolute;inset-inline-end:-4px;bottom:-4px;background:var(--accent);color:var(--on-accent);width:18px;height:18px;border-radius:99px;font-size:11px;display:grid;place-items:center}
.bigimg{display:block;width:100%;max-width:520px;aspect-ratio:1/1;margin-inline:auto;object-fit:contain;border-radius:14px;background:var(--lav);border:1px solid var(--line)}
