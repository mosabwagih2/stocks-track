<title>مخزن Femini</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Marcellus&family=Montserrat:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: sticky brand bar with tabs, hero + dark stat band, then exception cards and model cards with colour x size heat matrices; drawers for upload / files / settings. */
:root{
  --page:#fcf9fe;--surface:#ffffff;--card:#ffffff;--lav:#f5f1fd;--ink:#302568;--accent:#5e4394;--on-accent:#ffffff;--on-ink:#ffffff;--on-ink-muted:#d8d0f0;
  --muted:#5a5178;--line:#d9d1ee;--line2:#cfc2ec;--line-strong:#cfc2ec;--focus:#5e4394;--grid:#ece6f7;--bar:#5e4394;--bar-soft:#cfc2ec;--band:#302568;
  --crit:#a8231a;--crit-bg:#fbe7e5;--crit-line:#efc3be;--warn:#8a4a07;--warn-bg:#fcf0dc;--warn-line:#efd3a6;--good:#0c6b43;--good-bg:#e4f3ea;--good-line:#b9dfc9;
  --info:#1f528f;--info-bg:#e0ebfa;--info-line:#b9d0ee;--lost:#74278a;--lost-bg:#f2e1f7;--lost-line:#dcb6e8;
  --ok:#0c6b43;--ok-bg:#e4f3ea;--bad:#a8231a;--bad-bg:#fbe7e5;
  --c-ready:#2f9e75;--c-dirty:#d89a2b;--c-damaged:#cf4a52;--c-factory:#4a86d6;--c-lost:#a05bb8;--swatch-border:#cfc8de;
  --sans:"IBM Plex Sans Arabic","Montserrat",system-ui,sans-serif;--latin:"Montserrat","IBM Plex Sans Arabic",system-ui,sans-serif;--disp:"Marcellus","IBM Plex Sans Arabic",Georgia,serif;--font:var(--sans);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#14111f;--surface:#1c1830;--card:#1c1830;--lav:#252040;--ink:#ece8fa;--accent:#b9a4f0;--on-accent:#14111f;--on-ink:#ece8fa;--on-ink-muted:#b5acd6;
  --muted:#aaa2c6;--line:#37305a;--line2:#463e6c;--line-strong:#463e6c;--focus:#b9a4f0;--grid:#2c2649;--bar:#b9a4f0;--bar-soft:#463e6c;--band:#241e42;
  --crit:#ff8d94;--crit-bg:#3a1a1e;--crit-line:#6b2c33;--warn:#f0b960;--warn-bg:#35280f;--warn-line:#6b4f1c;--good:#5fd0a0;--good-bg:#12302a;--good-line:#246650;
  --info:#8db8f5;--info-bg:#14283f;--info-line:#274d7a;--lost:#d9a0ea;--lost-bg:#2f1a39;--lost-line:#593069;
  --ok:#5fd0a0;--ok-bg:#12302a;--bad:#ff8d94;--bad-bg:#3a1a1e;
  --c-ready:#3fb589;--c-dirty:#e3a93f;--c-damaged:#e0606a;--c-factory:#5f98e6;--c-lost:#b873cf;--swatch-border:#5a5280;color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#14111f;--surface:#1c1830;--card:#1c1830;--lav:#252040;--ink:#ece8fa;--accent:#b9a4f0;--on-accent:#14111f;--on-ink:#ece8fa;--on-ink-muted:#b5acd6;
  --muted:#aaa2c6;--line:#37305a;--line2:#463e6c;--line-strong:#463e6c;--focus:#b9a4f0;--grid:#2c2649;--bar:#b9a4f0;--bar-soft:#463e6c;--band:#241e42;
  --crit:#ff8d94;--crit-bg:#3a1a1e;--crit-line:#6b2c33;--warn:#f0b960;--warn-bg:#35280f;--warn-line:#6b4f1c;--good:#5fd0a0;--good-bg:#12302a;--good-line:#246650;
  --info:#8db8f5;--info-bg:#14283f;--info-line:#274d7a;--lost:#d9a0ea;--lost-bg:#2f1a39;--lost-line:#593069;
  --ok:#5fd0a0;--ok-bg:#12302a;--bad:#ff8d94;--bad-bg:#3a1a1e;
  --c-ready:#3fb589;--c-dirty:#e3a93f;--c-damaged:#e0606a;--c-factory:#5f98e6;--c-lost:#b873cf;--swatch-border:#5a5280;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--page);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--page)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
main.wrap{padding-block:0 64px;display:flex;flex-direction:column;gap:18px}
.en,.ltr{direction:ltr;unicode-bidi:isolate}
.eyebrow{font-family:var(--latin);font-size:11.5px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:var(--accent)}
.label,.note{font-size:12px;color:var(--muted)}
.sub{color:var(--muted);font-size:13px;margin:0}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--page) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .bar1{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding-block:10px 0}
.brand{display:flex;align-items:baseline;gap:10px;margin-inline-end:auto}
.brand .word{font-family:var(--disp);font-size:24px;color:var(--ink)}
.brand .sub{font-size:13px;color:var(--muted)}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin;padding-block:2px 0}
.tab{appearance:none;border:0;background:none;color:var(--muted);font-weight:600;font-size:14px;padding:9px 14px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.btn{border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:13px}
.btn:hover{border-color:var(--accent)}
.btn.primary,.btn.pri{background:var(--ink);color:var(--page);border-color:var(--ink)}
.btn.primary:hover,.btn.pri:hover{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.bad,.btn.danger{color:var(--crit);border-color:var(--crit-line)}
.btn.sm{padding:3px 11px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
select.sel,input,select,textarea{border:1px solid var(--line2);background:var(--card);border-radius:10px;padding:6px 10px;min-width:0;font-size:13px}
select.sel{border-radius:999px;padding:7px 12px;cursor:pointer}
input[type=number]{width:78px;font-variant-numeric:tabular-nums}
input[type=checkbox],input[type=radio]{accent-color:var(--accent)}
.field{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,min(50%,560px));gap:14px 32px;align-items:end;padding-block:24px 6px}
.hero h1{font-size:32px;line-height:1.2}
.hero h1 .d{font-family:var(--disp);font-weight:400;color:var(--accent)}
.hero p{margin:6px 0 0;color:var(--muted);max-width:70ch}
@media (max-width:760px){.hero{grid-template-columns:1fr}.hero h1{font-size:25px}}
.datachips{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
@media (max-width:760px){.datachips{justify-content:flex-start}}
.dchip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12px;border:1px solid var(--line);background:var(--card);color:var(--muted)}
.dchip i{width:7px;height:7px;border-radius:50%;background:var(--line2)}
.dchip.ok i{background:var(--good)}.dchip.miss i{background:var(--crit)}.dchip.part i{background:var(--warn)}.dchip.ok{color:var(--ink)}
.notice{display:flex;gap:12px;align-items:flex-start;border-radius:14px;padding:12px 16px;border:1px solid var(--warn-line);background:var(--warn-bg);color:var(--warn)}
.notice.info{border-color:var(--line);background:var(--lav);color:var(--ink)}
/* stat band */
.band{background:var(--band);color:var(--on-ink);border-radius:18px;padding:22px 26px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:18px 24px}
@media (max-width:1100px){.band{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.band{grid-template-columns:repeat(2,minmax(0,1fr));padding:18px}}
.stat{display:flex;flex-direction:column;gap:4px;min-width:0}
.stat .v{font-family:var(--disp);font-size:32px;line-height:1;font-variant-numeric:tabular-nums;direction:ltr;text-align:start}
.stat .v small{display:block;font-size:12.5px;color:var(--on-ink-muted);margin-top:6px;font-family:var(--sans);direction:rtl}
.stat .k{font-size:12.5px;color:var(--on-ink-muted)}
.stat.hot .v{color:#ffb4ae}
.stat.lead{border-inline-end:1px solid rgba(216,208,240,.25);padding-inline-end:18px}
@media (max-width:560px){.stat.lead{border:0;padding:0}}
/* sections */
.sh{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 20px}
.sh .t{margin-inline-end:auto}
.sh h2,h2{font-family:var(--disp);font-weight:400;font-size:24px;line-height:1.25}
.sh p{margin:4px 0 0;color:var(--muted);font-size:13.5px;max-width:78ch}
section.blk{margin-top:22px;display:flex;flex-direction:column;gap:14px}
h3{font-size:15px}
/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:999px;background:var(--card);padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;border-radius:999px;padding:5px 12px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--page)}
.search{border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:6px 14px;min-width:0;width:200px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg{width:14px;height:14px;border-radius:4px;border:1px solid;display:inline-block}
.lg.c{background:var(--crit-bg);border-color:var(--crit-line)}.lg.w{background:var(--warn-bg);border-color:var(--warn-line)}.lg.g{background:var(--card);border-color:var(--line)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:6px}
/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:500;border:1px solid transparent;white-space:nowrap}
.p-ok{color:var(--good);background:var(--good-bg);border-color:var(--good-line)}
.p-warn{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-line)}
.p-bad{color:var(--crit);background:var(--crit-bg);border-color:var(--crit-line)}
.p-info{color:var(--info);background:var(--info-bg);border-color:var(--info-line)}
.p-lost{color:var(--lost);background:var(--lost-bg);border-color:var(--lost-line)}
.p-mute{color:var(--muted);background:var(--lav);border-color:var(--line)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.abc{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;font-size:11px;font-weight:600;font-family:var(--latin);border:1px solid var(--line2);color:var(--accent);background:var(--lav)}
.abc.A{background:var(--ink);color:var(--page);border-color:var(--ink)}
/* exceptions */
.exc{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,208px),1fr));gap:10px}
.exc .ec{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:start;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;cursor:pointer;color:var(--ink);min-width:0}
.exc .ec:hover{border-color:var(--accent)}
.exc .ec[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--accent);border-color:var(--accent)}
.exc .ec .n{font-family:var(--disp);font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.exc .ec .t{font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px}
.exc .ec .d{font-size:11.5px;color:var(--muted);line-height:1.4}
.exc .ec .sv{width:8px;height:8px;border-radius:50%;flex:none}
.exc .ec.crit .sv{background:var(--crit)}.exc .ec.crit .n{color:var(--crit)}
.exc .ec.warn .sv{background:var(--warn)}.exc .ec.warn .n{color:var(--warn)}
.exc .ec.info .sv{background:var(--accent)}
.exc .ec.zero{opacity:.55}
.exc .ec.na{cursor:default;opacity:.6;border-style:dashed}
.exc .ec.na .n{font-size:14px;font-family:var(--sans);color:var(--muted)}
.excnote{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;border:1px solid var(--line2);background:var(--lav);border-radius:12px;padding:8px 12px;font-size:13px}
.excnote .btn{margin-inline-start:auto}
/* pickups strip */
.pks{display:flex;flex-wrap:wrap;gap:8px}
.pk{display:flex;flex-direction:column;gap:3px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 12px;min-width:170px;cursor:pointer;text-align:start}
.pk:hover{border-color:var(--accent)}
.pk b{font-size:13px}.pk span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pk.add{border-style:dashed;justify-content:center;align-items:center;color:var(--accent);font-weight:500;background:transparent}
.pk.add:hover{background:var(--lav)}
/* model cards */
.models{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,560px),1fr));gap:16px}
.model{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.mh{display:flex;flex-wrap:wrap;align-items:flex-start;gap:8px 12px}
.mh .id{display:flex;flex-direction:column;gap:2px;margin-inline-end:auto;min-width:0}
.mh .code{font-family:var(--latin);font-weight:600;letter-spacing:.02em;font-size:19px}
.mh .nm{font-family:var(--disp);color:var(--accent);font-size:15px}
.mh .line{font-size:11px;letter-spacing:.2em;font-family:var(--latin);font-weight:600;text-transform:uppercase;color:var(--muted)}
.mtot{text-align:end}
.mtot .v{font-family:var(--disp);font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.mtot .k{font-size:12px;color:var(--muted)}
.tw{overflow-x:auto;margin-inline:-4px;padding-inline:4px}
table.mx{border-collapse:separate;border-spacing:3px;width:100%;min-width:480px}
.mx th{font-family:var(--latin);font-size:11.5px;font-weight:600;color:var(--muted);padding:4px 2px;text-align:center;background:none;position:static}
.mx th.cl{text-align:start}
.mx td{text-align:center;padding:0;height:36px;border:0;border-radius:6px;font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;background:var(--lav);white-space:nowrap}
.mx td.cl{text-align:start;font-weight:500;font-size:13px;white-space:nowrap;padding-inline-end:8px;background:none}
.mx td.z{color:var(--line2);font-weight:400}
.mx td.c{background:var(--crit-bg);color:var(--crit);box-shadow:inset 0 0 0 1px var(--crit-line)}
.mx td.w{background:var(--warn-bg);color:var(--warn);box-shadow:inset 0 0 0 1px var(--warn-line)}
.mx td.hl{outline:2px solid var(--accent);outline-offset:-2px}
.mx td.t,.mx tfoot td{background:var(--lav);color:var(--ink)}
.mx tfoot td{font-weight:600}
.mx tfoot td.cl{background:none;color:var(--muted);font-size:12px}
.mx td.h{background:color-mix(in srgb,var(--accent) calc(var(--h,0) * 60%),transparent)}
.mx td .split{display:block;font-size:9.5px;font-weight:500;line-height:1;opacity:.9;margin-top:1px}
.mx td[data-tip]{cursor:help}
.sw{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid var(--swatch-border);vertical-align:-1px;margin-inline-end:6px;flex:none}
.mf{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.ratio{display:flex;height:10px;border-radius:5px;overflow:hidden;flex:1 1 160px;min-width:140px;gap:2px;background:var(--card)}
.ratio i{display:block;height:100%;background:var(--bar)}
.ratio i:nth-child(even){background:var(--bar-soft)}
.empty{border:1px dashed var(--line2);border-radius:14px;padding:28px;text-align:center;color:var(--muted);background:var(--card)}
/* cards, panels, tables */
.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0}
.panel h3{margin-bottom:2px}
.panel .cap{font-size:12.5px;color:var(--muted);margin:0 0 12px}
.lav{background:var(--lav);border-radius:14px;padding:12px 14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grow{flex:1 1 auto;min-width:0}
.grid{display:grid;gap:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:980px){.grid3{grid-template-columns:1fr 1fr}}
@media (max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-family:var(--disp);font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{background:var(--lav);color:var(--muted);font-weight:500;font-size:12px;text-align:start;padding:9px 11px;white-space:nowrap;position:sticky;top:0}
td{padding:6px 11px;border-top:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
td.n,th.n{text-align:end}
td.g{white-space:normal}
tr.tot td{font-weight:700;background:var(--lav)}
.neg{color:var(--crit);font-weight:700}.posv{color:var(--good);font-weight:700}.zero{color:var(--muted)}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--lav);min-width:60px}
.bar i{display:block;height:100%}
.msg{border-radius:12px;padding:12px 14px;border:1px solid;display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
.msg.bad{background:var(--crit-bg);color:var(--crit);border-color:var(--crit-line)}
.msg.ok{background:var(--good-bg);color:var(--good);border-color:var(--good-line)}
.msg.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-line)}
.msg ul{margin:6px 0 0;padding-inline-start:18px}
.split{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.split{grid-template-columns:minmax(0,1fr)}}
.dl{display:flex;flex-direction:column;gap:6px;max-height:70vh;overflow:auto}
.di{appearance:none;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;cursor:pointer;font-size:13px;color:var(--ink)}
.di:hover{border-color:var(--accent)}
.di[aria-current="true"]{border-color:var(--accent);background:var(--lav)}
.mt{display:grid;grid-template-columns:auto repeat(auto-fit,minmax(54px,1fr));gap:4px;align-items:center;font-size:12px}
.mt input{width:100%;padding:4px 5px;text-align:center}
.hm{text-align:center;border-radius:6px;padding:5px 4px;font-variant-numeric:tabular-nums;background:color-mix(in srgb,var(--accent) calc(var(--h,0) * 70%),transparent)}
details>summary{cursor:pointer;font-weight:600}
/* analytics bars */
.vbars{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:22px;border-bottom:1px solid var(--line);position:relative}
.vb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative;min-width:0;cursor:default}
.vb .b{width:min(34px,70%);background:var(--bar);border-radius:4px 4px 0 0;min-height:2px}
.vb .pct{font-size:12px;font-weight:600;margin-bottom:4px;font-variant-numeric:tabular-nums}
.vb:hover .b{background:var(--ink)}
.vlab{display:flex;gap:10px}

var LINE_RE=/^(.*?) \( (.*?) \)-(.*)-(.*)-(\d+)$/;
function importRows(rows,fname,channel){
  var H=rows[0].map(function(x){return String(x).trim()}),ix={};
  for(var k in CH_ORDER_COLS)ix[k]=H.indexOf(CH_ORDER_COLS[k]);
  if(ix.ref<0||ix.items<0)throw new Error('الأعمدة المطلوبة مش موجودة (كود الاوردر / المنتجات). الملف لازم يكون بنفس تنسيق فيندور.');

  var orders=[],dups=[],unk={};
  rows.slice(1).forEach(function(r){
    var ref=String(r[ix.ref]||'').trim();if(!ref)return;
    if(existing[channel+'|'+ref]){dups.push(ref);return}
    var o={ref:ref,wb:r[ix.wb],type:String(r[ix.ty]).indexOf('استبدال')>=0?'استبدال':'جديد',gov:r[ix.gov],total:r[ix.total],lines:[],bad:[]};
    String(r[ix.items]).split(', ').forEach(function(it){
      var m=LINE_RE.exec(it.trim());if(!m){o.bad.push([it,'','',1]);return}
      var code=m[1],size=m[3].trim(),color=m[4].trim(),q=+m[5],mc=alias(code),id=mc&&IDX[mc+'|'+color+'|'+size];
      if(id){for(var i=0;i<q;i++)o.lines.push(id)}else{o.bad.push([code,size,color,q]);if(!mc)unk[code]=1}

function detectBundles(C){
  var sig={};
  C.hist.forEach(function(x){
    var comp={};x.o.lines.forEach(function(s){var k=SKU.get(s),key=k.m+'|'+k.c;comp[key]=(comp[key]||0)+1});
    var ks=Object.keys(comp).sort();if(ks.length<3)return;
    var sg=ks.map(function(k){return k+':'+comp[k]}).join(','),o=sig[sg]||(sig[sg]={s:sg,comp:comp,n:0,pcs:ks.reduce(function(a,k){return a+comp[k]},0),bySize:{},mixed:0,today:0});
    o.n++;var zs={};x.o.lines.forEach(function(s){zs[SKU.get(s).s]=1});var zk=Object.keys(zs);
    if(x.date===UI.date){if(zk.length===1)o.bySize[zk[0]]=(o.bySize[zk[0]]||0)+1;else o.mixed++;o.today++}
  });
  var bs=Object.keys(sig).map(function(k){return sig[k]}).filter(function(b){return b.n>=3}).sort(function(a,b){return b.n-a.n});
  bs.forEach(function(b){b.ready={};SZ.forEach(function(z){var min=Infinity,lim=[];Object.keys(b.comp).forEach(function(k){var p=k.split('|'),id=IDX[p[0]+'|'+p[1]+'|'+z],have=id?Math.floor(g(id,'READY')/b.comp[k]):0;if(have<min){min=have;lim=[k]}else if(have===min)lim.push(k)});b.ready[z]={n:min===Infinity?0:min,lim:lim}})});
  return bs;
}
function retStats(){

  S.moves.forEach(function(m){
    var k=SKU.get(m.s);if(!k)return;
    if(m.ty==='PICKUP'){var s=isInt(m.t)?-1:1,ch=isInt(m.t)?m.f:m.t;o.out+=s*m.q;(o.byM[k.m]=o.byM[k.m]||{out:0,ret:0})['out']+=s*m.q;(o.byZ[k.s]=o.byZ[k.s]||{out:0,ret:0}).out+=s*m.q;(o.byCh[ch]=o.byCh[ch]||{out:0,ret:0,lost:0}).out+=s*m.q}
    if(m.ty==='RETURN'){var s2=isInt(m.f)?-1:1,ch2=isInt(m.f)?m.t:m.f,st=isInt(m.f)?m.f:m.t;o.ret+=s2*m.q;if(st==='READY')o.rr+=s2*m.q;if(st==='DIRTY')o.rd+=s2*m.q;if(st==='DAMAGED')o.rg+=s2*m.q;(o.byM[k.m]=o.byM[k.m]||{out:0,ret:0}).ret+=s2*m.q;(o.byZ[k.s]=o.byZ[k.s]||{out:0,ret:0}).ret+=s2*m.q;(o.byCh[ch2]=o.byCh[ch2]||{out:0,ret:0,lost:0}).ret+=s2*m.q}
    if(m.ty==='RETURN_LOST'){var s3=isInt(m.f)?-1:1,ch3=isInt(m.f)?m.t:m.f;o.lost+=s3*m.q;(o.byCh[ch3]=o.byCh[ch3]||{out:0,ret:0,lost:0}).lost+=s3*m.q}

}

function parseCount(wb){
  var best=null,res=[/الرصيد الحالي/,/الكمية|العدد|الجرد|الفعلي/,/qty|stock|count/i];
  wb.SheetNames.forEach(function(n){
    var rows=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:''});
    for(var i=0;i<Math.min(rows.length,10);i++){
      var H=rows[i].map(function(x){return String(x).trim()});
      var im=H.findIndex(function(h){return /كود الموديل|^الموديل|model/i.test(h)&&!/اسم/.test(h)}),ic=H.findIndex(function(h){return /^اللون|color/i.test(h)}),iz=H.findIndex(function(h){return /المقاس|size/i.test(h)});
      if(im<0||ic<0||iz<0)continue;
      var iq=-1,pr=-1;res.some(function(re,ri){var ix=H.findIndex(function(h){return re.test(h)});if(ix>=0){iq=ix;pr=ri;return true}return false});
      if(iq<0)continue;
      var score=rows.length+(pr===1?5000:0);
      if(!best||score>best.score)best={sheet:n,rows:rows,h:i,im:im,ic:ic,iz:iz,iq:iq,score:score};
      break;
    }
  });
  if(!best)throw new Error('مش لاقي أعمدة (كود الموديل / اللون / المقاس / الكمية) في أي شيت');
  var lines={},unk=[],total=0;
  best.rows.slice(best.h+1).forEach(function(r){
    var m=String(r[best.im]).trim(),c=String(r[best.ic]).trim(),z=String(r[best.iz]).trim();if(!m)return;
    var q=+r[best.iq];if(isNaN(q))return;
    var mc=alias(m)||m,id=IDX[mc+'|'+c+'|'+z];
    if(!id){unk.push(m+' '+c+' '+z);return}
    lines[id]=(lines[id]||0)+q;total+=q;
  });
  return {sheet:best.sheet,col:String(best.rows[best.h][best.iq]),lines:lines,unk:unk,total:total,n:Object.keys(lines).length};
}
function parseCSVText(t){var rows=[],r=[],f='',q=false;for(var i=0;i<t.length;i++){var c=t.charAt(i);if(q){if(c==='"'){if(t.charAt(i+1)==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){r.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t.charAt(i+1)==='\n')i++;r.push(f);f='';rows.push(r);r=[]}else f+=c}if(f!==''||r.length){r.push(f);rows.push(r)}return rows.filter(function(x){return x.some(function(y){return String(y).trim()!==''})})}
function parseScan(rows){
  var re=/codecontent|^code$|content|الكود|^كود/,hi=-1,H;
  for(var i=0;i<Math.min(rows.length,6);i++){H=rows[i].map(function(x){return String(x).trim().toLowerCase()});if(H.some(function(h){return re.test(h)})){hi=i;break}}
  if(hi<0)throw new Error('مش لاقي عمود الكود (CODECONTENT). الملف لازم يكون تصدير QRbot أو فيه عمود بكود الأوردر.');
  var ic=H.findIndex(function(h){return re.test(h)}),idt=H.findIndex(function(h){return /^date|time|وقت|تاريخ/.test(h)}),inm=H.findIndex(function(h){return /^name$|employee|موظف|^الاسم/.test(h)}),out=[];
  rows.slice(hi+1).forEach(function(r){var c=String(r[ic]==null?'':r[ic]).trim();if(!c)return;out.push({code:c,t:idt>=0?String(r[idt]||'').slice(0,19):'',name:inm>=0?String(r[inm]||'').trim():''})});
  return out;
}
function matchScans(scans){
  var idx={};
  S.docs.forEach(function(d){if(d.type==='PKP'&&d.status==='draft')d.hdr.orders.forEach(function(o){if(d.hdr.cx[o.ref])return;idx[String(o.ref).toLowerCase()]={d:d,o:o};if(o.wb)idx[String(o.wb)]={d:d,o:o}})});
  var seen={},matched=[],dups=[],already=[],unk=[];
  scans.forEach(function(s){
    var k=s.code.toLowerCase();if(seen[k]){dups.push(s.code);return}seen[k]=1;
    var x=idx[k];if(!x||(x.o.bad&&x.o.bad.length)){unk.push(s.code);return}
    if(x.o.sc){already.push({code:x.o.ref,by:x.o.sc.by,doc:x.o.sc.doc});return}
    matched.push({pk:x.d.id,ref:x.o.ref,t:s.t,label:x.d.hdr.label,pcs:x.o.lines.length});
  });
  return {scans:scans.length,matched:matched,dups:dups,already:already,unk:unk};
}
function handleFile(file){
  var d=UI.drawer;if(!d||d.kind!=='upload'){UI.drawer={kind:'upload',type:'pickup',channel:'CH_VENDOOR',date:UI.date,emp:lastEmp()};d=UI.drawer}
  if(!window.XLSX&&!(d.type==='scan'&&/\.csv$/i.test(file.name))){d.err='مكتبة قراءة Excel ما اتحملتش. تأكد من الاتصال وجرب تاني.';render();return}
  var fr=new FileReader();
  fr.onload=function(){
    try{
      d.fname=file.name;d.err='';
      if(d.type==='scan'){
        var rows;if(/\.csv$/i.test(file.name))rows=parseCSVText(new TextDecoder('utf-8').decode(fr.result));else{var wb0=XLSX.read(fr.result,{type:'array'});rows=XLSX.utils.sheet_to_json(wb0.Sheets[wb0.SheetNames[0]],{header:1,defval:''})}
        d.scans=parseScan(rows);var nm=d.scans.filter(function(x){return x.name})[0];if(!d.emp&&nm)d.emp=nm.name;d.res=matchScans(d.scans);
      }else{
        var wb=XLSX.read(fr.result,{type:'array'});
        if(d.type==='count'){d.res=parseCount(wb)}
        else{var rows2=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});d.rows=rows2;d.res=importRows(rows2,file.name,d.channel)}
      }
    }catch(e){d.res=null;d.err=String(e.message||e)}
    render();
  };
  fr.onerror=function(){d.err='مقدرتش أقرأ الملف';render()};
  fr.readAsArrayBuffer(file);
}
function handleFileInput(el){var f=el.files&&el.files[0];el.value='';if(f)handleFile(f)}

  PKP:{t:'استلمت بيك أب من شركة',s:'ارفع شيت الشركة. ده المطلوب بس، ومبيخصمش من المخزون لحد ما الأوردرات تتسكان.',ic:'↑'},
  SCN:{t:'سجّلت أوردرات بالسكان',s:'ارفع ملف السكان (QRbot). كل أوردر اتسكان بيتخصم من المخزون.',ic:'▣'},
  RTN:{t:'استلمت مرتجع من شركة',s:'بتفرز القطع: سليم أو هالك نظافة أو هالك نهائي، والناقص بيتسجل مفقود.',ic:'↓'},
  SHP:{t:'بعتّ قطع للمحل',s:'بتنقص من الجاهز.',ic:'→'},
  STS:{t:'لقيت قطع هالك نظافة أو هالك نهائي',s:'بتنقلها من الجاهز لهالك نظافة أو هالك نهائي.',ic:'!'},
  FSD:{t:'بعتّ قطع للمصنع',s:'غسيل لهالك النظافة (بيرجع) أو هالك نهائي (بيخرج).',ic:'⇢'},
  FRC:{t:'استلمت قطع مغسولة من المصنع',s:'بترجّعها جاهزة.',ic:'⇠'},
  CNT:{t:'عملت جرد',s:'بتعد فعليا وتقارن بالسيستم.',ic:'✓'},
  LST:{t:'حسمت قطع مفقودة',s:'لقيناها، اتعوّضت، أو بتتشطب.',ic:'؟'}
};
var OP_ORDER=['RCV','PKP','RTN','SHP','STS','FSD','FRC','CNT','LST'];
var OP_GROUPS=[{t:'استلام',s:'اللي داخل المخزن.',ops:['RCV','RTN','FRC']},{t:'إخراج',s:'اللي خارج من المخزن.',ops:['PKP','SCN','SHP','FSD']},{t:'تعديل الرصيد',s:'نقل القطع بين الحالات، والجرد، وحسم المفقود.',ops:['STS','CNT','LST']}];
var OP_EN={SCN:'Scanned Orders',RCV:'Receipt',PKP:'Delivery order',RTN:'Return',SHP:'Transfer',STS:'Status change',FSD:'Send out',FRC:'Receipt',CNT:'Physical inventory',LST:'Adjustment'};
function opStat(t){var ds=S.docs.filter(function(x){return x.type===t});return {dr:ds.filter(function(x){return x.status==='draft'&&!(x.type==='PKP'&&pkDone(x))}).length,last:ds.filter(function(x){return x.status==='confirmed'||(x.type==='PKP'&&pkDone(x))}).map(function(x){return x.date}).sort().pop()}}
function opCard(t){var o=OPS[t],st=opStat(t);return '<button class="op" data-a="startop" data-t="'+t+'"><span class="oh"><span class="oi">'+o.ic+'</span><span class="note en">'+OP_EN[t]+'</span></span><span class="ot">'+o.t+'</span><span class="os">'+o.s+'</span><span class="of">'+(st.dr?pill(st.dr+' لسه ما اتأكدتش','warn'):'')+'<span class="note">'+(st.last?'آخر عملية <span class="en">'+st.last+'</span>':'لسه ما اتعملتش')+'</span></span></button>'}
function bl(b){return BL[b]||chName(b)}
function piece(s){var k=SKU.get(s);return '<span class="pc"><b class="en">'+k.m+'</b> '+esc(MODEL.get(k.m).name)+' · '+sw(k.c)+esc(k.c)+' · <span class="en">'+k.s+'</span></span>'}
function statusPill(d){if(d.type==='PKP'&&d.status==='draft')return pkDone(d)?pill('اتقفل','ok'):pill('مفتوح','warn');return d.status==='draft'?pill('لسه ما اتأكدتش','warn'):d.status==='reversed'?pill('اتلغت','mute'):pill('اتسجّلت','ok')}
function stepHead(n,t,sub){return '<div class="step"><span class="sn">'+n+'</span><div><h3>'+t+'</h3>'+(sub?'<p class="note">'+sub+'</p>':'')+'</div></div>'}
function sumQ(mv){return mv.reduce(function(a,m){return a+m.q},0)}

/* what a document will do (or did) to the warehouse */
function effectFrom(mv){
  var delta={},outs={},ins={},by={};
  mv.forEach(function(m){
    var o=by[m.s]||(by[m.s]={});
    if(isInt(m.t)){delta[m.t]=(delta[m.t]||0)+m.q;o[m.t]=(o[m.t]||0)+m.q}else outs[bl(m.t)]=(outs[bl(m.t)]||0)+m.q;
    if(isInt(m.f)){delta[m.f]=(delta[m.f]||0)-m.q;o[m.f]=(o[m.f]||0)-m.q}else ins[bl(m.f)]=(ins[bl(m.f)]||0)+m.q;
  });
  return {delta:delta,outs:outs,ins:ins,by:by,n:Object.keys(by).length};
}
function effectHTML(e,after){
  var t=totals(),rows=INTERNAL.filter(function(b){return e.delta[b]}).map(function(b){
    var v=e.delta[b];
    return '<div class="eff-row"><span class="dot" style="background:var(--'+SC[b]+')"></span><b>'+ST[b]+'</b><span class="'+(v>0?'posv':'neg')+' en">'+(v>0?'+':'−')+fmt(Math.abs(v))+'</span>'+(after?'':'<span class="chg"><span class="chip"><i>دلوقتي</i><b class="en">'+fmt(t[b])+'</b></span><span class="chip"><i>هيبقى</i><b class="en">'+fmt(t[b]+v)+'</b></span></span>')+'</div>'});
  Object.keys(e.ins).forEach(function(k){rows.push('<div class="eff-row"><span class="note">داخل للمخزن من</span><b>'+esc(k)+'</b><span class="en">'+fmt(e.ins[k])+'</span></div>')});
  Object.keys(e.outs).forEach(function(k){rows.push('<div class="eff-row"><span class="note">خارج من المخزن إلى</span><b>'+esc(k)+'</b><span class="en">'+fmt(e.outs[k])+'</span></div>')});
  if(!rows.length)return '<p class="note">لسه ما أضفتش أي قطع، فمفيش تأثير على المخزن.</p>';
  var skus=Object.keys(e.by).sort(skuSort),lines=skus.slice(0,10).map(function(s){
    var parts=INTERNAL.filter(function(b){return e.by[s][b]}).map(function(b){var dv=e.by[s][b];return '<span class="chg"><b>'+ST[b]+'</b>'+(after?'<span class="chip"><b class="en">'+(dv>0?'+':'−')+fmt(Math.abs(dv))+'</b></span>':'<span class="chip"><i>دلوقتي</i><b class="en">'+fmt(g(s,b))+'</b></span><span class="chip"><i>هيبقى</i><b class="en">'+fmt(g(s,b)+dv)+'</b></span>')+'</span>'});
    return '<tr><td>'+piece(s)+'</td><td>'+(parts.join(' · ')||'<span class="note">خارج من المخزن</span>')+'</td></tr>'}).join('');
  return '<div class="eff">'+rows.join('')+'</div>'+(skus.length?'<details style="margin-top:10px"><summary>التفصيل لكل قطعة ('+skus.length+')</summary><div class="scroll" style="margin-top:8px;max-height:320px;overflow:auto"><table><tr><th>القطعة</th><th>الأثر</th></tr>'+lines+'</table></div>'+(skus.length>10?'<p class="note">أول 10 قطع من '+skus.length+'.</p>':'')+'</details>':'');
}
/* one plain sentence per document, for lists */
function draftQty(d){
  if(d.type==='PKP'){var r=pkReq(d);return Object.keys(r).reduce(function(a,s){return a+r[s]},0)}
  if(d.type==='RTN')return d.lines.reduce(function(a,l){return a+(+l.e||0)},0);
  if(d.type==='CNT')return Object.keys(d.hdr.cnt||{}).length;
  return d.lines.reduce(function(a,l){return a+(+l.q||0)},0);
}
function docLine(d){
  var h=d.hdr,ms=d.no?S.moves.filter(function(m){return m.doc===d.no}):[],sm=function(ty){return ms.filter(function(m){return m.ty===ty}).reduce(function(a,m){return a+m.q},0)},q=draftQty(d),dr=d.status==='draft';
  if(d.type==='OPN')return 'الرصيد الافتتاحي · '+fmt(sm('OPENING'))+' قطعة';
  if(d.type==='REV')return 'إلغاء عملية '+esc(h.of);
  if(d.type==='RCV')return 'استلام من المصنع · '+fmt(dr?q:sm('RECEIPT'))+' قطعة'+(h.supplyNo?' · '+esc(h.supplyNo):'');
  if(d.type==='PKP'){var pc=pkCounts(d);return esc(chName(h.channel))+' · '+esc(h.label)+' · اتسجّل '+pc.scanned+' من '+pc.total+' أوردر'+(pc.pending?' · واقف '+pc.pending:'')}
  if(d.type==='SCN')return 'سكان '+esc(h.emp||'—')+' · '+(h.matched||[]).length+' أوردر جديد'+(d.status==='draft'?' (لسه ما اتأكدش)':'')
  if(d.type==='RTN')return 'مرتجع '+esc(chName(h.channel))+(dr?' · المفروض '+fmt(q):' · استلمت '+fmt(sm('RETURN'))+(sm('RETURN_LOST')?' · مفقود '+fmt(sm('RETURN_LOST')):''));
  if(d.type==='SHP')return 'للمحل · '+fmt(dr?q:sm('SHOP'))+' قطعة';
  if(d.type==='STS')return 'تغيير حالة · '+fmt(dr?q:sumQ(ms))+' قطعة';
  if(d.type==='FSD')return (h.purpose==='waste'?'هالك للمصنع':'غسيل للمصنع')+' · '+fmt(dr?q:sumQ(ms))+' قطعة';
  if(d.type==='FRC')return 'استلام مغسول · '+fmt(dr?q:sm('FACTORY_RECV'))+' قطعة';
  if(d.type==='CNT')return 'جرد · '+(dr?fmt(q)+' صنف معدود':(h.fin?fmt(h.fin.counted)+' صنف · عجز '+fmt(h.fin.short)+' · زيادة '+fmt(h.fin.sur):''));
  if(d.type==='LST')return 'حسم مفقود · '+fmt(dr?q:sumQ(ms))+' قطعة';
  return TYPES[d.type];
}
var DT_CHIPS=[['','الكل'],['RCV','توريد'],['PKP','بيك أب'],['RTN','مرتجع'],['SHP','محل'],['MISC','تانية']];
function vDocs(){
  var d=curDoc();
  if(d)return docScreen(d);
  var drafts=S.docs.filter(function(x){return x.status==='draft'&&!(x.type==='PKP'&&pkDone(x))}).reverse();
  var done=S.docs.filter(function(x){return (x.status!=='draft'||(x.type==='PKP'&&pkDone(x)))&&x.type!=='OPN'}).reverse().filter(function(x){return !UI.dt||(UI.dt==='MISC'?['RCV','PKP','RTN','SHP'].indexOf(x.type)<0:x.type===UI.dt)});
  var opn=S.docs.filter(function(x){return x.type==='OPN'})[0];
  var cards=OP_GROUPS.map(function(g2){return '<section class="blk"><div class="sh"><div class="t"><h2>'+g2.t+'</h2><p>'+g2.s+'</p></div></div><div class="ops">'+g2.ops.map(opCard).join('')+'</div></section>'}).join('');
  var dr=drafts.length?'<section class="blk"><div class="sh"><div class="t"><h2>لسه ما اتأكدتش ('+drafts.length+')</h2><p>دي عمليات بدأتها ومخلصتهاش. مفيش أي تأثير على المخزن لحد ما تأكدها.</p></div></div><div class="ops-list">'+drafts.map(function(x){return '<div class="oli"><div class="grow"><b>'+(OPS[x.type]?OPS[x.type].t:TYPES[x.type])+'</b><div class="note">'+docLine(x)+' · <span class="en">'+x.date+'</span></div></div><button class="btn sm pri" data-a="opendoc" data-id="'+x.id+'">كمّل</button><button class="btn sm bad" data-a="delfile" data-id="'+x.id+'">احذف</button></div>'}).join('')+'</div></section>':'';
  var chips='<div class="seg">'+DT_CHIPS.map(function(c){return '<button type="button" data-a="dtf" data-v="'+c[0]+'" aria-pressed="'+(UI.dt===c[0])+'">'+c[1]+'</button>'}).join('')+'</div>';
  var shown=done.slice(0,UI.opsN||30);
  var hist='<section class="blk"><div class="sh"><div class="t"><h2>آخر العمليات</h2><p>كل اللي اتسجل في المخزن. دوس على أي عملية تشوف تفاصيلها.</p></div>'+chips+'</div>'+
    (shown.length?'<div class="ops-list">'+shown.map(function(x){return '<button class="oli click" data-a="opendoc" data-id="'+x.id+'"><div class="grow" style="text-align:start"><b>'+(x.type==='REV'?'إلغاء عملية':OPS[x.type]?OPS[x.type].t:TYPES[x.type])+'</b><div class="note">'+docLine(x)+'</div></div><span class="note en">'+x.date+' · '+(x.no||'')+'</span>'+statusPill(x)+'</button>'}).join('')+'</div>'+(done.length>shown.length?'<button class="btn" data-a="opsmore">عرض المزيد ('+(done.length-shown.length)+')</button>':''):'<div class="empty">مفيش عمليات مسجلة لسه. ابدأ بواحدة من فوق.</div>')+
    (opn?'<p class="note">الرصيد الافتتاحي: <button class="btn sm" data-a="opendoc" data-id="'+opn.id+'">شوفه</button></p>':'')+'</section>';
  return '<div class="hero"><div><div class="eyebrow">Operations</div><h1>إنت <span class="d">عملت إيه؟</span></h1><p>اختار العملية اللي عملتها. هتسجل القطع، وتشوف النتيجة على المخزن قبل ما تأكد.</p></div></div>'+
    cards+dr+hist;
}

/* ---------- the screen of a single operation ---------- */
function linesTable(d,cols){
  if(!d.lines.length)return '<p class="note">لسه ما أضفتش قطع. اختار الموديل واللون والمقاس من فوق.</p>';
  var ed=d.status==='draft';
  return '<div class="scroll"><table><tr><th>القطعة</th>'+cols.map(function(c){return '<th class="'+(c.n?'n':'')+'">'+c.h+'</th>'}).join('')+(ed?'<th></th>':'')+'</tr>'+
   d.lines.map(function(l,i){return '<tr><td>'+piece(l.s)+'</td>'+cols.map(function(c){return '<td class="'+(c.n?'n':'')+'">'+c.f(l,i,ed)+'</td>'}).join('')+(ed?'<td class="n"><button class="btn sm bad" data-a="delline" data-i="'+i+'" aria-label="حذف">حذف</button></td>':'')+'</tr>'}).join('')+'</table></div>';
}
function qtyCol(h){return {h:h||'الكمية',n:1,f:function(l,i,ed){return ed?'<span class="stepper"><button type="button" data-a="lstep" data-idx="'+i+'" data-d="-1" aria-label="أقل">−</button><input type="number" min="1" value="'+l.q+'" data-i="lq" data-idx="'+i+'"><button type="button" data-a="lstep" data-idx="'+i+'" data-d="1" aria-label="أكتر">+</button></span>':fmt(l.q)}}}
function quickAdd(d,extra){
  return skuField('<label class="field">الكمية<span class="stepper"><button type="button" data-a="qstep" data-d="-1" aria-label="أقل">−</button><input id="qa-qty" type="number" min="1" value="1"><button type="button" data-a="qstep" data-d="1" aria-label="أكتر">+</button></span></label>'+(extra||'')+'<button class="btn pri" data-a="qadd">＋ أضف</button>');
}
function photoBox(d){
  var ed=d.status==='draft';
  return '<div class="lav row"><div class="grow"><b>صورة المحضر الممضي من الطرفين</b><div class="note">لازم ترفعها قبل التأكيد.</div></div>'+(d.hdr.photo?pill('اترفعت: '+esc(d.hdr.photo),'ok'):pill('لسه','warn'))+(ed?'<input type="file" accept="image/*" data-c="photo">':'')+'</div>';
}
function detailsHTML(d){
  var h=d.hdr,dt='<label class="field">التاريخ<input type="date" data-i="hdate" value="'+d.date+'"></label>';
  if(d.type==='RCV')return '<div class="row">'+dt+'<label class="field">اسم أو رقم التوريد (اختياري)<input data-i="hf" data-k="supplyNo" value="'+esc(h.supplyNo)+'" placeholder="مثال: توريد 1/11"></label><label class="field">الإجمالي المكتوب في ورقة المصنع (اختياري)<input type="number" min="0" data-i="hf" data-k="declared" value="'+(h.declared||'')+'"></label></div><p class="note">لو كتبت الإجمالي، هتلاقي تحت جدول القطع مقارنته بمجموع اللي سجلته.</p>';
  if(d.type==='FSD')return '<div class="row">'+dt+'</div><div class="choice"><label><input type="radio" name="purpose" value="wash" data-c="purpose"'+(h.purpose==='wash'?' checked':'')+'><span><b>غسيل</b><small>قطع هالك النظافة بتروح المصنع وبترجع جاهزة.</small></span></label><label><input type="radio" name="purpose" value="waste" data-c="purpose"'+(h.purpose==='waste'?' checked':'')+'><span><b>هالك نهائي</b><small>القطع بتخرج من المخزن للمصنع ومش بترجع.</small></span></label></div>';
  if(d.type==='RTN'){
    var ch=S.channels.map(function(c){return '<option value="'+c.id+'"'+(h.channel===c.id?' selected':'')+'>'+esc(c.name)+'</option>'}).join('');
    return '<div class="row"><label class="field">الشركة<select data-c="rtch">'+ch+'</select></label><label class="field">رقم شيت المرتجع (اختياري)<input data-i="hf" data-k="ref" value="'+esc(h.ref)+'" placeholder="مثال: RET-123"></label>'+dt+'</div>';
  }
  return '<div class="row">'+dt+'</div>';
}
function itemsHTML(d){
  var h=d.hdr;
  if(d.type==='RCV'||d.type==='SHP')return quickAdd(d)+matrixBox(d)+linesTable(d,d.type==='SHP'?[qtyCol(),{h:'جاهز عندك',n:1,f:function(l){return fmt(g(l.s,'READY'))}}]:[qtyCol()])+(d.type==='RCV'?'<div data-b="rc-sum"></div>':'');
  if(d.type==='STS'){
    var so=INTERNAL.filter(function(b){return b!=='FACTORY'}).map(function(b){return '<option value="'+b+'">'+ST[b]+'</option>'}).join('');
    return skuField('<label class="field">من<select id="qa-f">'+so+'</select></label><label class="field">إلى<select id="qa-t">'+so.replace('<option value="DIRTY">','<option value="DIRTY" selected>')+'</select></label><label class="field">الكمية<span class="stepper"><button type="button" data-a="qstep" data-d="-1">−</button><input id="qa-qty" type="number" min="1" value="1"><button type="button" data-a="qstep" data-d="1">+</button></span></label><label class="field">السبب<input id="qa-n" placeholder="مثال: بقعة، رطوبة" style="min-width:150px"></label><button class="btn pri" data-a="qadd">＋ أضف</button>')+
      '<p class="note">المسموح: من جاهز إلى هالك نظافة أو هالك نهائي، ومن هالك نظافة إلى هالك نهائي، ومن أي حالة إلى مفقود، ومن مفقود إلى جاهز أو هالك نظافة. من هالك نظافة إلى جاهز ممنوع، لازم يتغسل الأول.</p>'+
      linesTable(d,[{h:'من',f:function(l){return ST[l.f]}},{h:'إلى',f:function(l){return ST[l.t]}},qtyCol(),{h:'السبب',f:function(l){return esc(l.n)}}]);
  }
  if(d.type==='FSD')return quickAdd(d)+linesTable(d,[qtyCol(),{h:h.purpose==='wash'?'هالك نظافة عندك':'هالك نهائي عندك',n:1,f:function(l){return fmt(g(l.s,h.purpose==='wash'?'DIRTY':'DAMAGED'))}}]);
  if(d.type==='FRC')return '<p class="note">اكتب اللي رجع مغسول فعلا. الحد الأقصى هو اللي لسه عند المصنع.</p>'+quickAdd(d)+linesTable(d,[qtyCol(),{h:'لسه عند المصنع',n:1,f:function(l){return fmt(g(l.s,'FACTORY'))}}]);
  if(d.type==='LST')return lstItems(d);
  return '';
}

  var photo=(d.type==='RCV'||d.type==='SHP')?photoBox(d):'';

var CATS_IN=[['RECEIPT','توريد'],['RETURN','مرتجعات'],['FACTORY_RECV','عائد من المصنع'],['LOST_FOUND','مفقود اتلاقى'],['COUNT_GAIN','زيادة جرد']];
var CATS_OUT=[['PICKUP','بيك أب'],['SHOP','المحل'],['FACTORY_SEND','للغسيل'],['FACTORY_WASTE','هالك للمصنع'],['LOSS','مفقود / عجز']];
function golden(){
  var r=UI.rep,rows={},W=WH;
  var key=function(s){return r.group==='sku'?s:SKU.get(s).m};
  var chk={};
  S.moves.forEach(function(m){
    var inW=W.indexOf(m.t)>=0,fW=W.indexOf(m.f)>=0,k=key(m.s);
    var o=rows[k]||(rows[k]={open:0,inn:{},out:{},close:0,chk:0});
    var dl=(inW?m.q:0)-(fW?m.q:0);
    if(m.d<=r.to)o.chk+=dl;
    if(m.ty==='OPENING'){o.open+=m.q;return}
    if(m.d<r.from){o.open+=dl;return}
    if(m.d>r.to)return;
    var OUTT=['PICKUP','SHOP','FACTORY_SEND','FACTORY_WASTE'],INT=['RECEIPT','RETURN','FACTORY_RECV','LOST_FOUND','COUNT_GAIN'];
    if(inW&&!fW){
      if(OUTT.indexOf(m.ty)>=0)o.out[m.ty]=(o.out[m.ty]||0)-m.q;
      else if(m.ty==='COUNT_LOSS')o.out.LOSS=(o.out.LOSS||0)-m.q;
      else{var ci=INT.indexOf(m.ty)>=0?m.ty:'LOST_FOUND';o.inn[ci]=(o.inn[ci]||0)+m.q}
    }else if(fW&&!inW){
      if(INT.indexOf(m.ty)>=0)o.inn[m.ty]=(o.inn[m.ty]||0)-m.q;
      else{var c=OUTT.indexOf(m.ty)>=0?m.ty:'LOSS';o.out[c]=(o.out[c]||0)+m.q}
    }
  });
  return rows;
}
function vReports(){
  var r=UI.rep,G=golden();
  var keys=Object.keys(G).sort(function(a,b){return r.group==='sku'?skuSort(a,b):(mIdx[a]-mIdx[b])});
  var tot={open:0,inn:{},out:{}};
  function sum(o,a){for(var k in a)o[k]=(o[k]||0)+a[k]}
  var body=keys.map(function(k){
    var o=G[k],i=CATS_IN.reduce(function(a,c){return a+(o.inn[c[0]]||0)},0),u=CATS_OUT.reduce(function(a,c){return a+(o.out[c[0]]||0)},0),cl=o.open+i-u;
    if(!o.open&&!i&&!u)return '';
    tot.open+=o.open;sum(tot.inn,o.inn);sum(tot.out,o.out);
    return '<tr><td class="'+(r.group==='sku'?'en':'')+'">'+(r.group==='sku'?k:esc(mname(k)))+'</td><td class="n">'+fmt(o.open)+'</td>'+CATS_IN.map(function(c){return '<td class="n '+((o.inn[c[0]]||0)?'':'zero')+'">'+fmt(o.inn[c[0]]||0)+'</td>'}).join('')+'<td class="n"><b>'+fmt(i)+'</b></td>'+CATS_OUT.map(function(c){return '<td class="n '+((o.out[c[0]]||0)?'':'zero')+'">'+fmt(o.out[c[0]]||0)+'</td>'}).join('')+'<td class="n"><b>'+fmt(u)+'</b></td><td class="n"><b>'+fmt(cl)+'</b></td><td>'+(cl===o.chk?'<span class="posv">✓</span>':'<span class="neg">✗ '+fmt(o.chk)+'</span>')+'</td></tr>'}).join('');
  var ti=CATS_IN.reduce(function(a,c){return a+(tot.inn[c[0]]||0)},0),tu=CATS_OUT.reduce(function(a,c){return a+(tot.out[c[0]]||0)},0);
  var totRow='<tr class="tot"><td>الإجمالي</td><td class="n">'+fmt(tot.open)+'</td>'+CATS_IN.map(function(c){return '<td class="n">'+fmt(tot.inn[c[0]]||0)+'</td>'}).join('')+'<td class="n">'+fmt(ti)+'</td>'+CATS_OUT.map(function(c){return '<td class="n">'+fmt(tot.out[c[0]]||0)+'</td>'}).join('')+'<td class="n">'+fmt(tu)+'</td><td class="n">'+fmt(tot.open+ti-tu)+'</td><td></td></tr>';
  // channels
  var ch={},isI=function(b){return INTERNAL.indexOf(b)>=0};
  var cget=function(id){return ch[id]||(ch[id]={out:0,rr:0,rd:0,rg:0,lost:0})};
  S.moves.forEach(function(m){
    if(m.d<r.from||m.d>r.to)return;
    if(m.ty==='PICKUP'){if(isI(m.t))cget(m.f).out-=m.q;else cget(m.t).out+=m.q}
    if(m.ty==='RETURN'){var sg=isI(m.f)?-1:1,c=cget(isI(m.f)?m.t:m.f),st=isI(m.f)?m.f:m.t;if(st==='READY')c.rr+=sg*m.q;if(st==='DIRTY')c.rd+=sg*m.q;if(st==='DAMAGED')c.rg+=sg*m.q}
    if(m.ty==='RETURN_LOST'){if(isI(m.f))cget(m.t).lost-=m.q;else cget(m.f).lost+=m.q}
  });
  var chRows=Object.keys(ch).map(function(c){var o=ch[c],rec=o.rr+o.rd+o.rg;return '<tr><td>'+esc(chName(c))+'</td><td class="n">'+fmt(o.out)+'</td><td class="n">'+fmt(rec)+'</td><td class="n">'+fmt(o.rr)+' / '+fmt(o.rd)+' / '+fmt(o.rg)+'</td><td class="n">'+fmt(o.lost)+'</td><td class="n">'+(o.out?((rec+o.lost)/o.out*100).toFixed(1)+'%':'—')+'</td><td class="n">'+(rec+o.lost?(o.lost/(rec+o.lost)*100).toFixed(1)+'%':'—')+'</td></tr>'}).join('')||'<tr><td colspan="7" class="note">مفيش حركات شركات في الفترة دي</td></tr>';
  var th='<th class="n">رصيد أول</th>'+CATS_IN.map(function(c){return '<th class="n">+ '+c[1]+'</th>'}).join('')+'<th class="n">= دخل</th>'+CATS_OUT.map(function(c){return '<th class="n">− '+c[1]+'</th>'}).join('')+'<th class="n">= خرج</th><th class="n">رصيد آخر</th><th>تحقق</th>';
  return '<div><h2>التقارير</h2><p class="sub">الجدول الذهبي: رصيد أول + دخل − خرج = رصيد آخر، على مستوى المخزن (جاهز + هالك نظافة + هالك نهائي). التحويل بين الحالات جوه المخزن مش دخل ولا خرج.</p></div>'+
   '<div class="row"><label class="field">من<input type="date" data-i="repfrom" value="'+r.from+'"></label><label class="field">إلى<input type="date" data-i="repto" value="'+r.to+'"></label><label class="field">تجميع حسب<select data-c="repg"><option value="model"'+(r.group==='model'?' selected':'')+'>الموديل</option><option value="sku"'+(r.group==='sku'?' selected':'')+'>SKU</option></select></label></div>'+
   '<div class="scroll" style="max-height:70vh;overflow:auto"><table><tr><th>'+(r.group==='sku'?'SKU':'الموديل')+'</th>'+th+'</tr>'+body+totRow+'</table></div>'+
   '<div class="card grid"><h3>حسب الشركة (في الفترة)</h3><div class="scroll"><table><tr><th>الشركة</th><th class="n">خرج (بيك أب)</th><th class="n">مرتجع مستلم</th><th class="n">جاهز / هالك نظافة / هالك نهائي</th><th class="n">مفقود تلقائي</th><th class="n">نسبة المرتجع (تقريبي)</th><th class="n">نسبة المفقود من المرتجع</th></tr>'+chRows+'</table></div><p class="note">نسبة المرتجع هنا بدون ربط بدفعة البيك أب. هتبقى دقيقة لما نربط المرتجع بأوردره الأصلي.</p></div>';
}
function bind(k,d){
  if(!d)return '';
  if(k==='rc-sum'){var s=d.lines.reduce(function(a,l){return a+(+l.q||0)},0),dc=+d.hdr.declared||0;if(!dc)return '';var df=s-dc;return '<div class="recon '+(df===0?'ok':'warn')+'"><div class="rc-row"><span>المكتوب في ورقة المصنع</span><b class="en">'+fmt(dc)+'</b></div><div class="rc-row"><span>اللي سجلته هنا</span><b class="en">'+fmt(s)+'</b></div><div class="rc-row tot"><span>الفرق</span><b class="en">'+(df===0?'0':(df>0?'+':'−')+fmt(Math.abs(df)))+'</b></div><p>'+(df===0?'مطابق لورقة المصنع.':df<0?'لسه ناقص تسجل <b class="en">'+fmt(-df)+'</b> قطعة عشان توصل للي في الورقة.':'اللي سجلته أكتر من الورقة بـ <b class="en">'+fmt(df)+'</b> قطعة.')+'</p></div>'}
  if(d.type==='PKP'){
    var req=pkReq(d),p=0,r=0;Object.keys(req).forEach(function(s){r+=req[s];p+=pkPrep(d,s,req[s])});
    if(k==='pk-prep')return fmt(p);
    if(k==='pk-short')return '<span class="'+(r-p?'neg':'')+'">'+fmt(r-p)+'</span>';
    if(k.indexOf('pk-sh-')===0){var s2=k.slice(6),sh=(req[s2]||0)-pkPrep(d,s2,req[s2]||0);return sh?'<span class="neg">'+sh+'</span>':'<span class="zero">0</span>'}
  }
  if(d.type==='RTN'){
    var v=rtVar(d);
    if(k==='rt-sum')return '<div class="row">'+pill('متوقع '+fmt(v.tot.e),'mute')+pill('مستلم '+fmt(v.tot.c),'info')+(v.lost?pill('مفقود تلقائي '+fmt(v.lost),'bad'):pill('مفيش مفقود','ok'))+(v.sur?pill('زيادة '+fmt(v.sur),'warn'):'')+'</div>'+(v.pairs.length?'<div class="msg warn"><div><b>اقتراح ربط:</b><ul>'+v.pairs.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul></div></div>':'');
    if(k.indexOf('rt-row-')===0){var l=d.lines[+k.slice(7)];if(!l)return '';var t=[];if(l.lost)t.push('<span class="neg">ناقص '+l.lost+' (هيتسجل مفقود)</span>');if(l.pr)t.push('<span class="note">مقاس غلط '+l.pr+'</span>');if(l.su)t.push('<span style="color:var(--warn)">زيادة '+l.su+'</span>');return t.join(' ')||'<span class="posv">✓</span>'}
  }
  if(d.type==='CNT'){
    var cv=cntVar(d);
    if(k==='cn-sum')return '<div class="row">'+pill('أصناف معدودة '+Object.keys(d.hdr.cnt).length,'info')+(d.hdr.reveal?pill('عجز '+fmt(cv.short),cv.short?'bad':'ok')+pill('زيادة '+fmt(cv.sur),cv.sur?'warn':'ok')+pill('أصناف فيها فرق '+cv.skus,'mute'):pill('الأرقام مخفية','mute'))+'</div>';
    if(k.indexOf('cn-row-')===0){if(!d.hdr.reveal)return '';var s3=k.slice(7),c=d.hdr.cnt[s3];if(!c)return '';var t2=[];['READY','DIRTY','DAMAGED'].forEach(function(b){var kk={READY:'r',DIRTY:'d',DAMAGED:'g'}[b],x=c[kk];if(x===''||x==null)x=0;var df=(+x)-g(s3,b);if(df)t2.push('<span class="'+(df<0?'neg':'posv')+'">'+ST[b]+' '+(df>0?'+':'')+df+'</span>')});return t2.join(' ')||'<span class="posv">✓</span>'}
  }
  return '';
}

  deldoc:function(){var d=curDoc();if(d&&d.status==='draft'){S.docs=S.docs.filter(function(x){return x!==d});UI.sel=null;dirty();render()}},

  delline:function(el){var d=curDoc();d.lines.splice(+el.dataset.i,1);dirty();render()},
  qadd:function(){
    var d=curDoc(),s=pickedSku(),q=+($('#qa-qty')||{}).value;
    if(!SKU.has(s)){msg('bad','اختار الموديل واللون والمقاس الأول',[]);render();return}
    UI.pk={m:$('#pk-m').value,c:$('#pk-c').value,z:$('#pk-z').value};
    if(!(q>0)){msg('bad','الكمية لازم تكون أكبر من صفر',[]);render();return}
    UI.msg=null;
    if(d.type==='RTN')d.lines.push({s:s,e:q,r:'',d:'',g:''});
    else if(d.type==='STS'){d.lines.push({s:s,q:q,f:$('#qa-f').value,t:$('#qa-t').value,n:$('#qa-n').value})}
    else if(d.type==='LST'){d.lines.push({s:s,q:q,a:$('#qa-a').value,amt:+($('#qa-amt').value||0)})}
    else{var ex=d.lines.find(function(l){return l.s===s});if(ex)ex.q+=q;else d.lines.push({s:s,q:q})}
    dirty();render();
  },
  lstadd:function(el){var d=curDoc(),s=el.dataset.s;d.lines.push({s:s,q:g(s,'LOST'),a:'writeoff',amt:0});dirty();render()},
  mxadd:function(){
    var d=curDoc(),n=0;$$('[data-mx]').forEach(function(i){var q=+i.value;if(q>0){var s=i.dataset.mx,ex=d.lines.find(function(l){return l.s===s});if(ex)ex.q+=q;else d.lines.push({s:s,q:q});n+=q}});
    if(!n){msg('bad','الشبكة فاضية',['اكتب كميات في الخانات الأول']);}else UI.msg=null;dirty();render();
  },
  pkall:function(){var d=curDoc(),req=pkReq(d);Object.keys(req).forEach(function(s){d.hdr.prep[s]=Math.min(req[s],g(s,'READY'))});dirty();render()},
  rtfrom:function(){
    var d=curDoc(),pk=S.docs.find(function(x){return x.id===$('#rt-pk').value});if(!pk)return;
    var refs=($('#rt-refs').value||'').split(',').map(function(x){return x.trim()}).filter(Boolean);
    var os=refs.length?pk.hdr.orders.filter(function(o){return refs.indexOf(o.ref)>=0}):pk.hdr.orders.slice(0,3);
    if(!os.length){msg('bad','مفيش أوردرات بالأكواد دي في البيك أب',[]);render();return}
    os.forEach(function(o){o.lines.forEach(function(s){var ex=d.lines.find(function(l){return l.s===s});if(ex)ex.e=(+ex.e||0)+1;else d.lines.push({s:s,e:1,r:'',d:'',g:''})})});
    UI.msg=null;dirty();render();
  },
  cntall:function(){var d=curDoc();d.hdr.models=MORDER.slice();d.hdr.snap=cntSnap(d.hdr.models);d.hdr.cur=MORDER[0];dirty();render()},
  cntstart:function(){var d=curDoc();var ms=$$('[data-c=cntm]').filter(function(i){return i.checked}).map(function(i){return i.dataset.m});if(!ms.length){msg('bad','اختار موديل واحد على الأقل',[]);render();return}d.hdr.models=ms;d.hdr.snap=cntSnap(ms);d.hdr.cur=ms[0];UI.msg=null;dirty();render()},
  cntcur:function(el){curDoc().hdr.cur=el.dataset.m;render()},
  cntreveal:function(){var d=curDoc();d.hdr.reveal=!d.hdr.reveal;dirty();render()},
  addch:function(){var n=($('#newch').value||'').trim();if(!n)return;var id='CH_'+n.toUpperCase().replace(/[^A-Z0-9؀-ۿ]+/g,'_');if(S.channels.some(function(c){return c.id===id})){msg('bad','الشركة موجودة',[]);render();return}S.channels.push({id:id,name:n});dirty();render()},
  reset:function(){if(UI.confirmReset){try{localStorage.removeItem(KEY)}catch(e){}S=seed();BAL=null;UI.sel=null;UI.msg=null;UI.confirmReset=false;msg('ok','رجعت البيانات للبداية',[]);render()}else{UI.confirmReset=true;msg('warn','متأكد؟ كل المستندات والحركات اللي عملتها هتتمسح',['دوس "رجّع البيانات للبداية" تاني للتأكيد']);render()}},
  csv:function(el){
    var v=el.dataset.v,rows=[],title='';
    if(v==='master'){title='Master الأصناف';rows=[['sku','model','model_name','color','size','min_alert_old','opening_qty']].concat(D.skus.map(function(k){return [k.id,k.m,MODEL.get(k.m).name,k.c,k.s,k.min,k.open]}))}
    if(v==='stock'){title='الأرصدة الحالية';rows=[['sku','ready','dirty','damaged','at_factory','lost']].concat(D.skus.map(function(k){return [k.id].concat(INTERNAL.map(function(b){return g(k.id,b)}))}))}
    if(v==='ledger'){title='الحركات';rows=[['id','date','doc','type','sku','qty','from','to','note','by']].concat(S.moves.map(function(m){return [m.i,m.d,m.doc,m.ty,m.s,m.q,m.f,m.t,m.n||'',m.by||'']}))}
    UI.modal={title:title,text:csv(rows)};render();
  },
  copy:function(){
    var t=$('#mtxt'),st=$('#cpst');t.select();
    var ok=function(){st.textContent='اتنسخ'};var fail=function(){st.textContent='انسخ يدويا: Ctrl+C'};
    try{navigator.clipboard.writeText(t.value).then(ok,fail)}catch(e){fail()}
  }
};
var INP={
  stq:function(el){UI.st.q=el.value;UI.st.n=150;rerenderKeep(el)},
  ledq:function(el){UI.led.q=el.value;UI.led.n=200;rerenderKeep(el)},
  repfrom:function(el){UI.rep.from=el.value||UI.rep.from;rerenderKeep(el)},
  repto:function(el){UI.rep.to=el.value||UI.rep.to;rerenderKeep(el)},
  hf:function(el){var d=curDoc();d.hdr[el.dataset.k]=(el.type==='number')?(+el.value||0):el.value;save();live()},
  hdate:function(el){var d=curDoc();if(el.value){d.date=el.value;save()}},
  why:function(el){curDoc().overrideWhy=el.value;save()},
  lq:function(el){var d=curDoc();d.lines[+el.dataset.idx].q=Math.max(1,+el.value||1);save();live()},
  prep:function(el){var d=curDoc(),r=+el.dataset.r,v=el.value===''?r:Math.max(0,Math.min(r,Math.floor(+el.value)));d.hdr.prep[el.dataset.s]=v;el.style.borderColor=v>(+el.dataset.have)?'var(--bad)':'';save();live()},
  rt:function(el){var d=curDoc(),l=d.lines[+el.dataset.idx];l[el.dataset.f]=el.value===''?'':Math.max(0,Math.floor(+el.value));save();live()},
  cn:function(el){var d=curDoc(),c=d.hdr.cnt[el.dataset.s]||(d.hdr.cnt[el.dataset.s]={r:'',d:'',g:''});c[el.dataset.f]=el.value===''?'':Math.max(0,Math.floor(+el.value));var any=c.r!==''||c.d!==''||c.g!=='';if(!any)delete d.hdr.cnt[el.dataset.s];save();live()}
};
function rerenderKeep(el){var id=el.id,pos=el.selectionStart;render();var n=id?document.getElementById(id):$('[data-i="'+el.dataset.i+'"]');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}}
var CHG={
  mm:function(el){UI.st.mm=el.value;render()},mstate:function(el){UI.st.state=el.value;render()},
  stmodel:function(el){UI.st.model=el.value;UI.st.n=150;render()},stflt:function(el){UI.st.flt=el.value;UI.st.n=150;render()},
  dt:function(el){UI.dt=el.value;render()},ledty:function(el){UI.led.type=el.value;UI.led.n=200;render()},
  repg:function(el){UI.rep.group=el.value;render()},
  newdoc:function(el){var t=el.value;if(!t)return;UI.msg=null;if(t==='IMPORT'){UI.drawer={kind:'upload',type:'pickup',channel:'CH_VENDOOR',date:UI.date,res:null,err:''};el.value='';render();return}newDoc(t);render()},
  photo:function(el){var f=el.files&&el.files[0];var d=curDoc();d.hdr.photo=f?f.name:'';save();render()},
  purpose:function(el){curDoc().hdr.purpose=el.value;dirty();render()},
  rtch:function(el){curDoc().hdr.channel=el.value;dirty()},rtlink:function(el){curDoc().hdr.link=el.checked;save();live()},
  ovr:function(el){curDoc().override=el.checked;save()},
  cx:function(el){var d=curDoc();if(el.checked)d.hdr.cx[el.dataset.ref]=1;else delete d.hdr.cx[el.dataset.ref];dirty();render()},
  alias:function(el){var c=el.dataset.code,m=el.value;if(!m)return;S.alias[c]=m;S.docs.forEach(function(d){if(d.type==='PKP'&&d.status==='draft')resolveBad(d)});dirty();msg('ok','اتربط الكود '+c+' بالموديل '+m,[]);render()},
  cntm:function(){},
  mxm:function(el){UI.mx=el.value;var keep={};$$('[data-mx]').forEach(function(i){if(+i.value>0)keep[i.dataset.mx]=i.value});render()}
};
document.addEventListener('click',function(e){var el=e.target.closest('[data-a]');if(el&&ACT[el.dataset.a]){ACT[el.dataset.a](el,e);if(['goto','opendoc'].indexOf(el.dataset.a)<0&&el.dataset.a!=='qadd')return}});
document.addEventListener('input',function(e){var el=e.target;if(el.dataset&&el.dataset.i&&INP[el.dataset.i])INP[el.dataset.i](el);if(el.id==='actor'){S.actor=el.value;save()}});
document.addEventListener('change',function(e){var el=e.target;if(el.id==='upfile'){handleFileInput(el);return}if(el.dataset&&el.dataset.c&&CHG[el.dataset.c])CHG[el.dataset.c](el)});
/* ---------- desk / drawer events ---------- */
Object.assign(ACT,{
  pkf:function(el){UI.pkf=el.dataset.v;render()},
  pkreg:function(){
    var d=curDoc(),refs=$$('[data-sel]').filter(function(i){return i.checked}).map(function(i){return i.dataset.sel});
    if(!refs.length){msg('bad','حدد أوردر واحد على الأقل',['علّم الأوردرات اللي خرجت من خانة الاختيار على اليمين.']);render();return}
    var matched=refs.map(function(r){var o=d.hdr.orders.find(function(q){return q.ref===r});return {pk:d.id,ref:r,t:'',label:d.hdr.label,pcs:o.lines.length}});
    var sd={id:'d'+(S.did++),type:'SCN',status:'draft',no:null,date:UI.date,by:S.actor,log:[{t:Date.now(),by:S.actor,m:'تسجيل يدوي من '+d.hdr.label}],hdr:{emp:S.actor,src:'تسجيل يدوي من '+d.hdr.label,channel:d.hdr.channel,matched:matched,dups:[],already:[],unk:[]},lines:[]};
    S.docs.push(sd);UI.sel=sd.id;UI.msg=null;dirty();render();
  },
  cntdue:function(){var d=curDoc(),ms=cntDue().filter(function(x){return x.due}).map(function(x){return x.m});if(!ms.length)return;d.hdr.models=ms;d.hdr.snap=cntSnap(ms);d.hdr.cur=ms[0];UI.msg=null;dirty();render()},
  startop:function(el){var t=el.dataset.t;UI.msg=null;if(t==='PKP'||t==='SCN'){UI.drawer={kind:'upload',type:t==='SCN'?'scan':'pickup',channel:'CH_VENDOOR',date:UI.date,emp:lastEmp(),res:null,err:''};render();return}newDoc(t);render()},
  backhome:function(){UI.sel=null;UI.msg=null;render()},
  dtf:function(el){UI.dt=el.dataset.v;UI.opsN=30;render()},
  opsmore:function(){UI.opsN=(UI.opsN||30)+30;render()},
  opendrawer:function(el){var k=el.dataset.k;UI.drawer=(k==='upload'||k==='scan')?{kind:'upload',type:k==='scan'?'scan':'pickup',channel:'CH_VENDOOR',date:UI.date,emp:lastEmp(),res:null,err:''}:{kind:k};render()},
  closedrawer:function(){UI.drawer=null;render()},
  uptype:function(el){var d=UI.drawer;d.type=el.dataset.v;d.res=null;d.err='';d.rows=null;render()},
  pickfile:function(){$('#upfile').click()},
  upsave:function(){
    var d=UI.drawer,r=d&&d.res;if(!r)return;
    if(d.type==='scan'){
      var sd={id:'d'+(S.did++),type:'SCN',status:'draft',no:null,date:UI.date,by:S.actor,log:[{t:Date.now(),by:S.actor,m:'اتعملت من ملف '+d.fname}],hdr:{emp:d.emp,src:d.fname,channel:'CH_VENDOOR',matched:r.matched,dups:r.dups,already:r.already,unk:r.unk},lines:[]};
      S.docs.push(sd);UI.sel=sd.id;UI.drawer=null;UI.tab='docs';UI.msg=null;dirty();render();return;
    }
    var doc;
    if(d.type==='pickup'){
      var n=S.docs.filter(function(x){return x.type==='PKP'}).length+1;
      doc={id:'d'+(S.did++),type:'PKP',status:'draft',no:null,date:d.date||UI.date,by:S.actor,log:[{t:Date.now(),by:S.actor,m:'اتعملت من ملف '+d.fname}],hdr:{channel:d.channel,label:'بيك أب '+n,src:d.fname,orders:r.orders,prep:{},cx:{}},lines:[]};
      msg(r.unk.length?'warn':'ok','اتستورد '+r.orders.length+' أوردر',[].concat(r.dups.length?[r.dups.length+' أوردر مكرر اتخطّى']:[],r.unk.length?['أكواد غير معروفة: '+r.unk.join('، ')+' (اربطها من المستند)']:[],['بيانات العملاء ما اتحفظتش']));
    }else{
      var cnt={};Object.keys(r.lines).forEach(function(s){cnt[s]={r:r.lines[s],d:'',g:''}});
      var ms=MORDER.filter(function(m){return Object.keys(r.lines).some(function(s){return SKU.get(s).m===m})});
      doc={id:'d'+(S.did++),type:'CNT',status:'draft',no:null,date:d.date||UI.date,by:S.actor,log:[{t:Date.now(),by:S.actor,m:'اتعملت من ملف '+d.fname}],hdr:{models:ms,cnt:cnt,snap:cntSnap(ms),reveal:false,kind:'partial',cur:ms[0],src:d.fname},lines:[]};
      msg('ok','اتعمل جرد من الملف',[r.n+' صنف · '+fmt(r.total)+' قطعة (عدّ جاهز)','راجع الأرقام واضغط "اكشف الفروق" قبل التأكيد']);
    }
    S.docs.push(doc);UI.sel=doc.id;UI.date=doc.date;UI.drawer=null;UI.tab='docs';dirty();render();
  },
  delfile:function(el){var d=S.docs.find(function(x){return x.id===el.dataset.id});if(d&&d.status==='draft'){S.docs=S.docs.filter(function(x){return x!==d});if(UI.sel===d.id)UI.sel=null;dirty();render();toast('اتمسح الملف')}},
  exc:function(el){UI.desk.exc=UI.desk.exc===el.dataset.id?null:el.dataset.id;render()},
  dline:function(el){UI.desk.line=el.dataset.v;render()},
  dstate:function(el){UI.desk.state=el.dataset.v;render()},
  dview:function(el){UI.desk.view=el.dataset.v;render()},
  dmore:function(){UI.desk.n+=200;render()},
  savesettings:function(){
    var v=function(id,def){var x=Math.round(+($('#'+id).value));return x>=1?x:def},s=S.settings;
    s.lookback=v('sv-lookback',s.lookback);s.cover=v('sv-cover',s.cover);s.excess=v('sv-excess',s.excess);s.dead=v('sv-dead',s.dead);
    save();UI.drawer=null;render();toast('اتحفظت الإعدادات');
  }
});
Object.assign(ACT,{
  qstep:function(el){var i=$('#qa-qty');if(i)i.value=Math.max(1,(+i.value||1)+(+el.dataset.d))},
  lstep:function(el){var d=curDoc(),l=d.lines[+el.dataset.idx];if(l){l.q=Math.max(1,(+l.q||1)+(+el.dataset.d));dirty();render()}}
});
Object.assign(INP,{
  upemp:function(el){if(UI.drawer)UI.drawer.emp=el.value;var b=$('[data-a=upsave]');if(b&&UI.drawer&&UI.drawer.res&&UI.drawer.type==='scan')b.disabled=!(UI.drawer.res.matched.length&&el.value.trim())},
  dq:function(el){UI.desk.q=el.value;rerenderKeep(el)},
  update:function(el){if(UI.drawer&&el.value)UI.drawer.date=el.value},
  bname:function(el){S.bn=S.bn||{};S.bn[el.dataset.sig]=el.value;save()}
});
Object.assign(CHG,{
  ledgrp:function(el){UI.led.group=el.value;render()},
  ack:function(el){curDoc().ack=el.checked;save();render()},
  pkm:function(){fillPicker()},pkc:function(){pkHint()},pkz:function(){pkHint()},
  setdate:function(el){UI.date=el.value;UI.desk.exc=null;render()},
  upch:function(el){var d=UI.drawer;d.channel=el.value;if(d.type==='pickup'&&d.rows){try{d.res=importRows(d.rows,d.fname,d.channel);d.err=''}catch(e){d.err=String(e.message||e)}}render()}
});

/* ---------- tooltip, drag and drop, keyboard ---------- */
var tip=document.createElement('div');tip.id='tip';tip.hidden=true;document.body.appendChild(tip);
document.addEventListener('mouseover',function(e){
  var t=e.target.closest&&e.target.closest('[data-tip],[data-tiph]');
  if(!t||!(t.getAttribute('data-tip')||t.getAttribute('data-tiph'))){tip.hidden=true;return}
  var th=t.getAttribute('data-tiph');
  if(th){tip.style.whiteSpace='normal';tip.innerHTML=th}else{tip.style.whiteSpace='pre-line';tip.textContent=t.getAttribute('data-tip')}
  tip.hidden=false;
  var r=t.getBoundingClientRect(),w=tip.offsetWidth,h=tip.offsetHeight,x=Math.min(Math.max(8,r.left+r.width/2-w/2),window.innerWidth-w-8),y=r.top-h-8;
  if(y<8)y=r.bottom+8;tip.style.left=x+'px';tip.style.top=y+'px';
});
window.addEventListener('scroll',function(){tip.hidden=true},{passive:true});
document.addEventListener('dragover',function(e){var z=e.target.closest&&e.target.closest('#dropz');if(z){e.preventDefault();z.classList.add('on')}});
document.addEventListener('dragleave',function(e){var z=e.target.closest&&e.target.closest('#dropz');if(z)z.classList.remove('on')});
document.addEventListener('drop',function(e){var z=e.target.closest&&e.target.closest('#dropz');if(!z)return;e.preventDefault();var f=e.dataTransfer&&e.dataTransfer.files[0];if(f)handleFile(f)});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&UI.drawer){UI.drawer=null;render();return}
  var z=e.target.id==='dropz';if(z&&(e.key==='Enter'||e.key===' ')){e.preventDefault();$('#upfile').click()}
});
window.addEventListener('hashchange',function(){var h=location.hash.slice(1);if(VIEWS[h]&&h!==UI.tab){UI.tab=h;render()}});

/* ---------- boot ---------- */
load();
var dl=$('#skuList');dl.innerHTML=D.skus.slice().sort(function(a,b){return skuSort(a.id,b.id)}).map(function(k){return '<option value="'+k.id+'" label="'+esc(MODEL.get(k.m).name+' '+k.c+' '+k.s)+'"></option>'}).join('');
var h0=(location.hash||'').slice(1);if(h0==='overview'||h0==='stock')h0='desk';if(VIEWS[h0])UI.tab=h0;
var ip=document.createElement('input');ip.type='file';ip.id='upfile';ip.accept='.xlsx,.xls,.csv';ip.hidden=true;document.body.appendChild(ip);
render();
})();
</script>
