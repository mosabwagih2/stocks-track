<style>
/* Sidebar toggle (desktop): a slim top bar with a panel button. Ctrl+B also toggles. The rail slides out and the page widens. */
#topbar{position:fixed;top:0;left:0;right:224px;height:48px;z-index:20;display:flex;align-items:center;gap:10px;padding-inline:16px;background:color-mix(in srgb,var(--page) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);color:var(--muted);font-weight:500}
#topbar button{all:unset;cursor:pointer;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--ink)}
#topbar button:hover{background:var(--lav)}
#topbar button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#topbar svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
@media (min-width:821px){
  body{overflow-x:clip}
  .main{padding-top:64px}
  .rail{width:224px;will-change:transform}
  html.rail-off .shell{grid-template-columns:0px minmax(0,1fr)}
  html.rail-off .rail{transform:translateX(100%);visibility:hidden}
  html.rail-off #topbar{right:0}
}
@media (min-width:821px) and (prefers-reduced-motion:no-preference){
  html.rail-anim .shell{transition:grid-template-columns .18s cubic-bezier(.4,0,.2,1)}
  html.rail-anim .rail{transition:transform .18s cubic-bezier(.4,0,.2,1),visibility 0s linear 0s}
  html.rail-anim.rail-off .rail{transition:transform .18s cubic-bezier(.4,0,.2,1),visibility 0s linear .18s}
  html.rail-anim #topbar{transition:right .18s cubic-bezier(.4,0,.2,1)}
}
@media (max-width:820px){#topbar{display:none}}
</style>
<div id="topbar"><button type="button" id="railtoggle" aria-label="إخفاء أو إظهار القائمة الجانبية" aria-expanded="true" title="القائمة الجانبية (Ctrl+B)"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M15 4v16"/></svg></button><span>Fémini Stock</span></div>
<script>(function(){var h=document.documentElement,b=document.getElementById('railtoggle');function set(off,save,anim){if(anim)h.classList.add('rail-anim');h.classList.toggle('rail-off',off);b.setAttribute('aria-expanded',off?'false':'true');if(save){try{localStorage.setItem('fs-rail-off',off?'1':'0')}catch(e){}}}
try{if(localStorage.getItem('fs-rail-off')==='1')set(true)}catch(e){}
b.addEventListener('click',function(){set(!h.classList.contains('rail-off'),true,true)});
document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='b'){var t=e.target;if(t&&/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))return;e.preventDefault();set(!h.classList.contains('rail-off'),true,true)}})})()</script>
